<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>kalawy — الحصة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<style>
/* ══ RESET ══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html{scroll-behavior:smooth}

/* ══ BASE ══ */
body{
  font-family:'Tajawal',sans-serif;
  background:#eceae5;
  color:#1a1a1a;
  min-height:100vh;
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#c0bab5;border-radius:99px}
.hidden{display:none!important}

/* ══ PLYR ══ */
.plyr{
  --plyr-color-main:#1a6b5f;
  --plyr-range-fill-background:#1a6b5f;
  --plyr-font-family:'Tajawal',sans-serif;
  --plyr-font-size-base:14px;
  border-radius:0!important;
}
.plyr__control--overlaid{background:rgba(26,107,95,.85)!important}
.plyr__control--overlaid:hover{background:#1a6b5f!important}

/* ══ DEVTOOLS ══ */
#dto{display:none;position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,.97);
  flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}
#dto .di{font-size:4rem}
#dto .dt{font-size:1.5rem;font-weight:900;color:#f87171}
#dto .ds{font-size:.9rem;color:#aaa;line-height:1.85;max-width:340px}

/* ══ PAGE ══ */
.page{
  max-width:860px;
  margin:0 auto;
  padding:36px 20px 60px;
  position:relative;
  z-index:1;
}

/* ══ LESSON TITLE ══ */
.lesson-title{
  text-align:center;
  font-size:clamp(1.3rem,3vw,1.75rem);
  font-weight:900;
  color:#1a1a1a;
  margin-bottom:24px;
  line-height:1.35;
  letter-spacing:-.01em;
}

/* ══ INFO PILLS ══ */
.pills{display:flex;gap:12px;margin-bottom:16px}
.pill{
  flex:1;
  padding:11px 20px;
  border-radius:12px;
  font-weight:700;
  font-size:.92rem;
  text-align:center;
  font-family:'Inter',monospace;
}
.pill-blue{
  background:#dce9f8;
  color:#4a7ec7;
  border:1px solid #c2d6f0;
}
.pill-red{
  background:#fde8e8;
  color:#e53232;
  border:1px solid #f5c2c2;
  font-weight:900;
  letter-spacing:.02em;
}

/* ══ TABS ══ */
.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#fff;
  border:1px solid #e2ddd8;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:22px;
}
.tab{
  padding:13px 8px;
  border:none;
  background:transparent;
  font-family:'Tajawal',sans-serif;
  font-weight:700;
  font-size:.9rem;
  cursor:pointer;
  color:#888;
  border-left:1px solid #e2ddd8;
  transition:.15s;
}
.tab:last-child{border-left:none}
.tab.on{background:#fff;color:#1a1a1a;font-weight:800}
.tab:hover:not(.on){background:#f8f7f5;color:#444}

/* ══ VIDEO CARDS (list) ══ */
.vid-list{display:flex;flex-direction:column;gap:14px}
.vid-card{
  background:#fff;
  border-radius:16px;
  padding:22px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
  gap:16px;
  transition:.18s;
}
.vid-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.11);transform:translateY(-1px)}

/* right side of card */
.vc-right{display:flex;align-items:center;gap:14px}
.vc-title{font-weight:700;font-size:1rem;color:#1a1a1a}

/* play / check button */
.vc-play{
  width:48px;height:48px;
  border-radius:12px;
  background:#dde9f8;
  border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  color:#4a7ec7;
  font-size:1.1rem;
  flex-shrink:0;
  transition:.15s;
}
.vc-play:hover{background:#c8daf4}
.vc-play.done{background:#d4f5e9;color:#0f7a5e}

/* watch button */
.vc-watch{
  background:#1a6b5f;
  color:#fff;
  border:none;
  border-radius:10px;
  padding:11px 22px;
  font-family:'Tajawal',sans-serif;
  font-weight:700;
  font-size:.9rem;
  cursor:pointer;
  transition:.18s;
  flex-shrink:0;
  white-space:nowrap;
}
.vc-watch:hover{background:#155a50}
.vc-watch.done-btn{background:#e8f5f2;color:#0f7a5e;border:1px solid #b8e8d8}

/* ══ PLAYER VIEW ══ */
.player-view{display:flex;flex-direction:column;gap:14px}

/* back button */
.back-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:46px;height:46px;
  border-radius:12px;
  background:#1a6b5f;
  border:none;
  cursor:pointer;
  color:#fff;
  font-size:1.15rem;
  transition:.15s;
  align-self:flex-end;
}
.back-btn:hover{background:#155a50}

/* video title box */
.player-title-box{
  border:1.5px solid #b8d0f4;
  border-radius:14px;
  padding:14px 24px;
  text-align:center;
  font-weight:800;
  font-size:1.15rem;
  color:#4a6ec7;
  background:#f4f8fe;
}

/* player wrapper */
.player-frame{
  background:#1a1a2e;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.25);
  position:relative;
}

/* watermark */
.wm{
  position:absolute;z-index:60;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  animation:wf 2.8s ease-in-out infinite;
}
@keyframes wf{0%,100%{opacity:.45;transform:rotate(var(--r,-9deg))}50%{opacity:.82;transform:rotate(var(--r,-9deg)) translateY(-5px)}}
.wm-av{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#a78bfa);
  box-shadow:0 3px 12px rgba(124,58,237,.5);
  display:flex;align-items:center;justify-content:center;
}
.wm-av svg{width:65%;height:65%}
.wm-id{
  font-family:'Inter',monospace;font-size:11px;font-weight:900;
  color:#ff3333;text-shadow:0 1px 6px rgba(0,0,0,.95);
  background:rgba(0,0,0,.6);padding:2px 8px;border-radius:99px;
  border:1px solid rgba(255,40,40,.3);white-space:nowrap;
}

/* adblock */
.adb-ov{
  position:absolute;inset:0;z-index:200;background:rgba(10,10,20,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:24px;
}
.adb-ov .ai{font-size:2.5rem}
.adb-ov .at{font-weight:900;color:#f87171;font-size:1rem}
.adb-ov .as{font-size:.82rem;color:#aaa;max-width:280px;line-height:1.75}

/* ══ EXAM ══ */
.exam-wrap{display:flex;flex-direction:column;gap:14px}
.exam-intro{
  background:#fff;border-radius:16px;padding:36px;text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}
.ei-ico{font-size:3rem;margin-bottom:12px;display:block}
.ei-title{font-size:1.3rem;font-weight:900;margin-bottom:8px}
.ei-sub{font-size:.88rem;color:#666;line-height:1.75;margin-bottom:18px;max-width:380px;margin-inline:auto}
.ei-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.ei-m{padding:8px 16px;border-radius:99px;font-size:.8rem;font-weight:700;background:#f5f3f0;border:1px solid #e0ddd8}

/* exam timer */
.etrow{
  display:flex;align-items:center;gap:12px;
  background:#fff;border-radius:12px;padding:12px 18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.etbar{flex:1;height:6px;background:#f0eeea;border-radius:99px;overflow:hidden}
.etf{height:100%;background:linear-gradient(90deg,#1a6b5f,#34d399);border-radius:99px;transition:width 1s linear}
.etv{font-family:'Inter',monospace;font-weight:900;font-size:1rem;color:#1a6b5f;white-space:nowrap}
.etv.warn{color:#e53232}

/* Q cards */
.qc{
  background:#fff;border-radius:14px;padding:20px 22px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  border:2px solid transparent;transition:.2s;
}
.qc.ans{border-color:#dde9f8}
.qn{font-size:.68rem;color:#999;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.qdot{width:5px;height:5px;border-radius:50%;background:#4a7ec7;flex-shrink:0}
.qt{font-weight:700;font-size:.96rem;margin-bottom:14px;line-height:1.72;user-select:text}
.qi{width:100%;max-height:200px;object-fit:contain;border-radius:10px;margin-bottom:12px;display:block;border:1px solid #e0ddd8}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;
  border:1.5px solid #e0ddd8;background:#fafaf8;cursor:pointer;transition:.16s}
.opt:hover{border-color:#b8d0f4;background:#f4f8fe}
.opt.sel{border-color:#4a7ec7;background:#eef4fd}
.opt.cor{border-color:#34d399!important;background:#edfdf7!important;pointer-events:none}
.opt.wrg{border-color:#f87171!important;background:#fef2f2!important;pointer-events:none}
.opt.ntl{pointer-events:none;opacity:.5}
.ol{width:26px;height:26px;border-radius:50%;border:2px solid #ddd;display:grid;place-items:center;
  font-size:.68rem;font-weight:700;flex-shrink:0;color:#888;transition:.14s}
.opt.sel .ol{background:#4a7ec7;border-color:#4a7ec7;color:#fff}
.opt.cor .ol{background:#34d399;border-color:#34d399;color:#fff}
.opt.wrg .ol{background:#f87171;border-color:#f87171;color:#fff}
.ot{font-size:.87rem;font-weight:600;flex:1;user-select:text}
.oi{font-size:.85rem;margin-right:auto;flex-shrink:0}

/* exam sticky footer */
.ef{
  position:sticky;bottom:0;
  background:rgba(236,234,229,.95);backdrop-filter:blur(12px);
  border-top:1px solid #ddd;
  padding:12px 0;display:flex;align-items:center;gap:14px;
  z-index:100;flex-wrap:wrap;
}
.ep{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#666}
.epb{width:120px;height:5px;background:#e0ddd8;border-radius:99px;overflow:hidden}
.epf{height:100%;background:#1a6b5f;border-radius:99px;transition:width .25s}

/* score */
.sw{
  background:#fff;border-radius:16px;padding:20px 24px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}
.sb{font-size:2.8rem;font-weight:900;letter-spacing:-.05em;line-height:1}
.sb.p{color:#1a6b5f}.sb.f{color:#e53232}
.si{flex:1}.sl{font-size:1rem;font-weight:900;color:#1a1a1a}.ss{font-size:.8rem;color:#666;margin-top:4px;line-height:1.7}
.sa{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

.rev-header{font-weight:900;font-size:.95rem;color:#444;margin:4px 0 10px}

/* ══ HW / PDF ══ */
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mat-card{
  background:#fff;border-radius:14px;padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
  text-decoration:none;color:#1a1a1a;display:block;
  transition:.18s;border:2px solid transparent;
}
.mat-card:hover{border-color:#b8d0f4;transform:translateY(-2px)}
.mat-ico{font-size:2rem;margin-bottom:9px;display:block}
.mat-title{font-size:.93rem;font-weight:900;margin-bottom:5px}
.mat-sub{font-size:.78rem;color:#888;line-height:1.7;user-select:text}
.mat-body{margin-top:9px;color:#666;font-size:.85rem;line-height:1.9;user-select:text}

/* ══ UTILS ══ */
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:14px;color:#aaa}
.spin{width:34px;height:34px;border:3px solid #e0ddd8;border-top-color:#1a6b5f;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:10px;color:#aaa;text-align:center}
.emp .et{font-weight:900;font-size:1rem;color:#555}.emp .es{font-size:.84rem}

.btn{border:none;border-radius:10px;padding:10px 20px;font-weight:700;cursor:pointer;
  font-size:.88rem;transition:.17s;display:inline-flex;align-items:center;gap:7px;font-family:'Tajawal',sans-serif}
.btn-g{background:#1a6b5f;color:#fff}.btn-g:hover{background:#155a50}
.btn-g:disabled{opacity:.4;cursor:not-allowed}
.btn-out{background:#fff;color:#555;border:1.5px solid #ddd}.btn-out:hover{border-color:#aaa;color:#1a1a1a}
.btn-lg{padding:13px 30px;font-size:.95rem;border-radius:12px}
.btn-blue{background:#4a7ec7;color:#fff}.btn-blue:hover{background:#3a6db6}

#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{display:flex;gap:9px;align-items:center;background:#fff;
  border-radius:12px;padding:10px 18px;box-shadow:0 4px 20px rgba(0,0,0,.15);
  animation:tin .2s;pointer-events:all;white-space:nowrap;font-weight:700;font-size:.86rem;border:1.5px solid #e0ddd8}
.ts{border-color:#b8e8d8}.te{border-color:#f5c2c2}.tw{border-color:#fde8b8}
@keyframes tin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(7px)}}
.tx{animation:tout .18s forwards}

/* ══ LOCK VIEW ══ */
.lock-view{display:flex;align-items:center;justify-content:center;min-height:45vh}
.lock-card{background:#fff;border-radius:20px;padding:40px 32px;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.09);max-width:400px;width:100%}
.lock-ico{font-size:3rem;margin-bottom:14px;display:block}
.lock-title{font-size:1.1rem;font-weight:900;margin-bottom:8px}
.lock-sub{font-size:.86rem;color:#777;margin-bottom:22px;line-height:1.75}
.lock-actions{display:flex;gap:10px;justify-content:center}

/* ══ ERROR FULL ══ */
.err-full{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.err-card{background:#fff;border-radius:20px;padding:40px 28px;text-align:center;max-width:380px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.09)}
.err-ico{font-size:3rem;margin-bottom:12px;display:block}
.err-msg{font-size:1rem;font-weight:900;margin-bottom:18px;color:#1a1a1a}

/* ══ RESPONSIVE ══ */
@media(max-width:580px){
  .pills{flex-direction:column}
  .tabs{grid-template-columns:repeat(2,1fr)}
  .opts{grid-template-columns:1fr}
  .vid-card{flex-direction:column;align-items:flex-start;gap:12px}
  .vc-right{width:100%;justify-content:space-between}
  .vc-watch{width:100%;justify-content:center}
  .sw{flex-direction:column}
  .sa{align-items:flex-start;width:100%}
}
</style>
</head>
<body>

<div id="dto">
  <div class="di">🚫</div>
  <div class="dt">تم قفل الحصة</div>
  <div class="ds">تم اكتشاف أدوات المطور. أغلق DevTools وأعد فتح الصفحة.</div>
</div>

<div id="toasts"></div>

<div class="page" id="page">
  <div class="ld" id="il"><div class="spin"></div><div style="font-size:.9rem">جاري تحميل الحصة…</div></div>
</div>

<script>
/* ══ SECURITY ══ */
(function(){
  let lk=false;
  window.lock=function(){
    if(lk)return;lk=true;
    try{if(window._pl)window._pl.pause();}catch{}
    document.getElementById('dto').style.display='flex';
    document.getElementById('page').innerHTML='';
  };
  document.addEventListener('contextmenu',e=>{e.preventDefault();return false;},true);
  document.addEventListener('keydown',e=>{
    const k=e.key.toUpperCase();
    if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&'IJCK'.includes(k))||(e.ctrlKey&&'US'.includes(k))||(e.metaKey&&e.altKey&&'IJ'.includes(k))){
      e.preventDefault();e.stopPropagation();lock();return false;
    }
  },true);
  let t=0;setInterval(()=>{
    if(lk)return;
    if(Math.abs(window.outerWidth-window.innerWidth)>160||Math.abs(window.outerHeight-window.innerHeight)>160){t++;if(t>=2)lock();}else t=0;
  },500);
  document.addEventListener('selectstart',e=>{if(!e.target.closest('.qt,.ot,.mat-sub,.mat-body,.ss'))e.preventDefault();});
  document.addEventListener('dragstart',e=>e.preventDefault());
  (function d(){try{const s=performance.now();debugger;if(performance.now()-s>120)lock();}catch{}setTimeout(d,2600);})();
})();

function detectAdBlock(cb){
  const b=document.createElement('div');b.id='pub_300x250';b.className='ad-banner adsbox';
  b.style.cssText='position:absolute;width:1px;height:1px;top:-9999px';document.body.appendChild(b);
  setTimeout(()=>{const bl=!b.offsetParent||b.offsetHeight===0;b.remove();if(bl)cb();},350);
}

/* ══ SUPABASE ══ */
const SB_URL="https://xzjxmfgymbvordumrush.supabase.co";
const SB_ANON="sb_publishable_yDrrS95uLq4ch8pu0OwZ0w_6UiBx22e";
const sb=window.supabase.createClient(SB_URL,SB_ANON);

function iSrc(v){
  if(!v)return'';v=String(v).trim();if(!v)return'';
  if(v.startsWith('http')||v.startsWith('data:')||v.startsWith('blob:'))return v;
  if(v.startsWith('/storage/'))return SB_URL+v;
  return`${SB_URL}/storage/v1/object/public/kalawy/${v.replace(/^\/+/,'').replace(/^kalawy\//,'')}`;
}
function iS(v){return iSrc(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function iE(el,ic='🖼️'){const p=el.parentElement;if(p)p.innerHTML=`<div style="display:grid;place-items:center;height:100%;font-size:1.5rem">${ic}</div>`;else el.remove();}

/* ══ STATE ══ */
let ME=null,ROLE='',LESSON=null,EXAM=null,VIDEOS=[],CONTENT=[],ACCESS=null;
let _ans={},_sub=false,_eqs=[],_cp=0;
let _eti=null,_aci=null;
window._pl=null;let _wmt=null;
let _curTab='video';

/* ══ UTILS ══ */
function goHome(){window.location.href='/dashboard/';}
function toast(type,msg,dur=3400){
  const ic={s:'✅',e:'❌',w:'⚠️',i:'ℹ️'};
  const c=document.getElementById('toasts'),el=document.createElement('div');
  el.className=`toast t${type}`;el.innerHTML=`<span>${ic[type]||'ℹ️'}</span><span>${msg}</span>`;
  c.appendChild(el);setTimeout(()=>{el.classList.add('tx');setTimeout(()=>el.remove(),200);},dur);
}
function ytId(u){const m=(u||'').match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null;}
function ps(){return Math.max(0,Math.min(100,Number(EXAM?.pass_score??50)));}

function norOpts(q){
  let o=q?.options;if(typeof o==='string'){try{o=JSON.parse(o);}catch{o=null;}}
  if(!Array.isArray(o)||!o.length){o='abcdefgh'.split('').filter(k=>q&&q[`option_${k}`]).map(k=>({text:q[`option_${k}`],is_correct:String(q.correct_option||'').toLowerCase()===k}));}
  o=o.map(x=>typeof x==='string'?{text:x,is_correct:false}:{text:x?.text??x?.label??x?.value??'',is_correct:!!x?.is_correct}).filter(x=>String(x.text).trim());
  if(o.length&&!o.some(x=>x.is_correct)){
    const c=String(q?.correct_option||'').toLowerCase();let i='abcdefghij'.indexOf(c);
    if(i<0&&!isNaN(+c))i=+c;if(i>=0&&o[i])o[i].is_correct=true;
  }
  return o;
}
function norQs(qs){return(qs||[]).map(q=>({...q,options:norOpts(q)}));}

/* ══ WATCHED ══ */
function wk(){return`kw-w-${LESSON?.id}`;}
function getW(){try{return JSON.parse(localStorage.getItem(wk())||'[]');}catch{return[];}}
function markW(idx){
  const w=getW();if(w.includes(idx))return;
  w.push(idx);try{localStorage.setItem(wk(),JSON.stringify(w));}catch{}
  // update list if visible
  const card=document.getElementById(`vc-${idx}`);
  if(card){
    card.classList.add('done');
    const pb=card.querySelector('.vc-play');if(pb){pb.textContent='✓';pb.classList.add('done');}
    const wb=card.querySelector('.vc-watch');if(wb){wb.textContent='شاهد مجدداً';wb.classList.add('done-btn');}
  }
}

/* ══ ACCESS TIMER ══ */
function ah(){return Math.max(1,Number(LESSON?.access_hours??24));}
function ae(){if(!ACCESS?.used_at)return null;return new Date(new Date(ACCESS.used_at).getTime()+ah()*3600000);}
function ml(){const e=ae();return e?e.getTime()-Date.now():null;}

function fmtTimer(ms){
  if(ms==null)return'--:--:--';
  const sec=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startTimer(){
  if(ROLE==='admin'||ROLE==='teacher'||!ACCESS?.used_at)return;
  const tot=ah()*3600000;
  function upd(){
    const left=ml();
    const el=document.getElementById('pill-timer');
    if(el)el.textContent=`صلاحية الفيديو ${fmtTimer(left)}`;
    if(left!==null&&left<=0){
      clearInterval(_aci);
      try{window._pl?.pause();}catch{}
      showErr('انتهى وقت الحصة. ادخل كود جديد.');
    }
  }
  upd();_aci=setInterval(upd,1000);
}

/* ══ INIT ══ */
async function init(){
  const lid=new URLSearchParams(location.search).get('id');
  if(!lid){showErr('لم يتم تحديد الحصة');return;}
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='/login/';return;}
  const{data:pr}=await sb.from('profiles').select('role,phone').eq('id',session.user.id).single();
  ROLE=pr?.role||'student';ME={id:session.user.id,phone:pr?.phone||''};
  if(ROLE!=='admin'&&ROLE!=='teacher'){
    const{data:acc}=await sb.from('lesson_codes').select('id,used_at,expires_at').eq('lesson_id',lid).eq('used_by',session.user.id).maybeSingle();
    if(!acc){showErr('لازم تضيف الحصة للسلة وتدخل كود الحصة');return;}
    ACCESS=acc;
  }
  await loadLesson(lid);
}

async function loadLesson(lid){
  const[{data:ls},{data:vids},{data:exs},{data:cnt}]=await Promise.all([
    sb.from('lessons').select('id,title,description,is_active,scheduled_at,access_hours,image_url,chapters(title,image_url,subjects(name_ar))').eq('id',lid).single(),
    sb.from('lesson_videos').select('*').eq('lesson_id',lid).order('sort_order'),
    sb.from('exams').select('id,title,duration_minutes,pass_score').eq('lesson_id',lid).limit(1),
    sb.from('lesson_content').select('*').eq('lesson_id',lid).order('sort_order'),
  ]);
  if(!ls){showErr('الحصة غير موجودة');return;}
  LESSON=ls;VIDEOS=vids||[];CONTENT=cnt||[];EXAM=exs?.[0]||null;
  if(ls.scheduled_at&&new Date(ls.scheduled_at)>new Date()){
    const t=new Date(ls.scheduled_at).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
    showErr(`الحصة هتفتح في ${t}`);return;
  }
  if(ROLE!=='admin'&&ROLE!=='teacher'){
    if(!ls.is_active){showErr('الحصة مغلقة حالياً');return;}
    const exp=ae();if(exp&&exp.getTime()<=Date.now()){showErr('انتهى وقت الحصة. ادخل كود جديد.');return;}
  }
  buildPage();startTimer();
}

function getPDF(){return CONTENT.filter(c=>String(c.type||'').toLowerCase()==='pdf');}
function getIMG(){return CONTENT.filter(c=>String(c.type||'').toLowerCase()==='image');}
function getHW(){return CONTENT.filter(c=>{const t=String(c.type||'').toLowerCase(),tx=`${c.title||''} ${c.body||''}`.toLowerCase();return['homework','assignment','hw','واجب'].includes(t)||tx.includes('واجب')||tx.includes('homework');});}

/* ══ PLYR ══ */
function killPlyr(){
  if(window._pl){try{window._pl.destroy();}catch{}window._pl=null;}
  if(_wmt){clearInterval(_wmt);_wmt=null;}
}

function buildPlyr(videoId,idx){
  killPlyr();
  const el=document.getElementById('plyr-el');if(!el)return;
  el.setAttribute('data-plyr-embed-id',videoId);
  window._pl=new Plyr(el,{
    youtube:{noCookie:true,rel:0,showinfo:0,iv_load_policy:3,modestbranding:1},
    controls:['play-large','play','rewind','fast-forward','progress','current-time','duration','mute','volume','settings','fullscreen'],
    settings:['quality','speed'],
    speed:{selected:1,options:[0.5,0.75,1,1.25,1.5,2]},
    keyboard:{focused:false,global:false},
    fullscreen:{enabled:true,fallback:true,iosNative:true},
    tooltips:{controls:false},
    disableContextMenu:true,
    ratio:'16:9',
  });
  window._pl.on('ended',()=>markW(idx));
  window._pl.on('timeupdate',()=>{try{const p=window._pl;if(p.duration>0&&p.currentTime/p.duration>=0.85)markW(idx);}catch{}});
  window._pl.on('ready',()=>detectAdBlock(()=>{const w=document.getElementById('adb-w');if(w)w.classList.remove('hidden');}));
}

function startWm(){
  const wm=document.getElementById('kwm');if(!wm)return;
  function mv(){const x=6+Math.random()*72,y=6+Math.random()*72,r=-14+Math.random()*28;wm.style.left=x+'%';wm.style.top=y+'%';wm.style.setProperty('--r',r+'deg');}
  mv();_wmt=setInterval(mv,2600);
}

/* ══ EXAM ══ */
async function renderExam(startNow=false){
  const c=document.getElementById('cnt');
  if(!EXAM){c.innerHTML='<div class="emp"><span style="font-size:2.5rem">📝</span><div class="et">لا يوجد امتحان</div><div class="es">المدرس لسه ما أضافش امتحان</div></div>';return;}
  c.innerHTML='<div class="ld" style="min-height:36vh"><div class="spin"></div></div>';
  const{data:sub}=await sb.from('exam_submissions').select('id,score,passed,attempt_count,answers,updated_at').eq('exam_id',EXAM.id).eq('student_id',ME.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();
  if(sub&&!startNow){
    const{data:qs}=await sb.from('exam_questions').select('*').eq('exam_id',EXAM.id).order('sort_order');
    _eqs=norQs(qs||[]);renderResult(sub.score,true,!!sub.passed,sub.attempt_count||1,_eqs,sub.answers||[]);return;
  }
  const{data:qs}=await sb.from('exam_questions').select('*').eq('exam_id',EXAM.id).order('sort_order');
  if(!qs?.length){c.innerHTML='<div class="emp"><span style="font-size:2.5rem">📝</span><div class="et">لا توجد أسئلة</div></div>';return;}
  _eqs=norQs(qs);

  if(!startNow){
    c.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:center;min-height:40vh">
      <div class="exam-intro">
        <span class="ei-ico">📝</span>
        <div class="ei-title">${esc(EXAM.title||'امتحان الحصة')}</div>
        <div class="ei-sub">لازم تعدي بدرجة ${ps()}% أو أكتر عشان يتفتح الفيديو</div>
        <div class="ei-meta">
          <div class="ei-m">📋 ${_eqs.length} سؤال</div>
          ${EXAM.duration_minutes?`<div class="ei-m">⏱️ ${EXAM.duration_minutes} دقيقة</div>`:''}
          <div class="ei-m">🎯 نجاح ${ps()}%</div>
        </div>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn btn-g btn-lg" onclick="renderExam(true)">▶️ ابدأ الامتحان</button>
          <button class="btn btn-out" onclick="sw('video')">🎥 الفيديو</button>
        </div>
      </div>
    </div>`;
    return;
  }

  _ans={};_sub=false;
  const hasDur=!!EXAM.duration_minutes;
  c.innerHTML=`
  <div class="exam-wrap">
    ${hasDur?`<div class="etrow">
      <span style="font-size:.8rem;font-weight:700;color:#666">⏱️ الوقت المتبقي</span>
      <div class="etbar"><div class="etf" id="etf" style="width:100%"></div></div>
      <div class="etv" id="etv">--:--</div>
    </div>`:''}
    ${_eqs.map((q,i)=>{
      const opts=q.options||[];
      return`<div class="qc" id="qc-${q.id}">
        <div class="qn"><div class="qdot"></div>سؤال ${i+1} من ${_eqs.length}</div>
        ${q.image_url?`<img class="qi" src="${iS(q.image_url)}" onerror="iE(this,'🖼️')" loading="lazy">`:''}
        <div class="qt">${esc(q.question_text)}</div>
        <div class="opts" id="opts-${q.id}">
          ${opts.map((o,oi)=>`
            <div class="opt" id="opt-${q.id}-${oi}" onclick="pick('${q.id}',${oi})">
              <div class="ol">${String.fromCharCode(65+oi)}</div>
              <div class="ot">${esc(o.text)}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="ef">
    <div class="ep">
      <span id="an-c">0</span>/${_eqs.length} أجبت
      <div class="epb"><div class="epf" id="an-f" style="width:0%"></div></div>
    </div>
    <button class="btn btn-g btn-lg" id="sub-btn" onclick="submitExam(false)" style="margin-right:auto">📤 تسليم الامتحان</button>
  </div>`;
  if(hasDur)startET(EXAM.duration_minutes*60);
}

function startET(tot){
  let sec=tot;if(_eti)clearInterval(_eti);
  function u(){
    const m=Math.floor(sec/60),s=sec%60,str=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const v=document.getElementById('etv'),f=document.getElementById('etf');
    if(v){v.textContent=str;v.classList.toggle('warn',sec<=60);}
    if(f)f.style.width=(sec/tot*100)+'%';
    if(sec<=0){clearInterval(_eti);submitExam(true);return;}sec--;
  }
  u();_eti=setInterval(u,1000);
}

function pick(qId,idx){
  if(_sub)return;
  document.querySelectorAll(`[id^="opt-${qId}-"]`).forEach(el=>el.classList.remove('sel'));
  document.getElementById(`opt-${qId}-${idx}`)?.classList.add('sel');
  _ans[qId]=idx;
  const done=Object.keys(_ans).length,tot=_eqs.length;
  const ac=document.getElementById('an-c'),af=document.getElementById('an-f');
  if(ac)ac.textContent=done;if(af)af.style.width=Math.round(done/tot*100)+'%';
  document.getElementById(`qc-${qId}`)?.classList.add('ans');
}

async function submitExam(auto=false){
  const qs=_eqs;if(!qs.length)return toast('e','الأسئلة لم تتحمل');
  if(_sub)return;
  if(!auto&&Object.keys(_ans).length<qs.length)return toast('w','جاوب على كل الأسئلة قبل التسليم');
  _sub=true;if(_eti)clearInterval(_eti);
  const btn=document.getElementById('sub-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin" style="width:14px;height:14px;border-width:2px;border-top-color:#fff"></span> جاري التصحيح...';}
  let cor=0;const log=[];
  qs.forEach(q=>{const opts=q.options||[],si=_ans[q.id];if(opts[si]?.is_correct)cor++;log.push({qId:q.id,idx:si});});
  const score=Math.round(cor/qs.length*100),passed=score>=ps();
  const{data:old}=await sb.from('exam_submissions').select('id,attempt_count').eq('exam_id',EXAM.id).eq('student_id',ME.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();
  const na=(old?.attempt_count||0)+1;
  const pl={exam_id:EXAM.id,student_id:ME.id,score,passed,attempt_count:na,updated_at:new Date().toISOString(),answers:log};
  let sv;
  if(old?.id)sv=await sb.from('exam_submissions').update(pl).eq('id',old.id).select().single();
  else sv=await sb.from('exam_submissions').insert(pl).select().single();
  if(sv?.error){_sub=false;if(btn){btn.disabled=false;btn.innerHTML='📤 تسليم';}return toast('e','فشل الحفظ: '+sv.error.message);}
  setTimeout(()=>renderResult(score,false,passed,na,qs,log),300);
}

function renderResult(score,saved,passed,attempts,eqs,log){
  const c=document.getElementById('cnt');
  const pass=passed!==null?!!passed:score>=ps();
  const am={};(log||[]).forEach(a=>{am[a.qId]=a.idx;});

  const qh=(eqs&&eqs.length)?`
  <div class="exam-wrap" style="margin-top:4px">
    <div class="rev-header">📋 مراجعة الإجابات</div>
    ${eqs.map((q,i)=>{
      const opts=q.options||[],si=am[q.id],isc=opts[si]?.is_correct;
      return`<div class="qc">
        <div class="qn">
          <div class="qdot" style="background:${si!==undefined?(isc?'#1a6b5f':'#e53232'):'#ccc'}"></div>
          سؤال ${i+1} — ${si!==undefined?(isc?'✅ إجابة صحيحة':'❌ إجابة خاطئة'):'لم تجب'}
        </div>
        ${q.image_url?`<img class="qi" src="${iS(q.image_url)}" onerror="iE(this,'🖼️')" loading="lazy">`:''}
        <div class="qt">${esc(q.question_text)}</div>
        <div class="opts">
          ${opts.map((o,oi)=>{
            const isSel=oi===si,isOk=o.is_correct;
            const cls='opt'+(isOk?' cor':isSel&&!isOk?' wrg':' ntl');
            const icon=isOk?'<span class="oi">✅</span>':isSel&&!isOk?'<span class="oi">❌</span>':'';
            return`<div class="${cls}"><div class="ol">${String.fromCharCode(65+oi)}</div><div class="ot">${esc(o.text)}</div>${icon}</div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`:'';

  c.innerHTML=`
  <div class="sw" style="margin-bottom:14px">
    <div class="sb ${pass?'p':'f'}">${score}%</div>
    <div class="si">
      <div class="sl">${pass?'🏆 ممتاز! الفيديو اتفتح':'📖 درجة أقل من المطلوب'}</div>
      <div class="ss">درجة النجاح: ${ps()}% • محاولة رقم ${attempts}${saved?' • نتيجة محفوظة':' • تم الحفظ'}</div>
    </div>
    <div class="sa">
      ${pass&&VIDEOS.length?`<button class="btn btn-g" onclick="sw('video')">▶️ شاهد الفيديو</button>`:''}
      ${!pass?`<button class="btn btn-g" onclick="renderExam(false)">🔄 امتحن تاني</button>`:''}
      <button class="btn btn-out" onclick="goHome()">← رجوع</button>
    </div>
  </div>
  ${qh}`;
}

/* ══ PDF ══ */

  const p=getPDF(),img=getIMG(),c=document.getElementById('cnt');
  if(!p.length&&!img.length){c.innerHTML='<div class="emp"><span style="font-size:2.5rem">📄</span><div class="et">لا يوجد ملفات</div><div class="es">أي ملف يضيفه المدرس هيظهر هنا</div></div>';return;}
  c.innerHTML=`
  ${p.length?`<div class="mat-grid">${p.map((ct,i)=>`
    <a class="mat-card" href="${iS(ct.url)||'#'}" target="_blank">
      <span class="mat-ico">📄</span>
      <div class="mat-title">${esc(ct.title||('PDF '+(i+1)))}</div>
      <div class="mat-sub">اضغط لفتح أو تحميل</div>
    </a>`).join('')}</div>`:''}
  ${img.length?`<div style="display:flex;flex-direction:column;gap:13px;margin-top:${p.length?'14px':'0'}">
    ${img.map((ct,i)=>`
      <div>
        <div style="font-size:.8rem;color:#888;font-weight:700;margin-bottom:7px">🖼️ ${esc(ct.title||('صورة '+(i+1)))}</div>
        <div style="border-radius:14px;overflow:hidden;border:1px solid #e0ddd8;background:#fff">
          <img style="width:100%;display:block" src="${iS(ct.url)}" onerror="iE(this,'🖼️')" loading="lazy">
        </div>
      </div>`).join('')}
  </div>`:''}`;
}

/* ══ ERROR ══ */
function showErr(msg){
  document.getElementById('il')?.remove();
  document.getElementById('page').innerHTML=`
  <div class="err-full">
    <div class="err-card">
      <span class="err-ico">🔒</span>
      <div class="err-msg">${esc(msg)}</div>
      <button class="btn btn-g btn-lg" onclick="goHome()">← العودة</button>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
