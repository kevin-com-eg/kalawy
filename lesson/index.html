<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>kalawy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
/* ══════ RESET & BASE ══════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Cairo',system-ui,sans-serif;
  background:var(--bg);color:var(--txt);
  min-height:100vh;transition:background .25s,color .25s;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none!important}
::selection{background:rgba(99,102,241,.18);color:var(--txt)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--p1);border-radius:99px}

/* ══════ TOKENS ══════ */
:root{
  --p1:#6366f1;--p2:#4f46e5;--p3:#818cf8;
  --ok:#10b981;--danger:#ef4444;--warn:#f59e0b;
  --glow:rgba(99,102,241,.22);
}
[data-theme="light"]{
  --bg:#f8f7f5;--bg2:#ffffff;--card:#ffffff;
  --bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.14);
  --txt:#0f0f0f;--t2:#525252;--t3:#a3a3a3;
  --input:#f1f0ee;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --sh2:0 2px 8px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.1);
  --nav:rgba(248,247,245,.88);
  --player:#0c0c0f;
  --watch-bg:#1a1a2e;
  --watch-c:#fff;
  --progress-bg:rgba(255,255,255,.15);
}
[data-theme="dark"]{
  --bg:#0d0d12;--bg2:#161620;--card:#1c1c28;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);
  --txt:#f0f0ff;--t2:#9090b0;--t3:#50506a;
  --input:#161620;
  --sh:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
  --sh2:0 2px 8px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.45);
  --nav:rgba(13,13,18,.9);
  --player:#07070a;
  --watch-bg:#6366f1;
  --watch-c:#fff;
  --progress-bg:rgba(255,255,255,.1);
}

/* ══════ ANIMS ══════ */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes float{0%,100%{transform:translate(var(--fx,0),var(--fy,0))}50%{transform:translate(var(--fx,0),calc(var(--fy,0) - 7px))}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ══════ NAV ══════ */
.nav{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;
  background:var(--nav);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--bd);
}
.logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--p1),var(--p2));
  display:grid;place-items:center;color:#fff;
  font-weight:900;font-size:.78rem;letter-spacing:-.01em;
  cursor:pointer;transition:transform .2s;flex-shrink:0;
}
.logo:hover{transform:scale(1.06) rotate(-3deg)}
.brand{
  font-weight:900;font-size:1.1rem;letter-spacing:-.03em;cursor:pointer;
  background:linear-gradient(135deg,var(--p1),var(--p3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.nav-sp{flex:1}
.theme-sw{
  display:flex;background:var(--input);
  border:1px solid var(--bd);border-radius:99px;padding:3px;gap:2px;
}
.topt{
  padding:5px 10px;border-radius:99px;border:none;
  background:transparent;color:var(--t3);
  font-size:.7rem;font-weight:700;cursor:pointer;transition:.15s;
}
.topt.on{background:var(--card);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.back-pill{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:99px;
  border:1px solid var(--bd);background:var(--input);
  color:var(--t2);font-size:.8rem;font-weight:600;cursor:pointer;
  transition:.15s;font-family:inherit;
}
.back-pill:hover{border-color:var(--p1);color:var(--p1)}

/* ══════ PAGE ══════ */
.page{max-width:880px;margin:0 auto;padding:28px 20px 100px;animation:fade .4s ease}

/* ══════ HERO ══════ */
.hero{
  display:grid;grid-template-columns:auto 1fr;gap:20px;
  background:var(--card);border-radius:20px;
  padding:22px;border:1px solid var(--bd);
  box-shadow:var(--sh);margin-bottom:20px;
  animation:up .4s ease;
}
.hero-img{
  width:130px;height:130px;border-radius:14px;
  object-fit:cover;background:var(--input);
  border:1px solid var(--bd);flex-shrink:0;
}
.hero-img-ph{
  width:130px;height:130px;border-radius:14px;
  background:var(--input);border:1px solid var(--bd);
  display:grid;place-items:center;font-size:2.5rem;flex-shrink:0;
}
.hero-body{display:flex;flex-direction:column;justify-content:center;gap:8px}
.hero-kicker{display:flex;flex-wrap:wrap;gap:6px}
.kicker-tag{
  padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:600;
  background:var(--input);color:var(--t2);border:1px solid var(--bd);
}
.hero-title{font-size:1.35rem;font-weight:900;line-height:1.3;letter-spacing:-.02em;color:var(--txt)}
.hero-desc{font-size:.85rem;color:var(--t2);line-height:1.7}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.hmeta{font-size:.78rem;color:var(--t3);display:flex;align-items:center;gap:4px}

/* ══════ STATUS STRIP ══════ */
.strip{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
  margin-bottom:20px;animation:up .45s ease;
}
.strip-cell{
  background:var(--card);border-radius:13px;
  padding:13px 16px;border:1px solid var(--bd);
  box-shadow:var(--sh);
}
.sc-label{font-size:.68rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.sc-val{font-size:.95rem;font-weight:700;color:var(--txt);font-family:'JetBrains Mono',monospace}
.sc-val.timer{color:var(--p1)}
.sc-val.danger{color:var(--danger)}

/* ══════ TABS ══════ */
.tabs{
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-radius:14px;
  border:1px solid var(--bd);overflow:hidden;
  box-shadow:var(--sh);margin-bottom:22px;
  animation:up .5s ease;
}
.tab{
  padding:14px 8px;border:none;background:transparent;
  font-family:'Cairo',inherit;font-weight:700;font-size:.88rem;
  cursor:pointer;color:var(--t3);transition:.18s;
  position:relative;border-left:1px solid var(--bd);
}
.tab:last-child{border-left:none}
.tab::after{
  content:'';position:absolute;bottom:0;left:20%;right:20%;
  height:2px;background:var(--p1);border-radius:99px;
  transform:scaleX(0);transition:transform .2s;
}
.tab.on{color:var(--p1);font-weight:800}
.tab.on::after{transform:scaleX(1)}
.tab:hover:not(.on){color:var(--p2);background:rgba(99,102,241,.04)}

/* ══════ VIDEO LIST ══════ */
.vid-list{display:flex;flex-direction:column;gap:10px;animation:up .3s ease}
.vid-card{
  background:var(--card);border-radius:15px;
  padding:18px 20px;display:flex;align-items:center;gap:16px;
  border:1px solid var(--bd);box-shadow:var(--sh);
  transition:.2s;cursor:default;
}
.vid-card:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--bd2)}
.vc-index{
  width:38px;height:38px;border-radius:10px;
  background:var(--input);border:1px solid var(--bd);
  display:grid;place-items:center;font-size:.8rem;font-weight:700;
  color:var(--t3);flex-shrink:0;font-family:'JetBrains Mono',monospace;
  transition:.2s;
}
.vid-card:hover .vc-index{background:rgba(99,102,241,.1);border-color:var(--p3);color:var(--p1)}
.vc-title{font-weight:700;font-size:.95rem;color:var(--txt);flex:1}
.vc-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.vc-done{
  width:30px;height:30px;border-radius:50%;
  background:rgba(16,185,129,.1);border:1.5px solid rgba(16,185,129,.3);
  display:grid;place-items:center;font-size:.8rem;color:var(--ok);
  transition:.2s;flex-shrink:0;
}
.vc-done.pending{background:var(--input);border-color:var(--bd);color:var(--t3)}
.watch-btn{
  display:flex;align-items:center;gap:7px;
  padding:9px 18px;border-radius:10px;border:none;
  background:var(--watch-bg);color:var(--watch-c);
  font-family:'Cairo',inherit;font-weight:700;font-size:.85rem;
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.watch-btn:hover{opacity:.85;transform:translateY(-1px)}
.watch-btn.rewatched{
  background:transparent;color:var(--ok);
  border:1.5px solid rgba(16,185,129,.35);
}
.watch-btn.rewatched:hover{background:rgba(16,185,129,.07)}

/* ══════════════════════════════════
   CUSTOM YOUTUBE PLAYER
══════════════════════════════════ */
.player-view{display:flex;flex-direction:column;gap:14px;animation:pop .3s ease}
.player-back{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 16px;border-radius:10px;border:none;
  background:var(--card);color:var(--t2);
  font-family:'Cairo',inherit;font-weight:700;font-size:.85rem;
  cursor:pointer;border:1px solid var(--bd);transition:.15s;
  align-self:flex-start;
}
.player-back:hover{color:var(--p1);border-color:var(--p1)}
.player-label{
  background:rgba(99,102,241,.08);border:1.5px solid rgba(99,102,241,.2);
  border-radius:12px;padding:12px 20px;
  font-weight:800;font-size:1rem;color:var(--p1);text-align:center;
}

/* The shell that holds iframe + controls */
.player-shell{
  background:var(--player);border-radius:18px;
  overflow:hidden;box-shadow:var(--sh2);
  position:relative;aspect-ratio:16/9;
}
.player-shell iframe{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;display:block;
  pointer-events:none; /* hand all events to our overlay */
}
/* Click-catcher overlay — captures clicks before iframe */
.player-overlay{
  position:absolute;inset:0;z-index:30;
  cursor:pointer;
}
/* Big play/pause icon shown on click */
.player-center-icon{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:68px;height:68px;border-radius:50%;
  background:rgba(99,102,241,.9);
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;color:#fff;
  opacity:0;transition:opacity .15s;pointer-events:none;
  z-index:40;
}
.player-center-icon.flash{animation:_flash .5s ease forwards}
@keyframes _flash{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
/* Gradient bar at bottom */
.player-controls-wrap{
  position:absolute;bottom:0;left:0;right:0;z-index:50;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
  padding:36px 16px 14px;
  opacity:0;transition:opacity .25s;
}
.player-shell:hover .player-controls-wrap,
.player-shell.show-ctrl .player-controls-wrap{opacity:1}
/* Progress bar */
.progress-track{
  height:4px;background:var(--progress-bg);
  border-radius:99px;cursor:pointer;position:relative;margin-bottom:12px;
  transition:height .15s;
}
.progress-track:hover{height:6px}
.progress-fill{
  height:100%;background:var(--p1);border-radius:99px;
  pointer-events:none;transform-origin:left;
}
.progress-thumb{
  position:absolute;top:50%;right:calc(var(--pct,0) * 1% - 6px);
  transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
  opacity:0;transition:opacity .15s;pointer-events:none;
}
.progress-track:hover .progress-thumb{opacity:1}
/* Control row */
.ctrl-row{display:flex;align-items:center;gap:10px}
.ctrl-btn{
  background:transparent;border:none;cursor:pointer;
  color:rgba(255,255,255,.85);font-size:1.1rem;
  padding:4px;border-radius:6px;transition:.15s;display:flex;align-items:center;
}
.ctrl-btn:hover{color:#fff;background:rgba(255,255,255,.12)}
.ctrl-btn svg{width:20px;height:20px;fill:currentColor}
.ctrl-sp{flex:1}
.ctrl-time{
  font-family:'JetBrains Mono',monospace;font-size:.75rem;
  color:rgba(255,255,255,.7);
}
/* Volume */
.vol-wrap{display:flex;align-items:center;gap:7px}
.vol-track{
  width:70px;height:3px;background:var(--progress-bg);
  border-radius:99px;cursor:pointer;
}
.vol-fill{height:100%;background:rgba(255,255,255,.7);border-radius:99px}
/* Speed */
.speed-sel{
  background:transparent;border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.8);border-radius:6px;
  font-size:.72rem;font-family:'JetBrains Mono',monospace;font-weight:700;
  padding:3px 6px;cursor:pointer;
}
.speed-sel option{color:#000;background:#fff}
/* Watermark */
.wm{
  position:absolute;z-index:45;pointer-events:none;
  display:flex;align-items:center;gap:7px;
  animation:float 3s ease-in-out infinite;
}
.wm-avatar{
  width:30px;height:30px;border-radius:50%;
  background:rgba(99,102,241,.9);
  display:grid;place-items:center;flex-shrink:0;
}
.wm-avatar svg{width:60%;height:60%;fill:rgba(255,255,255,.9)}
.wm-id{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;
  color:#fff;background:rgba(0,0,0,.55);
  padding:2px 8px;border-radius:99px;
  border:1px solid rgba(255,0,0,.35);
  text-shadow:0 1px 4px rgba(0,0,0,.8);
  white-space:nowrap;
}
/* Skip buttons row */
.player-skip-row{display:flex;gap:8px;justify-content:center}
.skip-btn{
  padding:7px 16px;border-radius:9px;border:none;
  background:var(--card);color:var(--t2);font-family:'Cairo',inherit;
  font-weight:700;font-size:.83rem;cursor:pointer;border:1px solid var(--bd);
  transition:.15s;
}
.skip-btn:hover{color:var(--p1);border-color:var(--p1)}

/* ══════ LOCK ══════ */
.lock-view{display:flex;align-items:center;justify-content:center;min-height:40vh}
.lock-card{
  background:var(--card);border-radius:20px;padding:38px 28px;
  text-align:center;max-width:380px;width:100%;
  border:1px solid var(--bd);box-shadow:var(--sh);
}
.lock-icon{font-size:3rem;display:block;margin-bottom:14px}
.lock-title{font-size:1.1rem;font-weight:900;margin-bottom:8px;color:var(--txt)}
.lock-sub{font-size:.86rem;color:var(--t2);margin-bottom:22px;line-height:1.8}

/* ══════ EXAM ══════ */
.exam-wrap{display:flex;flex-direction:column;gap:13px;animation:up .3s ease}
.exam-intro-card{
  background:var(--card);border-radius:20px;padding:38px;
  text-align:center;border:1px solid var(--bd);box-shadow:var(--sh);
}
.ei-ico{font-size:3rem;display:block;margin-bottom:12px}
.ei-title{font-size:1.2rem;font-weight:900;margin-bottom:8px;color:var(--txt)}
.ei-sub{font-size:.86rem;color:var(--t2);line-height:1.8;margin-bottom:18px;max-width:360px;margin-inline:auto}
.ei-meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.ei-m{
  padding:7px 14px;border-radius:99px;font-size:.78rem;font-weight:700;
  background:var(--input);border:1px solid var(--bd);color:var(--t2);
}
/* Timer row */
.timer-row{
  background:var(--card);border-radius:12px;
  padding:12px 18px;border:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;
}
.timer-bar{flex:1;height:5px;background:var(--input);border-radius:99px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--p2),var(--p1));border-radius:99px;transform-origin:left;transition:width 1s linear}
.timer-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.95rem;color:var(--p1)}
.timer-val.warn{color:var(--danger)}
/* Questions */
.qcard{
  background:var(--card);border-radius:14px;padding:20px;
  border:1.5px solid var(--bd);box-shadow:var(--sh);transition:.18s;
}
.qcard.answered{border-color:rgba(99,102,241,.3)}
.q-header{font-size:.68rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.q-dot{width:5px;height:5px;border-radius:50%;background:var(--p1)}
.q-text{font-weight:700;font-size:.95rem;line-height:1.75;margin-bottom:14px;color:var(--txt);user-select:text}
.q-img{width:100%;max-height:200px;object-fit:contain;border-radius:10px;margin-bottom:12px;border:1px solid var(--bd)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;border-radius:10px;
  border:1.5px solid var(--bd);background:var(--input);
  cursor:pointer;transition:.15s;
}
.opt:hover{border-color:var(--p3);background:rgba(99,102,241,.05)}
.opt.sel{border-color:var(--p1);background:rgba(99,102,241,.08)}
.opt.cor{border-color:var(--ok)!important;background:rgba(16,185,129,.08)!important;pointer-events:none}
.opt.wrg{border-color:var(--danger)!important;background:rgba(239,68,68,.08)!important;pointer-events:none}
.opt.off{pointer-events:none;opacity:.45}
.opt-letter{
  width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--bd2);display:grid;place-items:center;
  font-size:.68rem;font-weight:700;color:var(--t3);flex-shrink:0;transition:.14s;
}
.opt.sel .opt-letter{background:var(--p1);border-color:var(--p1);color:#fff}
.opt.cor .opt-letter{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrg .opt-letter{background:var(--danger);border-color:var(--danger);color:#fff}
.opt-text{font-size:.87rem;font-weight:600;flex:1;user-select:text;color:var(--txt)}
/* Sticky footer */
.exam-footer{
  position:sticky;bottom:0;
  background:var(--bg);border-top:1px solid var(--bd);
  padding:12px 0;display:flex;align-items:center;gap:14px;z-index:100;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.ep-count{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--t2)}
.ep-bar{width:100px;height:4px;background:var(--input);border-radius:99px;overflow:hidden}
.ep-fill{height:100%;background:linear-gradient(90deg,var(--p1),var(--p3));border-radius:99px;transition:width .2s}
/* Result */
.result-card{
  background:var(--card);border-radius:18px;padding:28px;
  border:1px solid var(--bd);box-shadow:var(--sh);
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.score-big{font-size:3.2rem;font-weight:900;letter-spacing:-.06em;line-height:1}
.score-big.pass{color:var(--ok)}
.score-big.fail{color:var(--danger)}
.result-info{flex:1}
.result-title{font-size:1rem;font-weight:900;color:var(--txt);margin-bottom:4px}
.result-sub{font-size:.82rem;color:var(--t2);line-height:1.7}
.result-acts{display:flex;flex-direction:column;gap:8px}

/* ══════ HOMEWORK ══════ */
.hw-wrap{display:flex;flex-direction:column;gap:14px;animation:up .3s ease}
.hw-card{
  background:var(--card);border-radius:14px;padding:20px;
  border:1px solid var(--bd);box-shadow:var(--sh);
}
.hw-title{font-size:.95rem;font-weight:800;margin-bottom:6px;color:var(--txt)}
.hw-body{font-size:.85rem;color:var(--t2);line-height:1.8}
.submit-box{
  background:var(--card);border-radius:16px;padding:22px;
  border:1px solid var(--bd);box-shadow:var(--sh);
}
.sub-title{font-weight:800;font-size:.95rem;margin-bottom:6px;color:var(--txt)}
.sub-desc{font-size:.84rem;color:var(--t2);line-height:1.75;margin-bottom:14px}
.hw-note{
  width:100%;padding:12px;border-radius:10px;
  border:1.5px solid var(--bd);background:var(--input);
  color:var(--txt);font-family:'Cairo',inherit;font-size:.85rem;

  let o=q?.options;if(typeof o==='string'){try{o=JSON.parse(o);}catch{o=null;}}

async function init(){
  runAdBlockCheck();
  const lid=new URLSearchParams(location.search).get('id');
  if(!lid){showErr('لم يتم تحديد الحصة');return;}
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='/login/';return;}
  const{data:pr}=await sb.from('profiles').select('role,phone,is_blocked,student_no,student_public_id').eq('id',session.user.id).single();
  ROLE=pr?.role||'student';
  ME={id:session.user.id,phone:pr?.phone||'',student_no:pr?.student_no||null,student_public_id:pr?.student_public_id||''};
  if(!isStaff()&&pr?.is_blocked){showErr('حسابك محظور. تواصل مع المدرس.');return;}
  if(!isStaff()){
    const{data:accRows,error:accErr}=await sb.from('lesson_codes')
      .select('id,used_at,expires_at,created_at').eq('lesson_id',lid).eq('used_by',session.user.id)
      .order('used_at',{ascending:false});
    if(accErr){showErr('مشكلة في التحقق: '+accErr.message);return;}
    ACCESS_ROWS=accRows||[];
    if(!ACCESS_ROWS.length){showErr('لازم تدخل كود الحصة عشان تشوفها');return;}
    ACCESS=ACCESS_ROWS[0];
  }
  await loadLesson(lid);
}

async function loadLesson(lid){
  const[{data:ls},{data:vids},{data:exs},{data:cnt},{data:hws}]=await Promise.all([
    sb.from('lessons').select('id,chapter_id,title,description,price,is_active,scheduled_at,created_at,access_hours,image_url,chapters(title,image_url,subjects(name_ar))').eq('id',lid).single(),
    sb.from('lesson_videos').select('*').eq('lesson_id',lid).order('sort_order'),
    sb.from('exams').select('id,title,duration_minutes,pass_score').eq('lesson_id',lid).limit(1),
    sb.from('lesson_content').select('*').eq('lesson_id',lid).order('sort_order'),
    sb.from('homework').select('*').eq('lesson_id',lid).order('created_at',{ascending:false}),
  ]);
  if(!ls){showErr('الحصة غير موجودة');return;}
  LESSON=ls;VIDEOS=vids||[];CONTENT=cnt||[];HOMEWORK=hws||[];EXAM=exs?.[0]||null;
  if(!isStaff()&&ACCESS_ROWS.length)ACCESS=pickAccessRow(ACCESS_ROWS);
  if(ls.scheduled_at&&new Date(ls.scheduled_at)>new Date()){
    showErr(`الحصة هتفتح في ${new Date(ls.scheduled_at).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}`);return;
  }
  if(!isStaff()){
    if(!ls.is_active){showErr('الحصة مغلقة حالياً');return;}
    const exp=ae();
    if(exp&&exp.getTime()<=Date.now()){showExpired();return;}
    HOMEWORK_DONE=await getHomeworkDone(ls.id);
    const canEnter=await checkPrevHomeworkGate(ls);
    if(!canEnter)return;
  }
  buildPage();startTimer();
}

/* ═══════════ TAB SWITCH ═══════════ */
function sw(id){
  ['video','exam','homework','pdf'].forEach(t=>document.getElementById(`tab-${t}`)?.classList.toggle('on',t===id));
  stopPlayer();
  renderTab(id);
}
function renderTab(id){
  if(id==='video')renderVideoList();
  else if(id==='exam')renderExam();
  else if(id==='homework')renderHW();
  else if(id==='pdf')renderPDF();
}

/* — YouTube IFrame API — */
function initYT(videoId,idx){
  // Load YT API if needed
  if(!window.YT||!window.YT.Player){
    if(!document.getElementById('yt-api')){
      const sc=document.createElement('script');
      sc.id='yt-api';sc.src='https://www.youtube.com/iframe_api';
      document.head.appendChild(sc);
    }
    window.onYouTubeIframeAPIReady=()=>createYTPlayer(videoId,idx);
  }else{
    createYTPlayer(videoId,idx);
  }
}
function createYTPlayer(videoId,idx){
  const container=document.getElementById('yt-container');
  if(!container)return;
  const div=document.createElement('div');div.id='yt-player-el';
  container.appendChild(div);
  window._ytPlayer=new YT.Player('yt-player-el',{
    videoId,
    playerVars:{
      controls:0,disablekb:1,rel:0,modestbranding:1,
      iv_load_policy:3,playsinline:1,fs:0,
      cc_load_policy:0,origin:location.origin,
      enablejsapi:1,
    },
    events:{
      onReady:()=>{_playerReady=true;startProgressLoop(idx);},
      onStateChange:(e)=>onYTState(e,idx),
      onError:()=>onYTError(),
    }
  });
  // Style the iframe
  setTimeout(()=>{
    const ifr=document.querySelector('#yt-container iframe');
    if(ifr){
      ifr.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:none;pointer-events:none;';
    }
  },800);
}
function onYTState(e,idx){
  _playerState=e.data;
  const playIcon=document.getElementById('play-icon');
  const pci=document.getElementById('pci');
  const YTS=YT.PlayerState;
  if(e.data===YTS.PLAYING){
    if(playIcon)playIcon.innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    flashCenter('⏸');
  }else{
    if(playIcon)playIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
    if(e.data===YTS.ENDED){
      markWatched(idx);
      flashCenter('✓');
    }else if(e.data===YTS.PAUSED){
      flashCenter('▶');
    }
  }
}
function onYTError(){
  document.getElementById('adb-overlay').style.display='flex';
}
function flashCenter(ic){
  const el=document.getElementById('pci');
  if(!el)return;
  el.textContent=ic;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

/* — Player controls — */
function togglePlay(){
  if(!_playerReady||!window._ytPlayer)return;
  const s=window._ytPlayer.getPlayerState();
  if(s===YT.PlayerState.PLAYING)window._ytPlayer.pauseVideo();
  else window._ytPlayer.playVideo();
}
function seekBy(sec){
  if(!_playerReady||!window._ytPlayer)return;
  const cur=window._ytPlayer.getCurrentTime()||0;
  window._ytPlayer.seekTo(Math.max(0,cur+sec),true);
}
function toggleMute(){
  if(!_playerReady||!window._ytPlayer)return;
  if(window._ytPlayer.isMuted()){
    window._ytPlayer.unMute();
    document.getElementById('vol-fill').style.width='100%';
  }else{
    window._ytPlayer.mute();
    document.getElementById('vol-fill').style.width='0%';
  }
  const vicon=document.getElementById('vol-icon');
  if(vicon)vicon.innerHTML=window._ytPlayer.isMuted()
    ?'<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
    :'<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
}
function setSpeed(v){
  if(!_playerReady||!window._ytPlayer)return;
  window._ytPlayer.setPlaybackRate(parseFloat(v));
}
function toggleFullscreen(){
  const shell=document.getElementById('ps');if(!shell)return;
  if(!document.fullscreenElement)shell.requestFullscreen?.();
  else document.exitFullscreen?.();
}

/* — Progress loop — */
let _progRAF=null;
function startProgressLoop(idx){
  cancelAnimationFrame(_progRAF);
  function loop(){
    if(!window._ytPlayer||!_playerReady){_progRAF=requestAnimationFrame(loop);return;}
    try{
      const cur=window._ytPlayer.getCurrentTime()||0;
      const dur=window._ytPlayer.getDuration()||0;
      _playerCur=cur;_playerDur=dur;
      const pct=dur>0?Math.min(100,cur/dur*100):0;
      const pf=document.getElementById('prog-fill');
      const pt=document.getElementById('prog-thumb');
      const tc=document.getElementById('ctrl-time');
      if(!_dragging&&pf)pf.style.width=pct+'%';
      if(!_dragging&&pt)pt.style.setProperty('--pct',pct);
      if(tc)tc.textContent=fmtTime(cur)+' / '+fmtTime(dur);
      // Auto-mark watched at 85%
      if(dur>0&&cur/dur>=0.85)markWatched(idx);
    }catch{}
    _progRAF=requestAnimationFrame(loop);
  }
  loop();
}

/* — Progress drag — */
function progressFromX(e,track){
  const rect=track.getBoundingClientRect();
  const x=('touches' in e?e.touches[0].clientX:e.clientX);
  // RTL: right side = start
  const pct=Math.min(1,Math.max(0,(rect.right-x)/rect.width));
  return pct;
}
function startProgressDrag(e){
  _dragging=true;
  const track=document.getElementById('prog-track');
  const pct=progressFromX(e,track);
  applyProgress(pct);
  function move(ev){applyProgress(progressFromX(ev,track));}
  function up(ev){
    _dragging=false;
    const p=progressFromX(ev,track);
    applyProgress(p);
    if(_playerReady&&window._ytPlayer&&_playerDur)window._ytPlayer.seekTo(p*_playerDur,true);
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
  }
  document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
}
function startProgressDragTouch(e){
  _dragging=true;
  const track=document.getElementById('prog-track');
  const pct=progressFromX(e,track);
  applyProgress(pct);
  function move(ev){ev.preventDefault();applyProgress(progressFromX(ev,track));}
  function up(ev){
    _dragging=false;
    const p=progressFromX(ev,track);
    if(_playerReady&&window._ytPlayer&&_playerDur)window._ytPlayer.seekTo(p*_playerDur,true);
    document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
  }
  document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('touchend',up);
}
function applyProgress(pct){
  const pf=document.getElementById('prog-fill');
  const pt=document.getElementById('prog-thumb');
  if(pf)pf.style.width=(pct*100)+'%';
  if(pt)pt.style.setProperty('--pct',pct*100);
}

/* — Volume drag — */
function volFromX(e,track){
  const rect=track.getBoundingClientRect();
  const x=('touches' in e?e.touches[0].clientX:e.clientX);
  return Math.min(1,Math.max(0,(rect.right-x)/rect.width));
}
function startVolDrag(e){
  _volDrag=true;
  const track=document.getElementById('vol-track');
  setVol(volFromX(e,track));
  function move(ev){setVol(volFromX(ev,track));}
  function up(){_volDrag=false;document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);}
  document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
}
function startVolDragTouch(e){
  const track=document.getElementById('vol-track');
  function move(ev){ev.preventDefault();setVol(volFromX(ev,track));}
  function up(){document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);}
  document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('touchend',up);
}
function setVol(v){
  if(_playerReady&&window._ytPlayer){
    window._ytPlayer.setVolume(v*100);
    if(v>0)window._ytPlayer.unMute();else window._ytPlayer.mute();
  }
  const vf=document.getElementById('vol-fill');
  if(vf)vf.style.width=(v*100)+'%';
}

/* — Watermark float — */
function startWatermark(){
  if(_wmTimer)clearInterval(_wmTimer);
  const wm=document.getElementById('kwm');if(!wm)return;
  function mv(){
    const x=5+Math.random()*75,y=5+Math.random()*75;
    wm.style.setProperty('--fx',x+'%');
    wm.style.setProperty('--fy',y+'%');
    wm.style.left=x+'%';wm.style.top=y+'%';
  }
  mv();_wmTimer=setInterval(mv,3200);
}

/* ═══════════ EXAM ═══════════ */
function draftKey(k,id){return`kw-${k}-${id}-${ME?.id||'me'}`;}
function getDraft(k,id){try{return JSON.parse(localStorage.getItem(draftKey(k,id))||'null');}catch{return null;}}
function setDraft(k,id,d){try{localStorage.setItem(draftKey(k,id),JSON.stringify(d));}catch{}}
function clearDraft(k,id){try{localStorage.removeItem(draftKey(k,id));}catch{}}
function dLeft(d){return d?.endsAt?new Date(d.endsAt).getTime()-Date.now():null;}

async function renderExam(startNow=false){
  const c=document.getElementById('cnt');
  if(!EXAM){c.innerHTML='<div class="emp"><span style="font-size:2.5rem">📝</span><div class="et">لا يوجد امتحان</div><div class="es">المدرس لسه ما أضافش امتحان</div></div>';return;}
  c.innerHTML='<div class="ld" style="min-height:36vh"><div class="spin"></div></div>';
  const{data:qs}=await sb.from('exam_questions').select('*').eq('exam_id',EXAM.id).order('sort_order');
  if(!qs?.length){c.innerHTML='<div class="emp"><span style="font-size:2.5rem">📝</span><div class="et">لا توجد أسئلة</div></div>';return;}
  _eqs=norQs(qs);
  const{data:sub}=await sb.from('exam_submissions').select('id,score,passed,attempt_count,answers,status,ends_at').eq('exam_id',EXAM.id).eq('student_id',ME.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();
  const dr=getDraft('exam',EXAM.id);
  if(sub&&sub.status!=='in_progress'&&!startNow){renderResult(sub.score,true,!!sub.passed,sub.attempt_count||1,_eqs,sub.answers||[]);return;}
  if(!startNow){
    const left=dLeft(dr)||(sub?.ends_at?new Date(sub.ends_at).getTime()-Date.now():0);
    const resume=left>0;
    c.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;min-height:40vh">
    <div class="exam-intro-card">
      <span class="ei-ico">📝</span>
      <div class="ei-title">${esc(EXAM.title||'امتحان الحصة')}</div>
      <div class="ei-sub">لازم تعدي بدرجة <b>${ps()}%</b> أو أكتر عشان يتفتح الفيديو. لو النت قطع مكملش — الوقت بيعد من لحظة البداية.</div>
      ${resume?`<div style="border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.08);border-radius:12px;padding:12px;margin-bottom:14px;font-size:.84rem;color:var(--t2)">⚠️ عندك امتحان مفتوح — المتبقي ${fmtTimer(left)}</div>`:''}
      <div class="ei-meta">
        <div class="ei-m">📋 ${_eqs.length} سؤال</div>
        ${EXAM.duration_minutes?`<div class="ei-m">⏱️ ${EXAM.duration_minutes} دقيقة</div>`:''}
        <div class="ei-m">🎯 نجاح ${ps()}%</div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-p btn-lg" onclick="renderExam(true)">${resume?'▶ كمل الامتحان':'▶ ابدأ الامتحان'}</button>
        <button class="btn btn-out" onclick="sw('video')">🎥 الفيديو</button>
      </div>
    </div></div>`;return;
  }
  // Start / resume
  const hasDur=!!EXAM.duration_minutes;
  const now=new Date();
  let dr2=getDraft('exam',EXAM.id);
  if(!dr2||dLeft(dr2)<=0){
    dr2={startedAt:now.toISOString(),endsAt:hasDur?new Date(now.getTime()+EXAM.duration_minutes*60000).toISOString():new Date(now.getTime()+365*86400000).toISOString(),answers:{}};
    setDraft('exam',EXAM.id,dr2);
    sb.from('exam_submissions').insert({exam_id:EXAM.id,student_id:ME.id,status:'in_progress',started_at:dr2.startedAt,ends_at:dr2.endsAt,answers:[],updated_at:new Date().toISOString()}).then(()=>{});
  }
  _ans=dr2.answers||{};_sub=false;

  c.innerHTML=`<div class="exam-wrap">
    ${hasDur?`<div class="timer-row"><span style="font-size:.8rem;font-weight:700;color:var(--t3)">⏱️ الوقت المتبقي</span><div class="timer-bar"><div class="timer-fill" id="etf" style="width:100%"></div></div><div class="timer-val" id="etv">--:--</div></div>`:''}
    ${_eqs.map((q,i)=>`
    <div class="qcard ${_ans[q.id]!==undefined?'answered':''}" id="qc-${q.id}">
      <div class="q-header"><div class="q-dot"></div>سؤال ${i+1} من ${_eqs.length}</div>
      ${q.image_url?`<img class="q-img" src="${iS(q.image_url)}" onerror="this.remove()" loading="lazy">`:''}
      <div class="q-text">${esc(q.question_text)}</div>
      <div class="opts" id="opts-${q.id}">
        ${(q.options||[]).map((o,oi)=>`
        <div class="opt ${_ans[q.id]===oi?'sel':''}" id="opt-${q.id}-${oi}" onclick="pick('${q.id}',${oi})">
          <div class="opt-letter">${String.fromCharCode(65+oi)}</div>
          <div class="opt-text">${esc(o.text)}</div>
        </div>`).join('')}
      </div>
    </div>`).join('')}
  </div>
  <div class="exam-footer">
    <div class="ep-count">
      <span id="an-c">${Object.keys(_ans).length}</span>/${_eqs.length} أجبت
      <div class="ep-bar"><div class="ep-fill" id="an-f" style="width:${Math.round(Object.keys(_ans).length/_eqs.length*100)}%"></div></div>
    </div>
    <button class="btn btn-p btn-lg" id="sub-btn" onclick="submitExam(false)" style="margin-right:auto">📤 تسليم</button>
  </div>`;
  if(hasDur)startET(EXAM.duration_minutes*60,dr2.endsAt,'exam');
}

function startET(tot,endsAt){
  if(_eti)clearInterval(_eti);
  function u(){
    const sec=Math.max(0,Math.ceil((new Date(endsAt).getTime()-Date.now())/1000));
    const m=Math.floor(sec/60),s=sec%60;
    const v=document.getElementById('etv'),f=document.getElementById('etf');
    if(v){v.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;v.classList.toggle('warn',sec<=60);}
    if(f)f.style.width=Math.max(0,Math.min(100,sec/tot*100))+'%';
    if(sec<=0){clearInterval(_eti);submitExam(true);}
  }
  u();_eti=setInterval(u,1000);
}

function pick(qId,idx){
  if(_sub)return;
  document.querySelectorAll(`[id^="opt-${qId}-"]`).forEach(el=>el.classList.remove('sel'));
  document.getElementById(`opt-${qId}-${idx}`)?.classList.add('sel');
  _ans[qId]=idx;
  const d=getDraft('exam',EXAM.id)||{};d.answers=_ans;setDraft('exam',EXAM.id,d);
  const done=Object.keys(_ans).length,tot=_eqs.length;
  const ac=document.getElementById('an-c'),af=document.getElementById('an-f');
  if(ac)ac.textContent=done;if(af)af.style.width=Math.round(done/tot*100)+'%';
  document.getElementById(`qc-${qId}`)?.classList.add('answered');
}

async function submitExam(auto=false){
  if(!_eqs.length)return;if(_sub)return;
  if(!auto&&Object.keys(_ans).length<_eqs.length)return toast('w','جاوب على كل الأسئلة أولاً');
  if(!navigator.onLine){toast('w','مفيش نت — جرّب لما النت يرجع',5000);return;}
  _sub=true;if(_eti)clearInterval(_eti);
  const btn=document.getElementById('sub-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spin" style="width:14px;height:14px;border-width:2px"></div> جاري التصحيح...';}
  let cor=0;const log=[];
  _eqs.forEach(q=>{const si=_ans[q.id],opts=q.options||[];if(opts[si]?.is_correct)cor++;log.push({qId:q.id,idx:si});});
  const score=Math.round(cor/_eqs.length*100),passed=score>=ps();
  const{data:old}=await sb.from('exam_submissions').select('id,attempt_count').eq('exam_id',EXAM.id).eq('student_id',ME.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();
  const na=(old?.attempt_count||0)+1;
  const dr=getDraft('exam',EXAM.id)||{};
  const pl={exam_id:EXAM.id,student_id:ME.id,score,passed,status:'submitted',attempt_count:na,updated_at:new Date().toISOString(),answers:log,started_at:dr.startedAt||null,ends_at:dr.endsAt||null};
  const sv=old?.id?await sb.from('exam_submissions').update(pl).eq('id',old.id).select().single():await sb.from('exam_submissions').insert(pl).select().single();
  if(sv?.error){_sub=false;if(btn){btn.disabled=false;btn.innerHTML='📤 تسليم';}return toast('e','فشل الحفظ: '+sv.error.message);}
  clearDraft('exam',EXAM.id);
  setTimeout(()=>renderResult(score,false,passed,na,_eqs,log),300);
}

function renderResult(score,saved,passed,attempts,eqs,log){
  const c=document.getElementById('cnt');const pass=!!passed;
  const am={};(log||[]).forEach(a=>{am[a.qId]=a.idx;});
  c.innerHTML=`<div class="exam-wrap">
    <div class="result-card">
      <div class="score-big ${pass?'pass':'fail'}">${score}%</div>
      <div class="result-info">
        <div class="result-title">${pass?'🏆 ممتاز! الفيديو اتفتح':'📖 درجة أقل من المطلوب'}</div>
        <div class="result-sub">درجة النجاح: ${ps()}% • محاولة رقم ${attempts}${saved?' • نتيجة سابقة':' • تم الحفظ ✅'}</div>
      </div>
      <div class="result-acts">
        ${pass&&VIDEOS.length?`<button class="btn btn-g" onclick="sw('video')">▶ شاهد الفيديو</button>`:''}
        ${!pass?`<button class="btn btn-p" onclick="renderExam(true)">🔄 حاول مرة تانية</button>`:''}
        <button class="btn btn-out" onclick="goHome()">← رجوع</button>
      </div>
    </div>
    ${eqs&&eqs.length?`
    <div style="font-size:.9rem;font-weight:800;color:var(--t2);margin:4px 0 10px">📋 مراجعة الإجابات</div>
    ${eqs.map((q,i)=>{
      const opts=q.options||[],si=am[q.id],isc=opts[si]?.is_correct;
      return`<div class="qcard">
        <div class="q-header"><div class="q-dot" style="background:${si!==undefined?(isc?'var(--ok)':'var(--danger)'):'var(--t3)'}"></div>سؤال ${i+1} — ${si!==undefined?(isc?'✅ صحيحة':'❌ خاطئة'):'لم تجب'}</div>
        <div class="q-text">${esc(q.question_text)}</div>
        <div class="opts">${opts.map((o,oi)=>{
          const isSel=oi===si,isOk=o.is_correct;
          const cls='opt'+(isOk?' cor':isSel&&!isOk?' wrg':' off');
          return`<div class="${cls}"><div class="opt-letter">${String.fromCharCode(65+oi)}</div><div class="opt-text">${esc(o.text)}</div>${isOk?'<span>✅</span>':isSel&&!isOk?'<span>❌</span>':''}</div>`;
        }).join('')}</div>
      </div>`;
    }).join('')}`:''}
  </div>`;
}

/* ═══════════ HOMEWORK ═══════════ */
function hwTypeMatch(c){const t=String(c?.type||'').toLowerCase(),tx=`${c?.title||''} ${c?.body||''}`.toLowerCase();return['homework','assignment','hw','واجب'].includes(t)||tx.includes('واجب')||tx.includes('homework');}
function getHW(){
  const fromTable=(HOMEWORK||[]).map(h=>({source:'hw',id:h.id,title:h.title,body:h.description,url:h.pdf_url,due_date:h.due_date}));
  const fromContent=CONTENT.filter(hwTypeMatch).map(c=>({source:'content',id:c.id,title:c.title,body:c.body,url:c.url,due_date:null}));
  return[...fromTable,...fromContent];
}

async function renderHW(){
  const items=getHW(),c=document.getElementById('cnt');
  if(!items.length){c.innerHTML='<div class="emp"><span style="font-size:2.5rem">📌</span><div class="et">لا يوجد واجب</div><div class="es">المدرس لسه ما أضافش واجب</div></div>';return;}
  // Check for hw questions
  const hwMain=(HOMEWORK||[])[0]||null;
  if(hwMain){
    const{data:qs}=await sb.from('homework_questions').select('*').eq('homework_id',hwMain.id).order('sort_order');
    if(qs?.length){_hwQs=norQs(qs);_hwMain=hwMain;return renderHWExam(false);}
  }
  // Simple display
  const submitBox=isStaff()?'':`<div class="submit-box">
    <div class="sub-title">${HOMEWORK_DONE?'✅ تم تسليم الواجب':'📤 تسليم الواجب'}</div>
    <div class="sub-desc">لازم تدوس تسليم بعد ما تخلص الواجب عشان الحصة اللي بعدها تتفتح.</div>
    ${!HOMEWORK_DONE?`<textarea class="hw-note" id="hw-note" placeholder="ملاحظة للمدرس (اختياري)"></textarea>
    <button class="btn btn-p btn-lg" id="hw-submit-btn" onclick="submitHomeworkDone()">✅ خلصت الواجب</button>`
    :`<button class="btn btn-out" disabled>✅ تم التسليم بالفعل</button>`}
  </div>`;
  c.innerHTML=`<div class="hw-wrap">
    <div class="mat-grid">${items.map((ct,i)=>`
      <div class="hw-card">
        <div class="hw-title">📌 ${esc(ct.title||('واجب '+(i+1)))}</div>
        ${ct.due_date?`<div class="mat-sub">📅 آخر موعد: ${new Date(ct.due_date).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}</div>`:''}
        ${ct.body?`<div class="hw-body">${String(ct.body).replace(/\n/g,'<br>')}</div>`:''}
        ${ct.url?`<a href="${iS(ct.url)}" target="_blank" class="btn btn-g" style="margin-top:10px;font-size:.8rem">فتح المرفق ←</a>`:''}
      </div>`).join('')}</div>
    ${submitBox}
  </div>`;
}

async function submitHomeworkDone(){
  if(isStaff())return;
  if(!navigator.onLine){toast('w','مفيش نت',4000);return;}
  const btn=document.getElementById('hw-submit-btn');
  const notes=(document.getElementById('hw-note')?.value||'').trim();
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spin" style="width:14px;height:14px;border-width:2px"></div> جاري الحفظ...';}
  const{error}=await sb.from('homework_submissions').upsert({lesson_id:LESSON.id,student_id:ME.id,status:'submitted',notes:notes||null,submitted_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'lesson_id,student_id'});
  if(error){
    if(btn){btn.disabled=false;btn.textContent='✅ خلصت الواجب';}
    return toast('e',error.message.includes('does not exist')?'شغّل ملف SQL أولاً':error.message,5000);
  }
  HOMEWORK_DONE=true;toast('s','تم تسليم الواجب ✅');renderHW();
}

function hwPass(){return Math.max(0,Math.min(100,Number(_hwMain?.pass_score??50)));}

  const c=document.getElementById('cnt');
  const{data:sub}=await sb.from('homework_submissions').select('*').eq('lesson_id',LESSON.id).eq('student_id',ME.id).maybeSingle();
  const dr=getDraft('homework',LESSON.id);
  if(sub?.passed&&!startNow){HOMEWORK_DONE=true;return hwResult(sub.score,true,sub.attempt_count||1);}
  if(!startNow){
    const left=dLeft(dr)||(sub?.ends_at?new Date(sub.ends_at).getTime()-Date.now():0),resume=left>0;
    c.innerHTML=`<div class="hw-wrap"><div style="display:flex;align-items:center;justify-content:center;min-height:40vh">
    <div class="exam-intro-card">
      <span class="ei-ico">📌</span>

      ${resume?`<div style="border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.08);border-radius:12px;padding:12px;margin-bottom:14px;font-size:.84rem">⚠️ عندك واجب مفتوح — المتبقي ${fmtTimer(left)}</div>`:''}
      <div class="ei-meta">
        <div class="ei-m">📋 ${_hwQs.length} سؤال</div>
        ${_hwMain.duration_minutes?`<div class="ei-m">⏱️ ${_hwMain.duration_minutes} دقيقة</div>`:''}
        <div class="ei-m">🎯 نجاح ${hwPass()}%</div>
      </div>
      <button class="btn btn-p btn-lg" onclick="renderHWExam(true)">${resume?'▶ كمل الواجب':'▶ ابدأ الواجب'}</button>
    </div></div></div>`;return;
  }
  const hasDur=!!_hwMain.duration_minutes,now=new Date();
  let dr2=getDraft('homework',LESSON.id);
  if(!dr2||dLeft(dr2)<=0){
    dr2={startedAt:now.toISOString(),endsAt:hasDur?new Date(now.getTime()+_hwMain.duration_minutes*60000).toISOString():new Date(now.getTime()+365*86400000).toISOString(),answers:{}};
    setDraft('homework',LESSON.id,dr2);
    sb.from('homework_submissions').upsert({lesson_id:LESSON.id,student_id:ME.id,status:'in_progress',started_at:dr2.startedAt,ends_at:dr2.endsAt,updated_at:new Date().toISOString()},{onConflict:'lesson_id,student_id'}).then(()=>{});
  }
  _hwAns=dr2.answers||{};_hwSub=false;
  c.innerHTML=`<div class="exam-wrap">
    ${hasDur?`<div class="timer-row"><span style="font-size:.8rem;font-weight:700;color:var(--t3)">⏱️ الوقت</span><div class="timer-bar"><div class="timer-fill" id="etf"></div></div><div class="timer-val" id="etv">--:--</div></div>`:''}
    ${_hwQs.map((q,i)=>`<div class="qcard ${_hwAns[q.id]!==undefined?'answered':''}" id="hw-qc-${q.id}">
      <div class="q-header"><div class="q-dot"></div>سؤال ${i+1} من ${_hwQs.length}</div>
      <div class="q-text">${esc(q.question_text)}</div>
      <div class="opts">${(q.options||[]).map((o,oi)=>`<div class="opt ${_hwAns[q.id]===oi?'sel':''}" id="hw-opt-${q.id}-${oi}" onclick="pickHW('${q.id}',${oi})"><div class="opt-letter">${String.fromCharCode(65+oi)}</div><div class="opt-text">${esc(o.text)}</div></div>`).join('')}</div>
    </div>`).join('')}

    <button class="btn btn-p btn-lg" id="hw-submit-btn" onclick="submitHWExam(false)" style="margin-right:auto">📤 تسليم الواجب</button>
  </div>`;
  if(hasDur)startET(_hwMain.duration_minutes*60,dr2.endsAt);

function pickHW(qId,idx){
  if(_hwSub)return;
  document.querySelectorAll(`[id^="hw-opt-${qId}-"]`).forEach(e=>e.classList.remove('sel'));
  document.getElementById(`hw-opt-${qId}-${idx}`)?.classList.add('sel');
  _hwAns[qId]=idx;
  const d=getDraft('homework',LESSON.id)||{};d.answers=_hwAns;setDraft('homework',LESSON.id,d);
  document.getElementById('hw-an-c').textContent=Object.keys(_hwAns).length;
  document.getElementById('hw-an-f').style.width=Math.round(Object.keys(_hwAns).length/_hwQs.length*100)+'%';
}
async function submitHWExam(auto=false){
  if(!auto&&Object.keys(_hwAns).length<_hwQs.length)return toast('w','جاوب على كل الأسئلة');
  if(!navigator.onLine){toast('w','مفيش نت',4000);return;}
  _hwSub=true;if(_eti)clearInterval(_eti);
  let cor=0,log=[];
  _hwQs.forEach(q=>{const si=_hwAns[q.id],opts=q.options||[];if(opts[si]?.is_correct)cor++;log.push({qId:q.id,idx:si});});
  const score=Math.round(cor/_hwQs.length*100),passed=score>=hwPass();
  const dr=getDraft('homework',LESSON.id)||{};
  const{data:old}=await sb.from('homework_submissions').select('attempt_count').eq('lesson_id',LESSON.id).eq('student_id',ME.id).maybeSingle();
  const na=(old?.attempt_count||0)+1;
  const{error}=await sb.from('homework_submissions').upsert({lesson_id:LESSON.id,student_id:ME.id,status:passed?'submitted':'in_progress',score,passed,answers:log,attempt_count:na,started_at:dr.startedAt||null,ends_at:dr.endsAt||null,submitted_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'lesson_id,student_id'});
  if(error)return toast('e',error.message);
  if(passed){HOMEWORK_DONE=true;clearDraft('homework',LESSON.id);}
  hwResult(score,passed,na);
}
function hwResult(score,passed,attempts){
  document.getElementById('cnt').innerHTML=`<div class="result-card">
    <div class="score-big ${passed?'pass':'fail'}">${score}%</div>
    <div class="result-info"><div class="result-title">${passed?'✅ تم تسليم الواجب':'📖 لازم تعيد الواجب'}</div><div class="result-sub">درجة النجاح: ${hwPass()}% • محاولة رقم ${attempts}</div></div>
    <div class="result-acts">${passed?`<button class="btn btn-g" onclick="sw('video')">▶ شاهد الفيديو</button>`:`<button class="btn btn-p" onclick="renderHWExam(true)">🔄 حاول مرة تانية</button>`}</div>
  </div>`;
}

function renderPDF(){
  const pdfs=CONTENT.filter(c=>String(c.type||'').toLowerCase()==='pdf');
  const imgs=CONTENT.filter(c=>String(c.type||'').toLowerCase()==='image');
  const c=document.getElementById('cnt');
  if(!pdfs.length&&!imgs.length){c.innerHTML='<div class="emp"><span style="font-size:2.5rem">📄</span><div class="et">لا يوجد ملفات</div><div class="es">أي ملف يضيفه المدرس هيظهر هنا</div></div>';return;}
  c.innerHTML=`
    ${pdfs.length?`<div class="mat-grid">${pdfs.map((p,i)=>`<a class="mat-card" href="${iS(p.url)||'#'}" target="_blank"><span class="mat-ico">📄</span><div class="mat-title">${esc(p.title||('PDF '+(i+1)))}</div><div class="mat-sub">اضغط لفتح أو تحميل</div></a>`).join('')}</div>`:''}
    ${imgs.length?`<div style="display:flex;flex-direction:column;gap:14px;margin-top:${pdfs.length?'14px':'0'}">${imgs.map((p,i)=>`<div><div style="font-size:.8rem;color:var(--t2);font-weight:700;margin-bottom:7px">🖼️ ${esc(p.title||('صورة '+(i+1)))}</div><div style="border-radius:13px;overflow:hidden;border:1px solid var(--bd)"><img style="width:100%;display:block" src="${iS(p.url)}" onerror="this.remove()" loading="lazy"></div></div>`).join('')}</div>`:''}`;
}

/* ═══════════ EXPIRED ═══════════ */
function showExpired(){
  document.getElementById('il')?.remove();stopPlayer();
  const lid=new URLSearchParams(location.search).get('id')||'';
  const ltitle=LESSON?.title||'الحصة';
  const limg=LESSON?.image_url?iSrc(LESSON.image_url):'';
  document.getElementById('page').innerHTML=`
  <div class="gate-wrap">
    <div class="gate-card" style="animation:shake .4s ease .1s">
      <span class="gate-icon">⏰</span>
      <div class="gate-title">انتهى وقت الحصة</div>
      <div class="gate-sub">اختار طريقة للمتابعة</div>
      <div class="exp-tabs">
        <button class="exp-tab on" id="etab-code" onclick="switchExpTab('code')">🔑 عندي كود</button>
        <button class="exp-tab" id="etab-buy" onclick="switchExpTab('buy')">🛒 اشتري مجدداً</button>
      </div>
      <div class="exp-panel on" id="epanel-code">
        <div class="code-row">
          <input id="new-code-inp" class="code-inp" placeholder="ادخل الكود الجديد..." maxlength="30"
            oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')redeemCode()">
          <button class="btn btn-p" onclick="redeemCode()" id="redeem-btn" style="flex-shrink:0">✓ تفعيل</button>
        </div>
        <div style="font-size:.74rem;color:var(--t3);text-align:center">ادخل كود جديد من المدرس</div>
      </div>
      <div class="exp-panel" id="epanel-buy">
        <div style="background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.15);border-radius:11px;padding:13px;margin-bottom:12px;text-align:right">
          <div style="font-weight:800;font-size:.9rem;margin-bottom:3px">${esc(ltitle)}</div>
          <div style="font-size:.77rem;color:var(--t3)">ضيف للسلة وادخل كود جديد في صفحة الدفع</div>
        </div>
        <button class="btn btn-p" style="width:100%;justify-content:center;margin-bottom:8px" onclick="addToCart('${lid}','${esc(ltitle)}','${esc(limg)}')">🛒 ضيف للسلة واشتري</button>
      </div>
      <div class="divider">أو</div>
      <button class="btn btn-out" onclick="goHome()" style="width:100%;justify-content:center">← العودة للرئيسية</button>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById('new-code-inp')?.focus(),200);
}
function switchExpTab(t){
  ['code','buy'].forEach(x=>{
    document.getElementById(`etab-${x}`)?.classList.toggle('on',x===t);
    document.getElementById(`epanel-${x}`)?.classList.toggle('on',x===t);
  });
  if(t==='code')setTimeout(()=>document.getElementById('new-code-inp')?.focus(),80);
}
function addToCart(id,title,img){
  if(!ME?.id){window.location.href='/login/';return;}
  try{let cart=JSON.parse(localStorage.getItem(`kw-cart-${ME.id}`)||'[]');if(!cart.some(c=>c.id===id)){cart.push({id,title,image_url:img,price:null});localStorage.setItem(`kw-cart-${ME.id}`,JSON.stringify(cart));}}catch{}
  window.location.href='/checkout/';
}
async function redeemCode(){
  const lid=new URLSearchParams(location.search).get('id');
  const inp=document.getElementById('new-code-inp');
  const code=(inp?.value||'').trim().toUpperCase();
  const btn=document.getElementById('redeem-btn');
  if(!code)return toast('w','ادخل الكود أولاً');
  btn.innerHTML='<div class="spin" style="width:12px;height:12px;border-width:2px;border-color:rgba(255,255,255,.2);border-top-color:#fff"></div>';btn.disabled=true;
  const{data:row,error}=await sb.from('lesson_codes').select('id,lesson_id,used_by').eq('code',code).single();
  if(error||!row){toast('e','الكود غلط أو غير موجود');btn.innerHTML='✓ تفعيل';btn.disabled=false;return;}
  if(row.lesson_id!==lid){toast('e','الكود ده لحصة تانية');btn.innerHTML='✓ تفعيل';btn.disabled=false;return;}
  if(row.used_by&&row.used_by!==ME.id){toast('e','الكود اتستخدم قبل كده');btn.innerHTML='✓ تفعيل';btn.disabled=false;return;}
  const{error:upErr}=await sb.from('lesson_codes').update({used_by:ME.id,used_at:new Date().toISOString()}).eq('id',row.id);
  if(upErr){toast('e','فشل التفعيل: '+upErr.message);btn.innerHTML='✓ تفعيل';btn.disabled=false;return;}
  toast('s','🎉 تم تفعيل الكود! جاري إعادة التحميل...',2500);
  setTimeout(()=>location.reload(),1500);
}

/* ═══════════ ERROR ═══════════ */
function showErr(msg){
  document.getElementById('il')?.remove();
  document.getElementById('page').innerHTML=`
  <div class="err-wrap"><div class="err-card">
    <span style="font-size:3rem;display:block;margin-bottom:12px">🔒</span>
    <div style="font-size:1rem;font-weight:900;margin-bottom:18px;color:var(--txt)">${esc(msg)}</div>
    <button class="btn btn-p btn-lg" onclick="goHome()">← العودة للرئيسية</button>
  </div></div>`;
}

/* ═══════════ NETWORK ═══════════ */
window.addEventListener('offline',()=>toast('w','النت قطع. الإجابات محفوظة محلياً.',5500));
window.addEventListener('online',()=>toast('s','النت رجع ✅ كمل وسلم دلوقتي',3500));
</script>
</body>
</html>
