<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>kalawy — الحصة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ═══════════ ROOT VARS — PURPLE THEME ═══════════ */
:root {
  --p1: #8b5cf6;
  --p2: #6d28d9;
  --p3: #a78bfa;
  --p4: #c4b5fd;
  --glow: rgba(139,92,246,.28);
  --glow2: rgba(109,40,217,.18);
  --gold: #fbbf24;
  --danger: #f87171;
  --success: #34d399;
  --r: 14px;
  --r-sm: 10px;
  --r-lg: 20px;
  --r-xl: 28px;
}
[data-theme="dark"] {
  --bg: #0a0612;
  --bg2: #0f0a1e;
  --bg3: #140d24;
  --surface: rgba(255,255,255,.04);
  --surface-h: rgba(255,255,255,.08);
  --border: rgba(139,92,246,.18);
  --border-h: rgba(139,92,246,.38);
  --shadow: 0 8px 32px rgba(0,0,0,.6);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.7);
  --text: #f0ebff;
  --t2: #9d8ec7;
  --t3: #5a4a80;
  --shine: rgba(139,92,246,.06);
}
[data-theme="light"] {
  --bg: #f3eeff;
  --bg2: #ebe2ff;
  --bg3: #e0d4ff;
  --surface: rgba(139,92,246,.06);
  --surface-h: rgba(139,92,246,.12);
  --border: rgba(139,92,246,.2);
  --border-h: rgba(139,92,246,.4);
  --shadow: 0 8px 32px rgba(109,40,217,.12);
  --shadow-lg: 0 24px 60px rgba(109,40,217,.18);
  --text: #1a0a38;
  --t2: #4c2a9a;
  --t3: #8b6ad0;
  --shine: rgba(255,255,255,.6);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}
.hidden { display: none !important; }

/* ═══════ BACKGROUND MESH ═══════ */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 60% 40% at 15% 0%, rgba(139,92,246,.14) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 90% 80%, rgba(109,40,217,.1) 0%, transparent 60%),
    radial-gradient(ellipse 30% 50% at 50% 50%, rgba(167,139,250,.04) 0%, transparent 70%);
}

/* ═══════ GLASS CARD ═══════ */
.glass {
  background: var(--surface);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.glass::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--shine) 0%, transparent 50%);
  pointer-events: none;
  border-radius: inherit;
}

/* ═══════ SCROLLBAR ═══════ */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--p2); border-radius: 99px; }

/* ═══════ HEADER / NAV ═══════ */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 500;
  height: 68px;
  background: linear-gradient(135deg, #0a0612 0%, #120828 100%);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 16px;
}
[data-theme="light"] .nav { background: linear-gradient(135deg, #ebe2ff 0%, #ddd0ff 100%); }

.nav-logo {
  width: 44px; height: 44px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: .9rem;
  color: #fff;
  box-shadow: 0 4px 16px var(--glow);
  cursor: pointer;
  flex-shrink: 0;
  transition: .2s;
}
.nav-logo:hover { transform: scale(1.05); box-shadow: 0 6px 22px var(--glow); }
.nav-brand { font-weight: 900; font-size: 1.2rem; letter-spacing: -.02em; cursor: pointer; }
.nav-brand em { font-style: normal; color: var(--p3); }
.nav-sp { flex: 1; }
.nav-ctrls { display: flex; gap: 10px; align-items: center; }

.theme-pill {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 4px;
  gap: 2px;
}
.topt {
  padding: 5px 11px;
  border-radius: 99px;
  border: none;
  background: transparent;
  color: var(--t3);
  font-size: .75rem;
  font-weight: 700;
  cursor: pointer;
  transition: .15s;
}
.topt.on { background: linear-gradient(135deg, var(--p1), var(--p2)); color: #fff; }
.back-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 18px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--t2);
  font-weight: 700;
  font-size: .85rem;
  cursor: pointer;
  transition: .15s;
  font-family: 'Tajawal', sans-serif;
}
.back-btn:hover { border-color: var(--p1); color: var(--text); }

/* ═══════ PURPLE HEADER BANNER ═══════ */
.lesson-banner {
  background: linear-gradient(135deg, #4c1d95 0%, #2e1065 50%, #1a0b3d 100%);
  border-bottom: 1px solid rgba(139,92,246,.3);
  padding: 28px 36px;
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.lesson-banner::after {
  content: '';
  position: absolute;
  top: -80px; left: -80px;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(167,139,250,.25), transparent 70%);
  pointer-events: none;
}
.banner-inner { position: relative; z-index: 2; display: flex; align-items: center; gap: 22px; }
.banner-cover {
  width: 110px; height: 72px;
  border-radius: 16px;
  overflow: hidden;
  background: rgba(139,92,246,.2);
  border: 1px solid rgba(139,92,246,.35);
  display: grid;
  place-items: center;
  font-size: 1.8rem;
  flex-shrink: 0;
}
.banner-cover img { width: 100%; height: 100%; object-fit: cover; }
.banner-text { flex: 1; min-width: 0; }
.banner-chapter { font-size: .72rem; color: rgba(196,181,253,.7); margin-bottom: 4px; letter-spacing: .05em; text-transform: uppercase; }
.banner-title { font-size: clamp(1.2rem, 2.5vw, 1.8rem); font-weight: 900; color: #fff; letter-spacing: -.02em; margin-bottom: 10px; }
.banner-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.bchip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  border-radius: 99px;
  font-size: .75rem;
  font-weight: 700;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  color: rgba(196,181,253,.9);
  backdrop-filter: blur(10px);
}

/* ═══════ MAIN LAYOUT ═══════ */
.main {
  padding-top: 68px;
  max-width: 1320px;
  margin: 0 auto;
  padding-left: 24px;
  padding-right: 24px;
  padding-bottom: 0;
  position: relative;
  z-index: 1;
}

/* ═══════ TABS ═══════ */
.tabs-wrap {
  position: sticky;
  top: 68px;
  z-index: 300;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  gap: 0;
}
.tab-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 22px;
  border: none;
  background: transparent;
  color: var(--t3);
  font-weight: 700;
  font-size: .9rem;
  cursor: pointer;
  transition: .2s;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  font-family: 'Tajawal', sans-serif;
  position: relative;
}
.tab-btn:hover { color: var(--p3); }
.tab-btn.on { color: var(--p1); border-bottom-color: var(--p1); }
.tab-badge {
  background: var(--p2);
  color: #fff;
  font-size: .62rem;
  font-weight: 900;
  padding: 2px 7px;
  border-radius: 99px;
  min-width: 20px;
  text-align: center;
}
.tab-btn:not(.on) .tab-badge { background: var(--surface); color: var(--t3); }

/* ═══════ CONTENT AREA ═══════ */
#tab-content { min-height: calc(100vh - 68px - 53px - 72px); }

/* ═══════ VIDEO LAYOUT ═══════ */
.video-layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: calc(100vh - 68px - 53px);
}

/* SIDEBAR */
.parts-sidebar {
  border-left: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 16px 20px;
  font-weight: 800;
  font-size: .85rem;
  color: var(--t2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.sidebar-progress-text {
  margin-right: auto;
  font-size: .72rem;
  color: var(--p3);
  font-weight: 700;
}
.parts-list { overflow-y: auto; flex: 1; }
.part-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: .18s;
  position: relative;
}
.part-item:last-child { border-bottom: none; }
.part-item:hover { background: var(--surface-h); }
.part-item.active {
  background: rgba(139,92,246,.1);
  border-right: 3px solid var(--p1);
}
.part-num {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-size: .78rem;
  font-weight: 700;
  flex-shrink: 0;
  transition: .18s;
  color: var(--t2);
}
.part-item.active .part-num {
  background: linear-gradient(135deg, var(--p1), var(--p2));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 12px var(--glow);
}
.part-item.watched .part-num {
  background: linear-gradient(135deg, #059669, #10b981);
  border-color: transparent;
  color: #fff;
}
.part-item.watched:not(.active) .part-num { background: linear-gradient(135deg, #059669, #10b981); }
.part-info { flex: 1; min-width: 0; }
.part-title { font-size: .87rem; font-weight: 700; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.part-meta { font-size: .68rem; color: var(--t3); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.part-active-badge {
  font-size: .62rem;
  font-weight: 900;
  color: var(--p3);
}
.sidebar-overall {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg3);
}
.sidebar-prog-bar { height: 5px; background: var(--surface); border-radius: 99px; overflow: hidden; margin-bottom: 7px; }
.sidebar-prog-fill { height: 100%; background: linear-gradient(90deg, var(--p1), var(--p3)); border-radius: 99px; transition: width .4s ease; }
.sidebar-prog-label { font-size: .72rem; color: var(--t3); font-weight: 700; text-align: center; }

/* PLAYER AREA */
.player-area {
  display: flex;
  flex-direction: column;
  background: #050208;
}
.cplayer {
  position: relative;
  width: 100%;
  max-height: 52vh;
  aspect-ratio: 16/9;
  background: #000;
  overflow: hidden;
  isolation: isolate;
}
.cplayer #yt-player-el {
  position: absolute;
  inset: -7%;
  width: 114%;
  height: 114%;
  z-index: 1;
  background: #000;
  overflow: hidden;
}
.cplayer #yt-player-el iframe {
  width: 100% !important;
  height: 100% !important;
  border: none;
  display: block;
  pointer-events: none;
  transform: scale(1.02);
  transform-origin: center center;
}
.yt-guard {
  position: absolute;
  inset: 0;
  z-index: 14;
  cursor: pointer;
  background: transparent;
}
.yt-brand-mask { position: absolute; z-index: 18; pointer-events: none; background: #000; }
.yt-mask-br { right: 0; bottom: 0; width: 168px; height: 54px; background: linear-gradient(135deg, transparent 0%, #000 32%); }
.yt-mask-tl { left: 0; top: 0; width: 230px; height: 56px; background: linear-gradient(315deg, transparent 0%, #000 38%); }

/* Custom controls */
.pc {
  position: absolute; inset: 0; z-index: 30;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: linear-gradient(transparent 35%, rgba(5,2,8,.8) 100%);
  opacity: 1;
  transition: opacity .35s;
  pointer-events: none;
}
.pc.hide { opacity: 0; }
.pc > * { pointer-events: auto; }
.pc-flash {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 68px; height: 68px;
  border-radius: 50%;
  background: rgba(139,92,246,.88);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
  opacity: 0; transition: opacity .18s;
  pointer-events: none;
  backdrop-filter: blur(8px);
}
.pc-flash.show { opacity: 1; }
.pc-top { padding: 14px 18px 0; display: flex; align-items: center; gap: 10px; }
.pc-top-title { font-size: .9rem; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.8); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-bottom { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 7px; }
.pc-progress { height: 18px; display: flex; align-items: center; cursor: pointer; position: relative; }
.pc-track { width: 100%; height: 4px; background: rgba(255,255,255,.2); border-radius: 99px; overflow: hidden; transition: height .15s; position: relative; }
.pc-progress:hover .pc-track { height: 6px; }
.pc-fill { height: 100%; background: linear-gradient(90deg, var(--p1), var(--p3)); border-radius: 99px; pointer-events: none; transition: width .1s linear; }
.pc-thumb { position: absolute; top: 50%; transform: translate(-50%,-50%); width: 13px; height: 13px; border-radius: 50%; background: var(--p3); box-shadow: 0 2px 8px var(--glow); opacity: 0; transition: opacity .15s; pointer-events: none; }
.pc-progress:hover .pc-thumb { opacity: 1; }
.pc-row { display: flex; align-items: center; gap: 9px; }
.pc-btn { background: rgba(255,255,255,.1); border: none; color: #fff; cursor: pointer; padding: 6px 8px; border-radius: 8px; font-size: 1rem; transition: .15s; display: flex; align-items: center; justify-content: center; }
.pc-btn:hover { background: rgba(139,92,246,.5); }
.pc-time { font-family: 'Inter', monospace; font-size: .75rem; color: rgba(255,255,255,.9); white-space: nowrap; min-width: 106px; }
.pc-spacer { flex: 1; }
.pc-sel { background: rgba(10,6,18,.82); border: 1px solid rgba(139,92,246,.3); color: #fff; border-radius: 8px; padding: 4px 8px; font-size: .75rem; font-weight: 700; cursor: pointer; outline: none; transition: .15s; font-family: 'Tajawal', sans-serif; }
.pc-sel:hover { border-color: var(--p1); }
.pc-sel option { background: #140d24; color: #fff; }
.pc-vol { width: 65px; height: 4px; border-radius: 99px; accent-color: var(--p1); cursor: pointer; }
.vp-bar {
  padding: 14px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(10,6,18,.6);
  backdrop-filter: blur(10px);
}
.vp-bar-title { font-weight: 800; font-size: .92rem; flex: 1; }
.vp-nav-btns { display: flex; gap: 8px; }

/* Celebrity watermark */
.kw-watermark-wrap {
  position: absolute;
  z-index: 22;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  animation: wmFloat 3s ease-in-out infinite;
}
@keyframes wmFloat {
  0%,100% { opacity: .55; transform: rotate(var(--rot,−10deg)) translateY(0); }
  50%      { opacity: .88; transform: rotate(var(--rot,−10deg)) translateY(-4px); }
}
.kw-celeb-avatar {
  width: clamp(36px,4vw,56px);
  height: clamp(36px,4vw,56px);
  border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
  box-shadow: 0 4px 18px rgba(139,92,246,.55), 0 0 0 2px rgba(196,181,253,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.kw-celeb-avatar svg { width: 70%; height: 70%; }
.kw-student-id {
  font-family: 'Inter', monospace;
  font-size: clamp(9px,1.1vw,14px);
  font-weight: 900;
  color: #ff3b3b;
  text-shadow: 0 1px 8px rgba(0,0,0,.95), 0 0 12px rgba(255,0,0,.4);
  letter-spacing: .05em;
  white-space: nowrap;
  background: rgba(0,0,0,.55);
  padding: 2px 7px;
  border-radius: 99px;
  border: 1px solid rgba(255,50,50,.35);
}

/* AdBlock overlay */
.shield-overlay {
  position: absolute; inset: 0; z-index: 100;
  background: rgba(5,2,8,.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; padding: 28px;
}
.so-ico { font-size: 3rem; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
.so-title { font-size: 1.1rem; font-weight: 900; color: var(--danger); }
.so-sub { font-size: .83rem; color: var(--t2); line-height: 1.8; max-width: 320px; }
.so-sub strong { color: var(--gold); }

/* ═══════ EXAM SECTION ═══════ */
.exam-page { padding: 28px; max-width: 860px; margin: 0 auto; }
.exam-intro-card {
  border-radius: var(--r-xl);
  padding: 36px;
  text-align: center;
  margin-bottom: 0;
}
.ei-ico { font-size: 3.5rem; margin-bottom: 12px; display: block; }
.ei-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 8px; }
.ei-sub { font-size: .88rem; color: var(--t2); line-height: 1.7; margin-bottom: 22px; max-width: 440px; margin-left: auto; margin-right: auto; }
.ei-meta-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.ei-met {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 16px;
  border-radius: 99px;
  font-size: .82rem;
  font-weight: 700;
  background: var(--surface);
  border: 1px solid var(--border);
}

/* Question cards */
.q-card {
  border-radius: var(--r-lg);
  padding: 22px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: border-color .2s;
}
.q-card.answered { border-color: rgba(139,92,246,.35); }
.q-num-lbl { font-size: .68rem; color: var(--t3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.q-num-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--p1); }
.q-txt { font-weight: 700; font-size: .97rem; margin-bottom: 16px; line-height: 1.7; user-select: text; }
.q-img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 12px; margin-bottom: 14px; display: block; border: 1px solid var(--border); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 11px;
  padding: 12px 15px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--bg2);
  cursor: pointer;
  transition: .2s;
}
.opt:hover { border-color: rgba(139,92,246,.4); background: rgba(139,92,246,.06); }
.opt.sel { border-color: var(--p1); background: rgba(139,92,246,.12); }
.opt.correct { border-color: #34d399 !important; background: rgba(52,211,153,.1) !important; pointer-events: none; }
.opt.wrong { border-color: #f87171 !important; background: rgba(248,113,113,.1) !important; pointer-events: none; }
.opt.neutral { pointer-events: none; opacity: .6; }
.opt-c {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: grid; place-items: center;
  font-size: .7rem; font-weight: 700;
  flex-shrink: 0;
  transition: .15s;
  color: var(--t3);
}
.opt.sel .opt-c { background: var(--p1); border-color: var(--p1); color: #fff; }
.opt.correct .opt-c { background: #34d399; border-color: #34d399; color: #fff; }
.opt.wrong .opt-c { background: #f87171; border-color: #f87171; color: #fff; }
.opt-t { font-size: .88rem; font-weight: 600; flex: 1; user-select: text; }
.opt-result-icon { font-size: .85rem; margin-right: auto; flex-shrink: 0; }

/* Exam footer */
.exam-footer {
  position: sticky;
  bottom: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  backdrop-filter: blur(12px);
  z-index: 100;
}
.exam-prog { display: flex; align-items: center; gap: 10px; font-size: .83rem; color: var(--t2); }
.exam-prog-bar { width: 130px; height: 5px; background: var(--surface); border-radius: 99px; overflow: hidden; }

.score-summary {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 14px 18px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.score-big { font-size: 2.4rem; font-weight: 900; letter-spacing: -.04em; line-height: 1; }
.score-big.pass { color: #34d399; }
.score-big.fail { color: #f87171; }
.score-info { flex: 1; }
.score-label { font-size: 1rem; font-weight: 800; }
.score-detail { font-size: .82rem; color: var(--t2); margin-top: 4px; line-height: 1.6; }

/* ═══════ RESULT CARD ═══════ */
.result-card {
  border-radius: var(--r-xl);
  padding: 40px 32px;
  text-align: center;
}
.res-ico { font-size: 4rem; margin-bottom: 14px; display: block; }
.res-score { font-size: 4.5rem; font-weight: 900; letter-spacing: -.05em; line-height: 1; margin: 8px 0; }
.res-score.pass { color: #34d399; }
.res-score.fail { color: #f87171; }
.res-label { font-size: 1.15rem; font-weight: 900; margin-bottom: 6px; }
.res-detail { font-size: .85rem; color: var(--t2); margin-bottom: 26px; line-height: 1.7; }
.res-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ═══════ PDF / HOMEWORK ═══════ */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 14px; padding: 24px; }
.card-item {
  padding: 20px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: .2s;
  text-decoration: none;
  color: var(--text);
  display: block;
}
.card-item:hover { transform: translateY(-3px); border-color: var(--p1); box-shadow: 0 12px 32px var(--glow2); }
.card-ico { font-size: 2rem; margin-bottom: 10px; display: block; }
.card-title { font-size: .95rem; font-weight: 900; margin-bottom: 6px; }
.card-sub { font-size: .78rem; color: var(--t2); line-height: 1.7; user-select: text; }
.card-body { margin-top: 10px; color: var(--t2); font-size: .86rem; line-height: 1.9; user-select: text; }
.content-img { width: 100%; border-radius: 12px; border: 1px solid var(--border); display: block; }
.img-section { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.img-wrap { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--border); }
.img-label { font-size: .82rem; color: var(--t2); font-weight: 700; margin-bottom: 8px; }

/* ═══════ TIMER BANNER ═══════ */
#timer-banner {
  position: fixed;
  top: 68px; left: 0; right: 0;
  z-index: 400;
  height: 3px;
  background: var(--bg3);
}
.timer-fill { height: 100%; background: linear-gradient(90deg, var(--p2), var(--p1), var(--p3)); transition: width 1s linear; }
#timer-chip {
  position: fixed;
  top: 78px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 401;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 5px 16px;
  font-size: .78rem;
  font-weight: 900;
  font-family: 'Inter', monospace;
  display: flex; align-items: center; gap: 7px;
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
  white-space: nowrap;
  transition: border-color .3s;
}
#timer-chip.warn { border-color: rgba(248,113,113,.5); color: #f87171; }
#timer-chip.ok { color: var(--p3); border-color: rgba(139,92,246,.4); }

/* Access info panel */
.access-panel {
  margin: 20px 24px;
  padding: 16px 20px;
  border-radius: var(--r-lg);
  background: rgba(139,92,246,.07);
  border: 1px solid rgba(139,92,246,.2);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.access-icon { font-size: 1.8rem; flex-shrink: 0; }
.access-info { flex: 1; }
.access-title { font-weight: 800; font-size: .9rem; margin-bottom: 4px; }
.access-time { font-family: 'Inter', monospace; font-size: 1.4rem; font-weight: 900; color: var(--p3); letter-spacing: .02em; }
.access-label { font-size: .72rem; color: var(--t3); margin-top: 2px; }

/* ═══════ DEVTOOLS OVERLAY ═══════ */
#dt-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 999999;
  background: rgba(2,0,8,.98);
  backdrop-filter: blur(20px);
  flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; text-align: center; padding: 30px;
}
.dto-icon { font-size: 5rem; }
.dto-title { font-size: 1.6rem; font-weight: 900; color: var(--danger); letter-spacing: -.03em; }
.dto-sub { font-size: .92rem; color: var(--t2); line-height: 1.8; max-width: 380px; }
.dto-warn { padding: 10px 18px; background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.2); border-radius: var(--r-sm); font-size: .8rem; color: var(--t3); }

/* ═══════ BUTTONS ═══════ */
.btn { border: none; border-radius: var(--r-sm); padding: 11px 20px; font-weight: 700; cursor: pointer; font-size: .9rem; transition: .18s; display: inline-flex; align-items: center; gap: 7px; font-family: 'Tajawal', sans-serif; }
.btn-p { background: linear-gradient(135deg, var(--p1), var(--p2)); color: #fff; box-shadow: 0 5px 18px var(--glow); }
.btn-p:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 8px 24px var(--glow); }
.btn-p:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-gl { background: var(--surface); color: var(--t2); border: 1px solid var(--border); backdrop-filter: blur(10px); }
.btn-gl:hover { color: var(--text); border-color: var(--p1); }
.btn-lg { padding: 14px 32px; font-size: 1rem; border-radius: var(--r-lg); }

/* ═══════ UTILS ═══════ */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; color: var(--t3); }
.ld { width: 36px; height: 36px; border: 3px solid rgba(139,92,246,.15); border-top-color: var(--p1); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-pg { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 12px; color: var(--t3); text-align: center; padding: 40px; }
.empty-pg .ei-title { color: var(--text); }

#toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { display: flex; gap: 10px; align-items: center; background: var(--bg2); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 14px; padding: 11px 18px; box-shadow: var(--shadow-lg); animation: tin .22s ease; pointer-events: all; white-space: nowrap; font-weight: 700; font-size: .87rem; }
.ts { border-color: rgba(52,211,153,.4); } .te { border-color: rgba(248,113,113,.4); } .tw { border-color: rgba(251,191,36,.4); }
@keyframes tin { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes tout { to { opacity:0; transform:translateY(8px); } }
.tx { animation: tout .2s ease forwards; }

/* ═══════ FOOTER ═══════ */
.page-footer {
  background: linear-gradient(135deg, #1a0b3d 0%, #120828 50%, #0a0612 100%);
  border-top: 1px solid rgba(139,92,246,.25);

.footer-brand em { font-style: normal; color: var(--p3); }
.footer-text { font-size: .78rem; color: rgba(139,92,246,.5); letter-spacing: .05em; }
.footer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--p2); display: inline-block; margin: 0 6px; vertical-align: middle; animation: pulse 2s infinite; }

/* ═══════ RESPONSIVE ═══════ */
@media (max-width: 900px) {
  .video-layout { grid-template-columns: 1fr; }
  .parts-sidebar { border-left: none; border-top: 1px solid var(--border); max-height: 220px; }

/* ══════════ AD BLOCK DETECT ══════════ */
function detectAdBlock(cb){

}

/* ══════════ YT API ══════════ */
let _ytReady=false, _ytCbs=[];
window.onYouTubeIframeAPIReady=function(){ _ytReady=true; _ytCbs.forEach(c=>c()); _ytCbs=[]; };
(function(){ const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
function onYtReady(cb){ _ytReady?cb():_ytCbs.push(cb); }

/* ══════════ PLAYER STATE ══════════ */
window._ytPlayer = null;
let _playerInited=false, _progressInterval=null, _hideTimer=null, _seekDragging=false, _curPart=0;

function initPlayer(videoId, containerId){
  onYtReady(()=>{
    if(window._ytPlayer && _playerInited){
      try{ window._ytPlayer.loadVideoById(videoId); return; }catch{}
    }
    window._ytPlayer = new YT.Player(containerId,{
      host:'https://www.youtube-nocookie.com',
      height:'100%', width:'100%', videoId,
      playerVars:{ autoplay:1,controls:0,rel:0,modestbranding:1,iv_load_policy:3,enablejsapi:1,fs:0,disablekb:1,playsinline:1,showinfo:0,origin:window.location.origin||'https://kalawy.vercel.app' },
      events:{ onReady:_onPlayerReady, onStateChange:_onStateChange, onError:_onPlayerError }
    });
    _playerInited=true;
  });
}
function _onPlayerReady(e){ e.target.playVideo(); _startProgressLoop(); setTimeout(_populateQualities,2500); detectAdBlock(()=>{ const w=document.getElementById('adb-overlay'); if(w) w.classList.remove('hidden'); }); }
function _onStateChange(e){
  const btn=document.getElementById('pc-play-btn');
  if(btn) btn.innerHTML = e.data===YT.PlayerState.PLAYING ? '⏸' : '▶';
  // Mark video as watched when it ends
  if(e.data===YT.PlayerState.ENDED){ markPartWatched(_curPart); }
  // Also mark as watched when 90%+ played
}
function _onPlayerError(e){ if([101,150,5].includes(e.data)){ const w=document.getElementById('adb-overlay'); if(w) w.classList.remove('hidden'); } }

function togglePlay(){
  if(!window._ytPlayer) return;
  try{
    const s=window._ytPlayer.getPlayerState();
    s===1?window._ytPlayer.pauseVideo():window._ytPlayer.playVideo();
    const f=document.getElementById('pc-flash');
    if(f){ f.textContent=s===1?'⏸':'▶'; f.classList.add('show'); setTimeout(()=>f.classList.remove('show'),500); }
  }catch{}
}
function setSpeed(v){ try{ window._ytPlayer?.setPlaybackRate(parseFloat(v)); }catch{} }
function setQuality(v){ try{ window._ytPlayer?.setPlaybackQuality(v); }catch{} }
function toggleFs(){ const w=document.getElementById('player-fs-wrap'); if(!w) return; if(!document.fullscreenElement) w.requestFullscreen?.(); else document.exitFullscreen?.(); }
function _populateQualities(){
  if(!window._ytPlayer) return;
  try{
    const levels=window._ytPlayer.getAvailableQualityLevels()||[];
    const sel=document.getElementById('pc-quality-sel'); if(!sel||!levels.length) return;
    const lbl={highres:'4K',hd2160:'4K',hd1440:'1440p',hd1080:'1080p',hd720:'720p',large:'480p',medium:'360p',small:'240p',tiny:'144p',auto:'تلقائي',default:'تلقائي'};
    sel.innerHTML=levels.map(q=>`<option value="${q}">${lbl[q]||q}</option>`).join('');
  }catch{}
}
function _startProgressLoop(){ if(_progressInterval) clearInterval(_progressInterval); _progressInterval=setInterval(_updateProgress,400); }
function _stopProgressLoop(){ if(_progressInterval){ clearInterval(_progressInterval); _progressInterval=null; } }
function _updateProgress(){
  if(!window._ytPlayer||typeof window._ytPlayer.getCurrentTime!=='function') return;
  if(_seekDragging) return;
  try{
    const cur=window._ytPlayer.getCurrentTime()||0;
    const dur=window._ytPlayer.getDuration()||0;
    const pct=dur>0?(cur/dur*100):0;
    const fill=document.getElementById('pc-fill');
    const thumb=document.getElementById('pc-thumb');
    const time=document.getElementById('pc-time');
    if(fill) fill.style.width=pct+'%';
    if(thumb) thumb.style.left=pct+'%';
    if(time) time.textContent=_fmt(cur)+' / '+_fmt(dur);
    // Auto-mark watched at 85%
    if(pct>=85) markPartWatched(_curPart);
  }catch{}
}
function _fmt(sec){ const s=Math.floor(sec),m=Math.floor(s/60),h=Math.floor(m/60); if(h>0) return `${h}:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; return `${m}:${String(s%60).padStart(2,'0')}`; }
function startSeek(e){
  _seekDragging=true; _doSeek(e);
  const mm=e2=>_doSeek(e2);
  const mu=()=>{ _seekDragging=false; document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); };
  document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
}
function _doSeek(e){
  if(!window._ytPlayer) return;
  const bar=document.getElementById('pc-progress'); if(!bar) return;
  const rect=bar.getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  try{
    const dur=window._ytPlayer.getDuration()||0;
    window._ytPlayer.seekTo(pct*dur,true);
    const fill=document.getElementById('pc-fill'),thumb=document.getElementById('pc-thumb');
    if(fill) fill.style.width=(pct*100)+'%';
    if(thumb) thumb.style.left=(pct*100)+'%';
  }catch{}
}
function _showControls(){
  const pc=document.getElementById('pc-controls'); if(pc) pc.classList.remove('hide');
  clearTimeout(_hideTimer);
  _hideTimer=setTimeout(()=>{
    try{ if(window._ytPlayer?.getPlayerState()===1){ const pc=document.getElementById('pc-controls'); if(pc) pc.classList.add('hide'); } }catch{}
  },3200);
}
function _setVol(v){ try{ window._ytPlayer?.setVolume(parseInt(v)); }catch{} }

/* ══════════ VIDEO PROGRESS TRACKING ══════════ */
function watchedKey(lessonId){ return `kw-watched-${lessonId}`; }
function getWatched(lessonId){
  try{ return JSON.parse(localStorage.getItem(watchedKey(lessonId))||'[]'); }catch{ return []; }
}
function markPartWatched(idx){
  const watched=getWatched(LESSON?.id);
  if(!watched.includes(idx)){
    watched.push(idx);
    try{ localStorage.setItem(watchedKey(LESSON?.id), JSON.stringify(watched)); }catch{}
    _refreshWatchedUI(watched);
  }
}
function _refreshWatchedUI(watched){
  const total=VIDEOS.length;
  VIDEOS.forEach((_,i)=>{
    const item=document.getElementById(`part-item-${i}`);
    if(!item) return;
    if(watched.includes(i)) item.classList.add('watched');
    else item.classList.remove('watched');
    const badge=item.querySelector('.part-watched-badge');
    const num=item.querySelector('.part-num');
    if(watched.includes(i)){
      if(!badge){ const b=document.createElement('span'); b.className='part-watched-badge'; b.textContent='✓ شاهدت'; item.querySelector('.part-meta').appendChild(b); }
      if(num) num.textContent='✓';
    } else {
      if(badge) badge.remove();
      if(num) num.textContent=i+1;
    }
  });
  const done=watched.length;
  const pct=total>0?Math.round(done/total*100):0;
  const fill=document.getElementById('sidebar-prog-fill');
  const lbl=document.getElementById('sidebar-prog-label');
  const txt=document.getElementById('sidebar-progress-text');
  if(fill) fill.style.width=pct+'%';
  if(lbl) lbl.textContent=`${done} من ${total} فيديو شاهدت`;
  if(txt) txt.textContent=`${done}/${total}`;
}

/* ══════════ SUPABASE ══════════ */
const SB_URL  = "https://xzjxmfgymbvordumrush.supabase.co";

function imgSrc(v){
  if(!v) return '';
  v=String(v).trim(); if(!v) return '';
  if(v.startsWith('http')||v.startsWith('data:')||v.startsWith('blob:')) return v;
  if(v.startsWith('/storage/v1/object/public/')) return SB_URL+v;
  v=v.replace(/^\/+/,'').replace(/^kalawy\//,'');
  return `${SB_URL}/storage/v1/object/public/kalawy/${v}`;
}
function imgSafe(v){ return imgSrc(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function imgErr(el,ic='🖼️'){ const p=el.parentElement; if(p) p.innerHTML=`<div style="height:100%;display:grid;place-items:center;font-size:1.5rem">${ic}</div>`; else el.remove(); }
function esc(v){ return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

let ME=null, ROLE='', LESSON=null, EXAM=null, VIDEOS=[], CONTENT=[], ACCESS=null;

function setTheme(th){

/* ══════════ LANGUAGE TOGGLE ══════════ */
let UI_LANG = localStorage.getItem('kw-lang') || 'ar';
const I18N = {
  ar: {
    back:'← رجوع', exam:'امتحان', video:'فيديو', homework:'واجب', pdf:'PDF', image:'صورة',
    remaining:'متبقي للحصة', lesson:'الحصة', part:'الجزء', now:'يُشغَّل الآن', watched:'شاهدت',
    videosWatched:'فيديو شاهدت', noVideo:'لا يوجد فيديو', noImages:'لا توجد صور', noPdfs:'لا يوجد PDF'
  },
  en: {
    back:'← Back', exam:'Exam', video:'Video', homework:'Homework', pdf:'PDF', image:'Image',
    remaining:'remaining', lesson:'Lesson', part:'Part', now:'Playing now', watched:'Watched',
    videosWatched:'videos watched', noVideo:'No video', noImages:'No images', noPdfs:'No PDF'
  }
};
function tr(k){ return (I18N[UI_LANG] && I18N[UI_LANG][k]) || I18N.ar[k] || k; }
function setLang(lang){
  UI_LANG = lang === 'en' ? 'en' : 'ar';
  localStorage.setItem('kw-lang', UI_LANG);
  document.getElementById('lang-ar')?.classList.toggle('on', UI_LANG === 'ar');

function goHome(){ window.location.href='/dashboard/'; }
function toast(type,msg,dur=3500){
  const icons={s:'✅',e:'❌',w:'⚠️',i:'ℹ️'};
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className=`toast t${type}`;
  el.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(()=>{ el.classList.add('tx'); setTimeout(()=>el.remove(),220); },dur);
}
function ytId(url){ const m=(url||'').match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/); return m?m[1]:null; }
function passScore(){ return Math.max(0,Math.min(100,Number(EXAM?.pass_score??50))); }
function normalizeOptions(q){
  let opts=q?.options;
  if(typeof opts==='string'){ try{opts=JSON.parse(opts);}catch{opts=null;} }
  if(!Array.isArray(opts)||!opts.length){
    opts=['a','b','c','d','e','f','g','h'].filter(k=>q&&q[`option_${k}`]).map(k=>({text:q[`option_${k}`],is_correct:String(q.correct_option||'').toLowerCase()===k}));
  }
  opts=opts.map(o=>{
    if(typeof o==='string') return {text:o,is_correct:false};
    return {text:o?.text??o?.label??o?.value??'',is_correct:!!o?.is_correct};
  }).filter(o=>String(o.text).trim()!=='');
  if(opts.length&&!opts.some(o=>o.is_correct)){
    const c=String(q?.correct_option||'').toLowerCase();
    const letters='abcdefghij'; let idx=letters.indexOf(c);
    if(idx<0&&!Number.isNaN(Number(c))) idx=Number(c);
    if(idx>=0&&opts[idx]) opts[idx].is_correct=true;
  }
  return opts;
}
function normalizeQuestions(qs){ return (qs||[]).map(q=>({...q,options:normalizeOptions(q)})); }

/* ══════════ ACCESS / TIMER ══════════ */
function accessHours(){ return Math.max(1,Number(LESSON?.access_hours??24)); }
function accessExpiry(){ if(!ACCESS?.used_at) return null; return new Date(new Date(ACCESS.used_at).getTime()+accessHours()*3600*1000); }
function msLeft(){ const exp=accessExpiry(); return exp?exp.getTime()-Date.now():null; }
function fmtCountdown(ms){
  if(ms==null) return null;
  if(ms<=0) return { str:'انتهى الوقت', warn:true };
  const totalSec=Math.floor(ms/1000);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  const str = h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const warn = ms < 600000; // warn if < 10 min
  return { str, warn };
}

function startAccessTimer(){
  if(ROLE==='admin'||ROLE==='teacher'||!ACCESS?.used_at) return;
  const chip=document.getElementById('timer-chip');
  const bar=document.getElementById('timer-banner');
  const fill=document.getElementById('timer-fill');
  if(!chip) return;
  chip.classList.remove('hidden'); bar.classList.remove('hidden');
  const totalMs=accessHours()*3600*1000;
  function update(){
    const left=msLeft();
    const result=fmtCountdown(left);
    if(!result) return;
    chip.innerHTML=`⏳ ${result.str} متبقي للحصة`;
    chip.classList.toggle('warn',result.warn);
    chip.classList.toggle('ok',!result.warn);
    const pct=left!=null?Math.max(0,Math.min(100,(left/totalMs)*100)):100;
    if(fill) fill.style.width=pct+'%';
    if(left!==null&&left<=0){
      clearInterval(_accessInterval);
      chip.innerHTML='🔒 انتهت الحصة';
      try{ window._ytPlayer?.pauseVideo?.(); }catch{}
      showError('انتهى وقت الحصة. ادخل كود جديد من Checkout.');
    }
  }
  update();
  _accessInterval=setInterval(update,1000);
}

async function init(){

  if(!session){ window.location.href='/login/'; return; }
  const{data:profile}=await sb.from('profiles').select('role,phone').eq('id',session.user.id).single();
  ROLE=profile?.role||'student';
  ME={id:session.user.id,phone:profile?.phone||''};
  if(ROLE!=='admin'&&ROLE!=='teacher'){
    const{data:access}=await sb.from('lesson_codes').select('id,used_at,expires_at').eq('lesson_id',lessonId).eq('used_by',session.user.id).maybeSingle();
    if(!access){ showError('لازم تضيف الحصة للسلة وتدخل كود الحصة الأول'); return; }
    ACCESS=access;
  }
  await loadLesson(lessonId);
}

async function loadLesson(lessonId){
  const[{data:lesson},{data:videos},{data:exams},{data:content}]=await Promise.all([
    sb.from('lessons').select('id,title,description,is_active,scheduled_at,access_hours,chapter_id,image_url,chapters(title,image_url,subjects(name_ar))').eq('id',lessonId).single(),
    sb.from('lesson_videos').select('*').eq('lesson_id',lessonId).order('sort_order'),
    sb.from('exams').select('id,title,duration_minutes,scheduled_at,pass_score').eq('lesson_id',lessonId).limit(1),
    sb.from('lesson_content').select('*').eq('lesson_id',lessonId).order('sort_order'),
  ]);
  if(!lesson){ showError('الحصة غير موجودة'); return; }
  LESSON=lesson; VIDEOS=videos||[]; CONTENT=content||[]; EXAM=exams?.[0]||null;
  const now=new Date();
  if(lesson.scheduled_at&&new Date(lesson.scheduled_at)>now){
    const t=new Date(lesson.scheduled_at).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
    showError(`الحصة هتفتح في ${t}`); return;
  }
  if(ROLE!=='admin'&&ROLE!=='teacher'){
    if(!lesson.is_active){ showError('الحصة مغلقة حالياً'); return; }
    const exp=accessExpiry();
    if(exp&&exp.getTime()<=Date.now()){ showError('انتهى وقت فتح الحصة. ادخل كود جديد.'); return; }
  }
  renderPage();
  startAccessTimer();

function switchTab(id){

function startExamTimer(totalSec){
  let sec=totalSec;
  function update(){
    const m=Math.floor(sec/60), s=sec%60;
    const display=document.getElementById('exam-timer-display');
    if(display){
      display.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      display.style.color=sec<=60?'var(--danger)':'var(--p3)';
    }
    if(sec<=0){ clearInterval(_timerInterval); submitExam(true); return; }
    sec--;
  }
  update();
  _timerInterval=setInterval(update,1000);
}

function pickOpt(qId,idx){
  if(_submitted) return;
  document.querySelectorAll(`[id^="opt-${qId}-"]`).forEach(el=>el.classList.remove('sel'));
  document.getElementById(`opt-${qId}-${idx}`)?.classList.add('sel');
  _answers[qId]=idx;
  const total=_examQuestions.length;
  const done=Object.keys(_answers).length;
  document.getElementById('ans-count').textContent=done;
  const pf=document.getElementById('prog-fill');
  if(pf) pf.style.width=Math.round(done/total*100)+'%';
  document.getElementById(`qc-${qId}`)?.classList.add('answered');
}

async function submitExam(autoSubmit=false){
  const qs=_examQuestions;
  if(!qs.length) return toast('e','الأسئلة لم تتحمل، اعمل refresh');
  if(_submitted) return;
  if(!autoSubmit&&Object.keys(_answers).length<qs.length) return toast('w','جاوب على كل الأسئلة قبل التسليم');
  _submitted=true;
  if(_timerInterval) clearInterval(_timerInterval);
  const btn=document.getElementById('submit-btn');
  if(btn){ btn.innerHTML='<span class="ld" style="width:16px;height:16px;border-width:2px"></span> جاري التصحيح...'; btn.disabled=true; }
  let correct=0;
  const answersLog=[];
  qs.forEach(q=>{
    const opts=q.options||[];
    const selIdx=_answers[q.id];
    if(opts[selIdx]?.is_correct) correct++;
    answersLog.push({qId:q.id,idx:selIdx});
  });
  const score=Math.round(correct/qs.length*100);
  const passed=score>=passScore();
  const{data:oldSub}=await sb.from('exam_submissions').select('id,attempt_count').eq('exam_id',EXAM.id).eq('student_id',ME.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();
  const nextAttempt=(oldSub?.attempt_count||0)+1;
  const payload={exam_id:EXAM.id,student_id:ME.id,score,passed,attempt_count:nextAttempt,updated_at:new Date().toISOString(),answers:answersLog};
  let save;
  if(oldSub?.id) save=await sb.from('exam_submissions').update(payload).eq('id',oldSub.id).select().single();
  else save=await sb.from('exam_submissions').insert(payload).select().single();
  if(save?.error){ _submitted=false; if(btn){btn.disabled=false;btn.innerHTML='📤 تسليم الامتحان';} return toast('e','مش راضي يسلم: '+save.error.message); }
  setTimeout(()=>renderResult(score,false,passed,nextAttempt,qs,answersLog),400);
}

function renderResult(score, alreadyDone, passed, attempts, examQs, answersLog){
  const tc=document.getElementById('tab-content');
  const pass=passed!==null?!!passed:score>=passScore();
  // Build answers map
  const ansMap={};
  (answersLog||[]).forEach(a=>{ ansMap[a.qId]=a.idx; });

  let questionsHtml='';
  if(examQs&&examQs.length){
    questionsHtml=`
    <div style="margin-top:24px">
      <div style="font-weight:900;font-size:1rem;margin-bottom:16px;color:var(--t2)">📋 مراجعة الإجابات</div>
      ${examQs.map((q,i)=>{
        const opts=q.options||[];
        const selIdx=ansMap[q.id];
        const isCorrect=opts[selIdx]?.is_correct;
        return `<div class="q-card" style="margin-bottom:14px">
          <div class="q-num-lbl"><div class="q-num-dot" style="background:${selIdx!==undefined?(isCorrect?'#34d399':'#f87171'):'var(--t3)'}"></div>سؤال ${i+1}</div>
          ${q.image_url?`<img class="q-img" src="${imgSafe(q.image_url)}" alt="" onerror="imgErr(this,'🖼️')" loading="lazy">`:''}
          <div class="q-txt">${esc(q.question_text)}</div>
          <div class="opts">
            ${opts.map((o,oi)=>{
              const isSelThis=oi===selIdx;
              const isCorrectOpt=o.is_correct;
              let cls='opt';
              let icon='';
              if(isCorrectOpt){ cls+=' correct'; icon='<span class="opt-result-icon">✅</span>'; }
              else if(isSelThis&&!isCorrectOpt){ cls+=' wrong'; icon='<span class="opt-result-icon">❌</span>'; }
              else { cls+=' neutral'; }
              return `<div class="${cls}">
                <div class="opt-c">${String.fromCharCode(65+oi)}</div>
                <div class="opt-t">${esc(o.text)}</div>
                ${icon}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

  tc.innerHTML=`
  <div class="exam-page">
    <div class="score-summary glass">
      <div class="score-big ${pass?'pass':'fail'}">${score}%</div>
      <div class="score-info">

      </div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
        ${pass&&VIDEOS.length?`<button class="btn btn-p" onclick="switchTab('video')">▶️ شاهد الفيديو</button>`:''}
        ${!pass?`<button class="btn btn-p" onclick="renderExam(false)">🔄 امتحن تاني</button>`:''}
        <button class="btn btn-gl" onclick="goHome()">← رجوع</button>
      </div>
    </div>
    ${questionsHtml}
  </div>`;
}

function copyLessonLink(){
  const link = location.href;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(link).then(()=>toast('s', UI_LANG==='en'?'Link copied':'تم نسخ الرابط')).catch(()=>toast('w', UI_LANG==='en'?'Copy failed':'لم يتم النسخ'));
  } else {
    const inp=document.createElement('input');
    inp.value=link; document.body.appendChild(inp); inp.select();
    try{ document.execCommand('copy'); toast('s', UI_LANG==='en'?'Link copied':'تم نسخ الرابط'); }catch{ toast('w', UI_LANG==='en'?'Copy failed':'لم يتم النسخ'); }
    inp.remove();
  }
}

function startWmMove(){
  if(_wmMoveTimer) clearInterval(_wmMoveTimer);
  const wm=document.getElementById('kw-wm'); if(!wm) return;
  function mv(){ const x=5+Math.random()*70,y=8+Math.random()*68,r=-15+Math.random()*30; wm.style.left=x+'%'; wm.style.top=y+'%'; wm.style.transform=`rotate(${r}deg)`; }
  mv(); _wmMoveTimer=setInterval(mv,2500);
}
function _onGuardClick(){ togglePlay(); _showControls(); }
function changePart(idx){
  _curPart=idx;
  _stopProgressLoop();
  window._ytPlayer=null; _playerInited=false;
  buildVideoPlayer();
}

/* ══════════ HOMEWORK ══════════ */
function renderHomework(){
  const tc=document.getElementById('tab-content');
  const items=getHomeworkItems();
  if(!items.length){
    tc.innerHTML='<div class="empty-pg"><span style="font-size:2.8rem">📌</span><div class="ei-title">لا يوجد واجب</div><div style="font-size:.85rem">المدرس لسه ما أضافش واجب</div></div>';
    return;
  }
  tc.innerHTML=`<div class="grid-cards">${items.map((ct,i)=>`
    <div class="card-item">
      <span class="card-ico">📌</span>
      <div class="card-title">${ct.title||('واجب '+(i+1))}</div>
      ${ct.url?`<a href="${imgSafe(ct.url)}" target="_blank" class="btn btn-p" style="margin-top:10px;font-size:.82rem;padding:8px 14px">فتح المرفق ←</a>`:''}
      ${ct.body?`<div class="card-body">${String(ct.body).replace(/\n/g,'<br>')}</div>`:''}
      ${!ct.url&&!ct.body?`<div class="card-sub">لا توجد تفاصيل</div>`:''}
    </div>`).join('')}
  </div>`;
}



/* ══════════ IMAGES ══════════ */
function renderImages(){
  const tc=document.getElementById('tab-content');
  const items=getImageItems();
  if(!items.length){
    tc.innerHTML=`<div class="empty-pg"><span style="font-size:2.8rem">🖼️</span><div class="ei-title">${tr('noImages')}</div></div>`;
    return;
  }
  tc.innerHTML=`<div class="img-section">${items.map((ct,i)=>`
    <div>
      <div class="img-label">${esc(ct.title||(`${tr('image')} ${i+1}`))}</div>
      <div class="img-wrap"><img class="content-img" src="${imgSafe(ct.url||ct.image_url)}" alt="" onerror="imgErr(this,'🖼️')" loading="lazy"></div>
      ${ct.body?`<div class="card-body">${String(ct.body).replace(/\n/g,'<br>')}</div>`:''}
    </div>`).join('')}</div>`;
}
/* ══════════ PDF ══════════ */
function renderPDF(){
  const tc=document.getElementById('tab-content');
  const pdfs=getPdfItems(), imgs=getImageItems();
  if(!pdfs.length&&!imgs.length){
    tc.innerHTML='<div class="empty-pg"><span style="font-size:2.8rem">📄</span><div class="ei-title">لا يوجد PDF أو صور</div><div style="font-size:.85rem">أي ملف يضيفه المدرس هيظهر هنا</div></div>';
    return;
  }
  tc.innerHTML=`
  ${pdfs.length?`<div class="grid-cards">${pdfs.map((ct,i)=>`
    <a class="card-item" href="${imgSafe(ct.url)||'#'}" target="_blank">
      <span class="card-ico">📄</span>
      <div class="card-title">${ct.title||('PDF '+(i+1))}</div>
      <div class="card-sub">اضغط لفتح أو تحميل الملف</div>
    </a>`).join('')}</div>`:''}
  ${imgs.length?`<div class="img-section">${imgs.map((ct,i)=>`
    <div>
      <div class="img-label">🖼️ ${ct.title||('صورة '+(i+1))}</div>
      <div class="img-wrap"><img class="content-img" src="${imgSafe(ct.url)}" alt="${ct.title||''}" onerror="imgErr(this,'🖼️')" loading="lazy"></div>
    </div>`).join('')}</div>`:''}`;
}

/* ══════════ ERROR ══════════ */
function showError(msg){
  document.getElementById('page-root').innerHTML=`
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px">
    <div class="glass" style="border-radius:var(--r-xl);padding:40px;text-align:center;max-width:420px;width:100%">
      <span style="font-size:3.5rem;display:block;margin-bottom:16px">🔒</span>
      <div style="font-size:1.1rem;font-weight:900;margin-bottom:10px">${msg}</div>
      <button class="btn btn-p btn-lg" style="margin-top:18px" onclick="goHome()">← العودة للرئيسية</button>
    </div>
  </div>`;
}

/* ══════════ BOOTSTRAP ══════════ */
const th=localStorage.getItem('kw-theme')||'dark'; setTheme(th); initLangButtons();
init();
