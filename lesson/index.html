<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>kalawy — الحصة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<style>
/* ══════ VARS ══════ */
:root{
  --p1:#8b5cf6;--p2:#6d28d9;--p3:#a78bfa;--p4:#c4b5fd;
  --glow:rgba(139,92,246,.3);--danger:#f87171;--ok:#34d399;
  --r:12px;--rl:18px;--rxl:24px;
}
[data-theme="dark"]{
  --bg:#09060f;--bg2:#0e0a1a;--bg3:#130c22;
  --sf:rgba(255,255,255,.045);--sfh:rgba(255,255,255,.08);
  --bd:rgba(139,92,246,.16);--bdh:rgba(139,92,246,.36);
  --sh:0 6px 28px rgba(0,0,0,.55);
  --txt:#f0ebff;--t2:#9d8ec7;--t3:#4e3e72;
  --shine:rgba(139,92,246,.05);
}
[data-theme="light"]{
  --bg:#f2eeff;--bg2:#e9deff;--bg3:#ded2ff;
  --sf:rgba(139,92,246,.06);--sfh:rgba(139,92,246,.12);
  --bd:rgba(139,92,246,.2);--bdh:rgba(139,92,246,.42);
  --sh:0 6px 28px rgba(109,40,217,.13);
  --txt:#160936;--t2:#4a2896;--t3:#8b68d0;
  --shine:rgba(255,255,255,.55);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
.hidden{display:none!important}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--p2);border-radius:99px}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 45% at 10% 0%,rgba(139,92,246,.13),transparent 60%),
             radial-gradient(ellipse 45% 40% at 92% 85%,rgba(109,40,217,.1),transparent 60%)}

/* ══════ PLYR PURPLE ══════ */
.plyr{
  --plyr-color-main:#8b5cf6;
  --plyr-range-fill-background:#8b5cf6;
  --plyr-video-controls-background:linear-gradient(transparent,rgba(9,6,15,.88));
  --plyr-font-family:'Tajawal',sans-serif;
  --plyr-font-size-base:13px;
  --plyr-control-radius:7px;
  border-radius:0!important;
}
.plyr--video .plyr__controls{padding:6px 10px 10px}
.plyr__control--overlaid{background:rgba(139,92,246,.9)!important;box-shadow:0 4px 20px var(--glow)!important}
.plyr__control--overlaid:hover{background:#6d28d9!important}
.plyr--video{height:100%!important}
#plyr-wrap .plyr{height:100%!important}

/* ══════ NAV ══════ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:700;height:56px;
  background:linear-gradient(135deg,rgba(9,6,15,.97),rgba(18,8,34,.97));
  backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 20px;gap:12px;
}
[data-theme="light"] .nav{background:linear-gradient(135deg,rgba(242,238,255,.96),rgba(233,222,255,.96))}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--p1),var(--p2));
  display:grid;place-items:center;font-weight:900;font-size:.85rem;color:#fff;
  box-shadow:0 3px 14px var(--glow);cursor:pointer;flex-shrink:0;transition:.2s}
.logo:hover{transform:scale(1.07)}
.brand{font-weight:900;font-size:1.08rem;letter-spacing:-.02em;cursor:pointer}
.brand em{font-style:normal;color:var(--p3)}
.sp{flex:1}
.tpill{display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:3px;gap:2px}
.topt{padding:4px 10px;border-radius:99px;border:none;background:transparent;color:var(--t3);font-size:.73rem;font-weight:700;cursor:pointer;transition:.15s}
.topt.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.back{display:flex;align-items:center;gap:6px;padding:6px 15px;border-radius:99px;
  border:1px solid var(--bd);background:var(--sf);color:var(--t2);
  font-weight:700;font-size:.82rem;cursor:pointer;transition:.15s;font-family:'Tajawal',sans-serif}
.back:hover{border-color:var(--p1);color:var(--txt)}

/* ══════ TABS — sticky below nav ══════ */
.tabs{
  position:fixed;top:56px;left:0;right:0;z-index:600;
  height:48px;background:var(--bg2);
  border-bottom:1px solid var(--bd);
  display:flex;align-items:stretch;padding:0 20px;gap:0;
  backdrop-filter:blur(20px);
}
.tab{
  display:flex;align-items:center;gap:7px;padding:0 18px;
  border:none;background:transparent;color:var(--t3);font-weight:700;font-size:.87rem;
  cursor:pointer;transition:.16s;border-bottom:3px solid transparent;
  white-space:nowrap;font-family:'Tajawal',sans-serif;margin-bottom:-1px;
}
.tab:hover{color:var(--p3);background:rgba(139,92,246,.05)}
.tab.on{color:var(--p1);border-bottom-color:var(--p1)}
.tbg{background:var(--p2);color:#fff;font-size:.6rem;font-weight:900;
  padding:2px 7px;border-radius:99px;min-width:18px;text-align:center;line-height:1.7}
.tab:not(.on) .tbg{background:var(--sf);color:var(--t3)}

/* ══════ PAGE WRAPPER ══════ */
#page{position:relative;z-index:1;padding-top:104px;min-height:100vh;display:flex;flex-direction:column}

/* ══════ BANNER ══════ */
.banner{
  background:linear-gradient(135deg,#3b0764,#1e0952,#0d0326);
  border-bottom:1px solid rgba(139,92,246,.25);
  padding:20px 26px;position:relative;overflow:hidden;flex-shrink:0;
}
.banner::after{content:'';position:absolute;top:-60px;right:-50px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(167,139,250,.2),transparent 70%);pointer-events:none}
.b-in{display:flex;align-items:center;gap:16px;position:relative;z-index:2;max-width:1500px;margin:0 auto}
.b-cover{width:80px;height:54px;border-radius:11px;overflow:hidden;background:rgba(139,92,246,.2);
  border:1px solid rgba(139,92,246,.3);display:grid;place-items:center;font-size:1.5rem;flex-shrink:0}
.b-cover img{width:100%;height:100%;object-fit:cover}
.b-chapter{font-size:.68rem;color:rgba(196,181,253,.55);margin-bottom:3px;letter-spacing:.07em;text-transform:uppercase}
.b-title{font-size:clamp(.95rem,2.2vw,1.45rem);font-weight:900;color:#fff;letter-spacing:-.02em;margin-bottom:7px}
.b-chips{display:flex;gap:6px;flex-wrap:wrap}
.bch{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;
  font-size:.69rem;font-weight:700;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.11);color:rgba(196,181,253,.82)}

/* ══════ CONTENT ══════ */
#cnt{flex:1;display:flex;flex-direction:column}

/* ══════ VIDEO TAB ══════ */
.vid-layout{
  display:grid;
  grid-template-columns:1fr 272px;
  height:calc(100vh - 104px - 56px);/* full remaining height */
  overflow:hidden;
}

/* Player column */
.vid-col{display:flex;flex-direction:column;min-width:0;background:#050208}
#plyr-wrap{position:relative;flex:1;overflow:hidden}
#plyr-wrap .plyr,
#plyr-wrap .plyr__video-wrapper,
#plyr-wrap iframe{height:100%!important;width:100%!important}
.plyr--full-ui.plyr--video{height:100%}

/* Watermark */
.wm{position:absolute;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;
  animation:wf 2.8s ease-in-out infinite}
@keyframes wf{0%,100%{opacity:.48;transform:rotate(var(--r,-9deg))}50%{opacity:.86;transform:rotate(var(--r,-9deg)) translateY(-5px)}}
.wm-av{width:clamp(30px,3.2vw,46px);height:clamp(30px,3.2vw,46px);border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#a78bfa);
  box-shadow:0 3px 12px rgba(139,92,246,.5),0 0 0 2px rgba(196,181,253,.32);
  display:flex;align-items:center;justify-content:center}
.wm-av svg{width:65%;height:65%}
.wm-id{font-family:'Inter',monospace;font-size:clamp(8px,.95vw,13px);font-weight:900;
  color:#ff3333;text-shadow:0 1px 6px rgba(0,0,0,.95),0 0 10px rgba(255,30,30,.4);
  background:rgba(0,0,0,.62);padding:2px 7px;border-radius:99px;
  border:1px solid rgba(255,40,40,.3);white-space:nowrap;letter-spacing:.04em}

.vid-bar{padding:11px 16px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:12px;
  background:rgba(8,4,18,.75);backdrop-filter:blur(10px);flex-shrink:0}
.vb-title{font-weight:800;font-size:.9rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb-nav{display:flex;gap:7px}

/* AdBlock warning */
.adb-warn{position:absolute;inset:0;z-index:200;background:rgba(9,6,15,.96);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.adb-ico{font-size:2.5rem}
.adb-t{font-weight:900;color:var(--danger)}
.adb-s{font-size:.82rem;color:var(--t2);max-width:280px;line-height:1.75}

/* Parts sidebar */
.parts-col{border-right:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
.ph{padding:13px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-shrink:0}
.ph-lbl{font-weight:800;font-size:.83rem;color:var(--t2);flex:1}
.ph-cnt{font-size:.71rem;font-weight:900;color:var(--p3)}
.pl{overflow-y:auto;flex:1}
.pr{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer;border-bottom:1px solid var(--bd);transition:.15s}
.pr:last-child{border-bottom:none}
.pr:hover{background:var(--sfh)}
.pr.active{background:rgba(139,92,246,.09);border-right:3px solid var(--p1)}
.pr.done .pn{background:linear-gradient(135deg,#059669,#10b981)!important;border-color:transparent!important;color:#fff!important}
.pn{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--sf);
  border:1px solid var(--bd);display:grid;place-items:center;
  font-size:.74rem;font-weight:700;color:var(--t2);transition:.18s}
.pr.active:not(.done) .pn{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent;color:#fff;box-shadow:0 3px 10px var(--glow)}
.pi{flex:1;min-width:0}
.pt{font-size:.84rem;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:.65rem;margin-top:2px;color:var(--t3)}
.ps-play{color:var(--p3);font-weight:800}
.ps-done{color:var(--ok);font-weight:800}
.pf{padding:10px 15px;border-top:1px solid var(--bd);flex-shrink:0;background:var(--bg3)}
.pfb{height:5px;background:var(--sf);border-radius:99px;overflow:hidden;margin-bottom:6px}
.pff{height:100%;background:linear-gradient(90deg,var(--p1),var(--p3));border-radius:99px;transition:width .4s}
.pfl{font-size:.7rem;color:var(--t3);text-align:center;font-weight:700}

/* ══════ EXAM ══════ */
.ew{max-width:800px;margin:0 auto;padding:26px 18px 90px;width:100%}
.ic{border-radius:var(--rxl);padding:34px;text-align:center;background:var(--sf);border:1px solid var(--bd)}
.ic-i{font-size:3rem;margin-bottom:11px;display:block}
.ic-t{font-size:1.3rem;font-weight:900;margin-bottom:7px}
.ic-s{font-size:.86rem;color:var(--t2);line-height:1.75;margin-bottom:18px;max-width:380px;margin-inline:auto}
.ic-m{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:20px}
.ic-mt{display:flex;align-items:center;gap:6px;padding:7px 15px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--sf);border:1px solid var(--bd)}
/* Exam inline timer */
.etrow{display:flex;align-items:center;gap:11px;margin-bottom:18px;padding:11px 16px;border-radius:var(--r);background:var(--sf);border:1px solid var(--bd)}
.etbar{flex:1;height:5px;background:var(--bg3);border-radius:99px;overflow:hidden}
.etf{height:100%;background:linear-gradient(90deg,var(--p2),var(--p1),var(--p3));border-radius:99px;transition:width 1s linear}
.etv{font-family:'Inter',monospace;font-weight:900;font-size:.95rem;color:var(--p3);white-space:nowrap}
.etv.warn{color:var(--danger)}
/* Q cards */
.qc{border-radius:var(--rl);padding:19px 21px;margin-bottom:13px;background:var(--sf);border:1px solid var(--bd)}
.qc.ok{border-color:rgba(139,92,246,.32)}
.qn{font-size:.66rem;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.qdot{width:5px;height:5px;border-radius:50%;background:var(--p1);flex-shrink:0}
.qt{font-weight:700;font-size:.95rem;margin-bottom:13px;line-height:1.72;user-select:text}
.qi{width:100%;max-height:190px;object-fit:contain;border-radius:9px;margin-bottom:11px;display:block;border:1px solid var(--bd)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:var(--r);
  border:1px solid var(--bd);background:var(--bg2);cursor:pointer;transition:.16s}
.opt:hover{border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.06)}
.opt.sel{border-color:var(--p1);background:rgba(139,92,246,.12)}
.opt.cor{border-color:#34d399!important;background:rgba(52,211,153,.1)!important;pointer-events:none}
.opt.wrg{border-color:#f87171!important;background:rgba(248,113,113,.1)!important;pointer-events:none}
.opt.ntl{pointer-events:none;opacity:.52}
.ol{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;
  font-size:.67rem;font-weight:700;flex-shrink:0;color:var(--t3);transition:.14s}
.opt.sel .ol{background:var(--p1);border-color:var(--p1);color:#fff}
.opt.cor .ol{background:#34d399;border-color:#34d399;color:#fff}
.opt.wrg .ol{background:#f87171;border-color:#f87171;color:#fff}
.ot{font-size:.86rem;font-weight:600;flex:1;user-select:text}
.oi{font-size:.82rem;margin-right:auto;flex-shrink:0}
/* Exam footer */
.ef{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--bd);
  padding:11px 18px;display:flex;align-items:center;gap:13px;backdrop-filter:blur(14px);z-index:100;flex-wrap:wrap}
.ep{display:flex;align-items:center;gap:8px;font-size:.81rem;color:var(--t2)}
.epb{width:110px;height:4px;background:var(--sf);border-radius:99px;overflow:hidden}
.epf{height:100%;background:linear-gradient(90deg,var(--p1),var(--p3));border-radius:99px;transition:width .25s}
/* Score */
.sw{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:var(--rl);background:var(--sf);border:1px solid var(--bd);margin-bottom:18px;flex-wrap:wrap}
.sb{font-size:2.6rem;font-weight:900;letter-spacing:-.05em;line-height:1}
.sb.p{color:#34d399}.sb.f{color:#f87171}
.si{flex:1}.sl{font-size:.97rem;font-weight:900}.ss{font-size:.79rem;color:var(--t2);margin-top:4px;line-height:1.7}
.sa{display:flex;flex-direction:column;gap:7px;align-items:flex-end}

/* ══════ PDF / HW ══════ */
.gc{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;padding:22px}
.mc{padding:18px;border-radius:var(--rl);background:var(--sf);border:1px solid var(--bd);
  transition:.18s;text-decoration:none;color:var(--txt);display:block}
.mc:hover{transform:translateY(-3px);border-color:var(--p1);box-shadow:0 8px 24px var(--glow)}
.mi{font-size:1.85rem;margin-bottom:8px;display:block}
.mt{font-size:.92rem;font-weight:900;margin-bottom:5px}
.ms{font-size:.76rem;color:var(--t2);line-height:1.7;user-select:text}
.mb{margin-top:8px;color:var(--t2);font-size:.84rem;line-height:1.9;user-select:text}

/* ══════ RESULT PAGE ══════ */
.rp{display:flex;align-items:center;justify-content:center;min-height:52vh;padding:28px 18px}
.rc{border-radius:var(--rxl);padding:36px 28px;text-align:center;background:var(--sf);border:1px solid var(--bd);max-width:420px;width:100%}
.ri{font-size:3.5rem;display:block;margin-bottom:12px}
.rs{font-size:3.8rem;font-weight:900;letter-spacing:-.05em;line-height:1;margin:6px 0}
.rs.p{color:#34d399}.rs.f{color:#f87171}
.rl{font-size:1.05rem;font-weight:900;margin-bottom:5px}
.rd{font-size:.83rem;color:var(--t2);margin-bottom:20px;line-height:1.7}
.ra{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* ══════ ACCESS TIMER ══════ */
.acs-bar{position:fixed;top:56px;left:0;right:0;z-index:590;height:3px;background:var(--bg3)}
.acs-fill{height:100%;background:linear-gradient(90deg,var(--p2),var(--p1),var(--p3));transition:width 1s linear}
.acs-chip{position:fixed;top:65px;left:50%;transform:translateX(-50%);z-index:590;
  background:var(--bg2);border:1px solid var(--bdh);border-radius:99px;
  padding:3px 15px;font-size:.74rem;font-weight:900;font-family:'Inter',monospace;
  box-shadow:var(--sh);backdrop-filter:blur(14px);white-space:nowrap;
  display:flex;align-items:center;gap:6px}
.acs-chip.warn{color:var(--danger);border-color:rgba(248,113,113,.45)}
.acs-chip.ok{color:var(--p3);border-color:rgba(139,92,246,.38)}

/* ══════ UTILS ══════ */
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46vh;gap:13px;color:var(--t3)}
.spin{width:32px;height:32px;border:3px solid rgba(139,92,246,.14);border-top-color:var(--p1);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44vh;gap:10px;color:var(--t3);text-align:center;padding:28px}
.emp .et{font-weight:900;font-size:.97rem;color:var(--txt)}.emp .es{font-size:.82rem}
.btn{border:none;border-radius:var(--r);padding:9px 18px;font-weight:700;cursor:pointer;
  font-size:.87rem;transition:.17s;display:inline-flex;align-items:center;gap:6px;font-family:'Tajawal',sans-serif}
.btn-p{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 4px 15px var(--glow)}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}.btn-p:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn-g{background:var(--sf);color:var(--t2);border:1px solid var(--bd)}.btn-g:hover{color:var(--txt);border-color:var(--p1)}
.btn-l{padding:12px 28px;font-size:.94rem;border-radius:var(--rl)}
.glass{background:var(--sf);backdrop-filter:blur(18px);border:1px solid var(--bd);position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--shine),transparent 55%);pointer-events:none;border-radius:inherit}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{display:flex;gap:8px;align-items:center;background:var(--bg2);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:12px;padding:9px 16px;box-shadow:var(--sh);animation:tin .2s;pointer-events:all;white-space:nowrap;font-weight:700;font-size:.85rem}
.ts{border-color:rgba(52,211,153,.4)}.te{border-color:rgba(248,113,113,.4)}.tw{border-color:rgba(251,191,36,.4)}
@keyframes tin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(7px)}}
.tx{animation:tout .18s forwards}

/* ══════ FOOTER ══════ */
footer{background:linear-gradient(135deg,#1a0b3d,#110724,#09060f);border-top:1px solid rgba(139,92,246,.22);
  padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;flex-shrink:0}
.fb{font-weight:900;font-size:.97rem;color:rgba(196,181,253,.58)}.fb em{font-style:normal;color:var(--p3)}
.fc{font-size:.72rem;color:rgba(139,92,246,.42);letter-spacing:.05em}

/* DevTools */

<script>
/* ═══ SECURITY ═══ */
(function(){
  let lk=false;
  window.lock=function(r){
    if(lk)return;lk=true;
    try{if(window._pl)window._pl.pause();}catch{}
    const o=document.getElementById('dto');
    if(o){o.style.display='flex';}
    document.getElementById('page').innerHTML='';
  };
  document.addEventListener('contextmenu',e=>{e.preventDefault();return false;},true);
  document.addEventListener('keydown',e=>{
    const k=e.key.toUpperCase();
    const b=e.key==='F12'||(e.ctrlKey&&e.shiftKey&&'IJCK'.includes(k))||(e.ctrlKey&&'US'.includes(k))||(e.metaKey&&e.altKey&&'IJ'.includes(k));
    if(b){e.preventDefault();e.stopPropagation();lock('key');return false;}
  },true);
  let t=0;setInterval(()=>{
    if(lk)return;
    const o=Math.abs(window.outerWidth-window.innerWidth)>160||Math.abs(window.outerHeight-window.innerHeight)>160;
    t=o?t+1:0;if(t>=2)lock('panel');
  },500);
  document.addEventListener('selectstart',e=>{if(!e.target.closest('.qt,.ot,.ms,.mb,.ss'))e.preventDefault();});
  document.addEventListener('dragstart',e=>e.preventDefault());
  (function d(){try{const s=performance.now();debugger;if(performance.now()-s>120)lock('dbg');}catch{}setTimeout(d,2600);})();
})();

function detectAdBlock(cb){
  const b=document.createElement('div');b.id='pub_300x250';b.className='ad-banner adsbox';
  b.style.cssText='position:absolute;width:1px;height:1px;top:-9999px';document.body.appendChild(b);
  setTimeout(()=>{const bl=!b.offsetParent||b.offsetHeight===0;b.remove();if(bl)cb();},350);
}

/* ═══ SUPABASE ═══ */
const SB_URL="https://xzjxmfgymbvordumrush.supabase.co";
const SB_ANON="sb_publishable_yDrrS95uLq4ch8pu0OwZ0w_6UiBx22e";
const sb=window.supabase.createClient(SB_URL,SB_ANON);

function iSrc(v){
  if(!v)return'';v=String(v).trim();if(!v)return'';
  if(v.startsWith('http')||v.startsWith('data:')||v.startsWith('blob:'))return v;
  if(v.startsWith('/storage/'))return SB_URL+v;
  return`${SB_URL}/storage/v1/object/public/kalawy/${v.replace(/^\/+/,'').replace(/^kalawy\//,'')}`;
}
function iS(v){return iSrc(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function iE(el,ic='🖼️'){const p=el.parentElement;if(p)p.innerHTML=`<div style="display:grid;place-items:center;height:100%;font-size:1.5rem">${ic}</div>`;else el.remove();}

/* ═══ STATE ═══ */
let ME=null,ROLE='',LESSON=null,EXAM=null,VIDEOS=[],CONTENT=[],ACCESS=null;
let _ans={},_sub=false,_eqs=[],_cp=0;
let _eti=null,_aci=null;
window._pl=null;let _wmt=null;

/* ═══ THEME ═══ */
function setTheme(th){
  document.documentElement.setAttribute('data-theme',th);localStorage.setItem('kw-t',th);
  document.getElementById('n-dk').classList.toggle('on',th==='dark');
  document.getElementById('n-lt').classList.toggle('on',th==='light');
}
function goHome(){window.location.href='/dashboard/';}
function toast(type,msg,dur=3400){
  const ic={s:'✅',e:'❌',w:'⚠️',i:'ℹ️'};
  const c=document.getElementById('toasts'),el=document.createElement('div');
  el.className=`toast t${type}`;el.innerHTML=`<span>${ic[type]||'ℹ️'}</span><span>${msg}</span>`;
  c.appendChild(el);setTimeout(()=>{el.classList.add('tx');setTimeout(()=>el.remove(),200);},dur);
}
function ytId(u){const m=(u||'').match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null;}
function ps(){return Math.max(0,Math.min(100,Number(EXAM?.pass_score??50)));}
function norOpts(q){
  let o=q?.options;if(typeof o==='string'){try{o=JSON.parse(o);}catch{o=null;}}
  if(!Array.isArray(o)||!o.length){o='abcdefgh'.split('').filter(k=>q&&q[`option_${k}`]).map(k=>({text:q[`option_${k}`],is_correct:String(q.correct_option||'').toLowerCase()===k}));}
  o=o.map(x=>typeof x==='string'?{text:x,is_correct:false}:{text:x?.text??x?.label??x?.value??'',is_correct:!!x?.is_correct}).filter(x=>String(x.text).trim());
  if(o.length&&!o.some(x=>x.is_correct)){
    const c=String(q?.correct_option||'').toLowerCase();let i='abcdefghij'.indexOf(c);
    if(i<0&&!isNaN(+c))i=+c;if(i>=0&&o[i])o[i].is_correct=true;
  }
  return o;
}
function norQs(qs){return(qs||[]).map(q=>({...q,options:norOpts(q)}));}

/* ═══ WATCHED ═══ */
function wk(){return`kw-w-${LESSON?.id}`;}
function getW(){try{return JSON.parse(localStorage.getItem(wk())||'[]');}catch{return[];}}
function markW(idx){
  const w=getW();if(w.includes(idx))return;
  w.push(idx);try{localStorage.setItem(wk(),JSON.stringify(w));}catch{}
  refreshW(w);
}
function refreshW(w){
  const total=VIDEOS.length;
  VIDEOS.forEach((_,i)=>{
    const row=document.getElementById(`pr-${i}`);if(!row)return;
    const pn=row.querySelector('.pn'),ps=row.querySelector('.ps');
    if(w.includes(i)){
      row.classList.add('done');
      if(pn)pn.textContent='✓';
      if(ps&&!ps.querySelector('.ps-play'))ps.innerHTML='<span class="ps-done">✓ شاهدت</span>';
    }else{
      row.classList.remove('done');
      if(pn)pn.textContent=i+1;
      if(ps&&!ps.querySelector('.ps-play'))ps.textContent='';
    }
  });
  const done=w.length,pct=total>0?Math.round(done/total*100):0;
  const ff=document.getElementById('pff'),fl=document.getElementById('pfl'),cn=document.getElementById('pcnt');
  if(ff)ff.style.width=pct+'%';if(fl)fl.textContent=`${done} من ${total} اتشافوا`;if(cn)cn.textContent=`${done}/${total}`;
}

/* ═══ ACCESS ═══ */
function ah(){return Math.max(1,Number(LESSON?.access_hours??24));}
function ae(){if(!ACCESS?.used_at)return null;return new Date(new Date(ACCESS.used_at).getTime()+ah()*3600000);}
function ml(){const e=ae();return e?e.getTime()-Date.now():null;}
function startAcs(){
  if(ROLE==='admin'||ROLE==='teacher'||!ACCESS?.used_at)return;
  const ab=document.getElementById('ab'),ac=document.getElementById('ac'),abf=document.getElementById('abf');
  if(!ab)return;ab.classList.remove('hidden');ac.classList.remove('hidden');
  const tot=ah()*3600000;
  function upd(){
    const left=ml();if(left==null)return;
    const sec=Math.max(0,Math.floor(left/1000)),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
    const str=h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(ac){ac.textContent=`⏳ ${str} متبقي`;ac.classList.toggle('warn',left<600000);ac.classList.toggle('ok',left>=600000);}
    if(abf)abf.style.width=Math.max(0,(left/tot)*100)+'%';
    if(left<=0){clearInterval(_aci);try{window._pl?.pause();}catch{}showErr('انتهى وقت الحصة. ادخل كود جديد.');}
  }
  upd();_aci=setInterval(upd,1000);
}

/* ═══ INIT ═══ */
async function init(){
  const th=localStorage.getItem('kw-t')||'dark';setTheme(th);
  const lid=new URLSearchParams(location.search).get('id');
  if(!lid){showErr('لم يتم تحديد الحصة');return;}
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='/login/';return;}
  const{data:pr}=await sb.from('profiles').select('role,phone').eq('id',session.user.id).single();
  ROLE=pr?.role||'student';ME={id:session.user.id,phone:pr?.phone||''};
  if(ROLE!=='admin'&&ROLE!=='teacher'){
    const{data:acc}=await sb.from('lesson_codes').select('id,used_at,expires_at').eq('lesson_id',lid).eq('used_by',session.user.id).maybeSingle();
    if(!acc){showErr('لازم تضيف الحصة للسلة وتدخل كود الحصة');return;}
    ACCESS=acc;
  }
  await loadLesson(lid);
}

async function loadLesson(lid){
  const[{data:ls},{data:vids},{data:exs},{data:cnt}]=await Promise.all([
    sb.from('lessons').select('id,title,description,is_active,scheduled_at,access_hours,image_url,chapters(title,image_url,subjects(name_ar))').eq('id',lid).single(),
    sb.from('lesson_videos').select('*').eq('lesson_id',lid).order('sort_order'),
    sb.from('exams').select('id,title,duration_minutes,pass_score').eq('lesson_id',lid).limit(1),
    sb.from('lesson_content').select('*').eq('lesson_id',lid).order('sort_order'),
  ]);
  if(!ls){showErr('الحصة غير موجودة');return;}
  LESSON=ls;VIDEOS=vids||[];CONTENT=cnt||[];EXAM=exs?.[0]||null;
  if(ls.scheduled_at&&new Date(ls.scheduled_at)>new Date()){
    const t=new Date(ls.scheduled_at).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
    showErr(`الحصة هتفتح في ${t}`);return;
  }
  if(ROLE!=='admin'&&ROLE!=='teacher'){
    if(!ls.is_active){showErr('الحصة مغلقة حالياً');return;}
    const exp=ae();if(exp&&exp.getTime()<=Date.now()){showErr('انتهى وقت الحصة. ادخل كود جديد.');return;}
  }
  buildPage();startAcs();
}

/* ═══ CONTENT FILTERS ═══ */
function getPDF(){return CONTENT.filter(c=>String(c.type||'').toLowerCase()==='pdf');}
function getIMG(){return CONTENT.filter(c=>String(c.type||'').toLowerCase()==='image');}
function getHW(){return CONTENT.filter(c=>{const t=String(c.type||'').toLowerCase(),tx=`${c.title||''} ${c.body||''}`.toLowerCase();return['homework','assignment','hw','واجب'].includes(t)||tx.includes('واجب')||tx.includes('homework');});}

/* ═══ BUILD PAGE ═══ */
function buildPage(){
  const ch=LESSON.chapters;
  document.getElementById('il')?.remove();
  const tabs=document.getElementById('tabs');if(tabs)tabs.style.display='flex';
  // Update tab labels
  document.getElementById('tab-video').innerHTML  =`🎥 فيديو <span class="tbg">${VIDEOS.length}</span>`;
  document.getElementById('tab-homework').innerHTML=`📌 واجب <span class="tbg">${getHW().length}</span>`;
  document.getElementById('tab-pdf').innerHTML     =`📄 PDF <span class="tbg">${getPDF().length+getIMG().length}</span>`;
  document.getElementById('tab-exam').innerHTML    =`📝 امتحان${EXAM?` <span class="tbg">1</span>`:''}`;

  document.getElementById('page').innerHTML=`
    <div class="banner">
      <div class="b-in">
        <div class="b-cover">${(LESSON.image_url||ch?.image_url)?`<img src="${iS(LESSON.image_url||ch?.image_url)}" onerror="iE(this,'🎬')">`:'🎬'}</div>
        <div>
          <div class="b-chapter">${ch?.subjects?.name_ar||''} ${ch?.title?`← ${ch.title}`:''}</div>
          <div class="b-title">${LESSON.title}</div>
          <div class="b-chips">
            <span class="bch">🎥 ${VIDEOS.length}</span>
            <span class="bch">📄 ${getPDF().length} PDF</span>
            <span class="bch">🖼️ ${getIMG().length}</span>
            <span class="bch">📌 ${getHW().length} واجب</span>
            ${EXAM?.duration_minutes?`<span class="bch">⏱️ ${EXAM.duration_minutes} د</span>`:''}
            ${EXAM?`<span class="bch">🎯 نجاح ${ps()}%</span>`:''}
          </div>
        </div>
      </div>
    </div>
    <div id="cnt" style="flex:1;display:flex;flex-direction:column"></div>
    <footer><div class="fb">kala<em>wy</em></div><div class="fc">محتوى محمي © kalawy</div></footer>`;
  sw('exam');
}

/* ═══ TAB SWITCH ═══ */
function sw(id){
  ['exam','video','homework','pdf'].forEach(t=>document.getElementById(`tab-${t}`)?.classList.toggle('on',t===id));
  if(id==='exam')renderExam();
  else if(id==='video')renderVideo();
  else if(id==='homework')renderHW();
  else if(id==='pdf')renderPDF();
}

/* ═══ PLYR ═══ */
function killPlyr(){if(window._pl){try{window._pl.destroy();}catch{}window._pl=null;}if(_wmt){clearInterval(_wmt);_wmt=null;}}

function buildPlyr(videoId,idx){
  killPlyr();
  const el=document.getElementById('plyr-el');if(!el)return;
  el.setAttribute('data-plyr-embed-id',videoId);
  window._pl=new Plyr(el,{
    youtube:{noCookie:true,rel:0,showinfo:0,iv_load_policy:3,modestbranding:1},
    controls:['play-large','play','rewind','fast-forward','progress','current-time','duration','mute','volume','settings','fullscreen'],
    settings:['quality','speed'],
    speed:{selected:1,options:[0.5,0.75,1,1.25,1.5,2]},
    keyboard:{focused:false,global:false},
    fullscreen:{enabled:true,fallback:true,iosNative:true},
    tooltips:{controls:false},
    disableContextMenu:true,
    ratio:'16:9',
  });
  window._pl.on('ended',()=>markW(idx));
  window._pl.on('timeupdate',()=>{try{const p=window._pl;if(p.duration>0&&p.currentTime/p.duration>=0.85)markW(idx);}catch{}});
  window._pl.on('ready',()=>detectAdBlock(()=>{const w=document.getElementById('adb-w');if(w)w.classList.remove('hidden');}));
  // Watermark
  const uid=String(ME?.id||'').slice(0,8).toUpperCase();
  const wmId=document.getElementById('wm-id');if(wmId)wmId.textContent=uid;
  startWm();
}

function startWm(){
  const wm=document.getElementById('kwm');if(!wm)return;
  function mv(){const x=6+Math.random()*72,y=6+Math.random()*72,r=-14+Math.random()*28;wm.style.left=x+'%';wm.style.top=y+'%';wm.style.setProperty('--r',r+'deg');}
  mv();_wmt=setInterval(mv,2600);
}

/* ═══ VIDEO TAB ═══ */
function renderVideo(){
  if(EXAM){renderVideoCheck();return;}
  _renderVid();
}
async function renderVideoCheck(){
  const{data:sub}=await sb.from('exam_submissions').select('id,passed').eq('exam_id',EXAM.id).eq('student_id',ME.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();
  if(!sub||!sub.passed){
    document.getElementById('cnt').innerHTML=`
    <div class="rp">
      <div class="rc glass">
        <span class="ri">🔒</span>
        <div class="rl">الفيديو مقفول</div>
        <div class="rd">لازم تعدي الامتحان بدرجة ${ps()}% أو أكتر عشان الفيديو يتفتح</div>
        <div class="ra"><button class="btn btn-p btn-l" onclick="sw('exam')">📝 ابدأ الامتحان</button></div>
      </div>
    </div>`;
    return;
  }
  _renderVid();
}

function _renderVid(){
  if(!VIDEOS.length){
    document.getElementById('cnt').innerHTML='<div class="emp"><span style="font-size:2.5rem">📭</span><div class="et">لا يوجد فيديو</div></div>';
    return;
  }
  const watched=getW(),total=VIDEOS.length,done=watched.length,pct=total>0?Math.round(done/total*100):0;
  const p=VIDEOS[_cp];

  document.getElementById('cnt').innerHTML=`
  <div class="vid-layout">
    <!-- PLAYER -->
    <div class="vid-col">
      <div id="plyr-wrap" style="position:relative;flex:1">
        <div id="plyr-el" data-plyr-provider="youtube" data-plyr-embed-id=""></div>
        <!-- Watermark -->
        <div class="wm" id="kwm" style="left:10%;top:10%;--r:-10deg">
          <div class="wm-av">
            <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
              <circle cx="20" cy="14" r="7.5" fill="rgba(255,255,255,.92)"/>
              <ellipse cx="20" cy="33" rx="13.5" ry="9" fill="rgba(255,255,255,.92)"/>
            </svg>
          </div>
          <div class="wm-id" id="wm-id"></div>
        </div>
        <!-- AdBlock -->
        <div class="adb-warn hidden" id="adb-w">
          <div class="adb-ico">🛡️</div>
          <div class="adb-t">حاجب إعلانات مكتشف</div>
          <div class="adb-s">أوقف <strong style="color:var(--p4)">Brave Shields</strong> أو <strong style="color:var(--p4)">AdBlock</strong> لمشاهدة الفيديو</div>
          <button class="btn btn-p" style="margin-top:6px" onclick="location.reload()">🔄 إعادة المحاولة</button>
        </div>
      </div>
      <div class="vid-bar">
        <div class="vb-title">${VIDEOS.length>1?`الجزء ${_cp+1}/${VIDEOS.length} — `:''}${p.title||'فيديو الحصة'}</div>
        <div class="vb-nav">
          ${_cp>0?`<button class="btn btn-g" onclick="chP(${_cp-1})">← السابق</button>`:''}
          ${_cp<VIDEOS.length-1?`<button class="btn btn-p" onclick="chP(${_cp+1})">التالي →</button>`:''}
        </div>
      </div>
    </div>

    <!-- PARTS SIDEBAR -->
    <div class="parts-col">
      <div class="ph">
        <span class="ph-lbl">📋 أجزاء الحصة</span>
        <span class="ph-cnt" id="pcnt">${done}/${total}</span>
      </div>
      <div class="pl">
        ${VIDEOS.map((v,i)=>`
          <div class="pr${i===_cp?' active':''}${watched.includes(i)?' done':''}" id="pr-${i}" onclick="chP(${i})">
            <div class="pn">${watched.includes(i)?'✓':i+1}</div>
            <div class="pi">
              <div class="pt">${v.title||('فيديو '+(i+1))}</div>
              <div class="ps">
                ${i===_cp?'<span class="ps-play">▶ يُشغَّل الآن</span>':watched.includes(i)?'<span class="ps-done">✓ شاهدت</span>':''}
              </div>
            </div>
          </div>`).join('')}
      </div>
      <div class="pf">
        <div class="pfb"><div class="pff" id="pff" style="width:${pct}%"></div></div>
        <div class="pfl" id="pfl">${done} من ${total} اتشافوا</div>
      </div>
    </div>
  </div>`;

  const vid=ytId(p.youtube_url);
  if(vid)buildPlyr(vid,_cp);
  else document.getElementById('plyr-wrap').innerHTML=`<div style="aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#050208;flex-direction:column;gap:8px;color:var(--t3)"><span style="font-size:2rem">⚠️</span><div>رابط الفيديو غير صحيح</div></div>`;
}

function chP(idx){_cp=idx;killPlyr();renderVideo();}

/* ═══ EXAM ═══ */
async function renderExam(startNow=false){
  const c=document.getElementById('cnt');
  if(!EXAM){c.innerHTML='<div class="emp"><span style="font-size:2.8rem">📝</span><div class="et">لا يوجد امتحان</div><div class="es">المدرس لسه ما أضافش امتحان</div></div>';return;}
  c.innerHTML='<div class="ld" style="min-height:40vh"><div class="spin"></div></div>';
  const{data:sub}=await sb.from('exam_submissions').select('id,score,passed,attempt_count,answers,updated_at').eq('exam_id',EXAM.id).eq('student_id',ME.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();
  if(sub&&!startNow){
    const{data:qs}=await sb.from('exam_questions').select('*').eq('exam_id',EXAM.id).order('sort_order');
    _eqs=norQs(qs||[]);renderResult(sub.score,true,!!sub.passed,sub.attempt_count||1,_eqs,sub.answers||[]);return;
  }
  const{data:qs,error:qe}=await sb.from('exam_questions').select('*').eq('exam_id',EXAM.id).order('sort_order');
  if(qe||!qs?.length){c.innerHTML='<div class="emp"><span style="font-size:2.5rem">📝</span><div class="et">لا توجد أسئلة</div></div>';return;}
  _eqs=norQs(qs);
  if(!startNow){
    c.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:center;min-height:52vh;padding:28px 18px">
      <div class="ic glass" style="max-width:460px;width:100%">
        <span class="ic-i">📝</span>
        <div class="ic-t">${EXAM.title||'امتحان الحصة'}</div>
        <div class="ic-s">لازم تعدي بدرجة ${ps()}% أو أكتر عشان يتفتح الفيديو</div>
        <div class="ic-m">
          <div class="ic-mt">📋 ${_eqs.length} سؤال</div>
          ${EXAM.duration_minutes?`<div class="ic-mt">⏱️ ${EXAM.duration_minutes} دقيقة</div>`:''}
          <div class="ic-mt">🎯 نجاح ${ps()}%</div>
        </div>
        <div style="display:flex;gap:9px;justify-content:center">
          <button class="btn btn-p btn-l" onclick="renderExam(true)">▶️ ابدأ الامتحان</button>
          <button class="btn btn-g" onclick="sw('video')">🎥 الفيديو</button>
        </div>
      </div>
    </div>`;
    return;
  }
  _ans={};_sub=false;
  const hasDur=!!EXAM.duration_minutes;
  c.innerHTML=`
  <div class="ew">
    ${hasDur?`<div class="etrow"><span style="font-size:.8rem;font-weight:700;color:var(--t2)">⏱️ الوقت</span><div class="etbar"><div class="etf" id="etf" style="width:100%"></div></div><div class="etv" id="etv">--:--</div></div>`:''}
    <div id="eb">
      ${_eqs.map((q,i)=>{
        const opts=q.options||[];
        return`<div class="qc" id="qc-${q.id}">
          <div class="qn"><div class="qdot"></div>سؤال ${i+1} من ${_eqs.length}</div>
          ${q.image_url?`<img class="qi" src="${iS(q.image_url)}" onerror="iE(this,'🖼️')" loading="lazy">`:''}
          <div class="qt">${esc(q.question_text)}</div>
          <div class="opts" id="opts-${q.id}">
            ${opts.map((o,oi)=>`
              <div class="opt" id="opt-${q.id}-${oi}" onclick="pick('${q.id}',${oi})">
                <div class="ol">${String.fromCharCode(65+oi)}</div>
                <div class="ot">${esc(o.text)}</div>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="ef">
    <div class="ep"><span id="an-c">0</span>/${_eqs.length} أجبت<div class="epb"><div class="epf" id="an-f" style="width:0%"></div></div></div>
    <button class="btn btn-p btn-l" id="sub-btn" onclick="submitExam(false)">📤 تسليم الامتحان</button>
  </div>`;
  if(hasDur)startET(EXAM.duration_minutes*60);
}

function startET(tot){
  let sec=tot;if(_eti)clearInterval(_eti);
  function u(){
    const m=Math.floor(sec/60),s=sec%60,str=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const v=document.getElementById('etv'),f=document.getElementById('etf');
    if(v){v.textContent=str;v.classList.toggle('warn',sec<=60);}
    if(f)f.style.width=(sec/tot*100)+'%';
    if(sec<=0){clearInterval(_eti);submitExam(true);return;}sec--;
  }
  u();_eti=setInterval(u,1000);
}

function pick(qId,idx){
  if(_sub)return;
  document.querySelectorAll(`[id^="opt-${qId}-"]`).forEach(el=>el.classList.remove('sel'));
  document.getElementById(`opt-${qId}-${idx}`)?.classList.add('sel');
  _ans[qId]=idx;
  const done=Object.keys(_ans).length,tot=_eqs.length;
  const ac=document.getElementById('an-c'),af=document.getElementById('an-f');
  if(ac)ac.textContent=done;if(af)af.style.width=Math.round(done/tot*100)+'%';
  document.getElementById(`qc-${qId}`)?.classList.add('ok');
}

async function submitExam(auto=false){
  const qs=_eqs;if(!qs.length)return toast('e','الأسئلة لم تتحمل');
  if(_sub)return;
  if(!auto&&Object.keys(_ans).length<qs.length)return toast('w','جاوب على كل الأسئلة قبل التسليم');
  _sub=true;if(_eti)clearInterval(_eti);
  const btn=document.getElementById('sub-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin" style="width:14px;height:14px;border-width:2px"></span> جاري التصحيح...';}
  let cor=0;const log=[];
  qs.forEach(q=>{const opts=q.options||[],si=_ans[q.id];if(opts[si]?.is_correct)cor++;log.push({qId:q.id,idx:si});});
  const score=Math.round(cor/qs.length*100),passed=score>=ps();
  const{data:old}=await sb.from('exam_submissions').select('id,attempt_count').eq('exam_id',EXAM.id).eq('student_id',ME.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();
  const na=(old?.attempt_count||0)+1;
  const pl={exam_id:EXAM.id,student_id:ME.id,score,passed,attempt_count:na,updated_at:new Date().toISOString(),answers:log};
  let sv;if(old?.id)sv=await sb.from('exam_submissions').update(pl).eq('id',old.id).select().single();
  else sv=await sb.from('exam_submissions').insert(pl).select().single();
  if(sv?.error){_sub=false;if(btn){btn.disabled=false;btn.innerHTML='📤 تسليم';}return toast('e','فشل الحفظ: '+sv.error.message);}
  setTimeout(()=>renderResult(score,false,passed,na,qs,log),300);
}

function renderResult(score,saved,passed,attempts,eqs,log){
  const c=document.getElementById('cnt');
  const pass=passed!==null?!!passed:score>=ps();
  const am={};(log||[]).forEach(a=>{am[a.qId]=a.idx;});
  const qh=(eqs&&eqs.length)?`
  <div style="margin-top:20px">
    <div style="font-weight:900;font-size:.93rem;margin-bottom:13px;color:var(--t2)">📋 مراجعة الإجابات</div>
    ${eqs.map((q,i)=>{
      const opts=q.options||[],si=am[q.id],isc=opts[si]?.is_correct;
      return`<div class="qc" style="margin-bottom:11px">
        <div class="qn"><div class="qdot" style="background:${si!==undefined?(isc?'#34d399':'#f87171'):'var(--t3)'}"></div>سؤال ${i+1}</div>
        ${q.image_url?`<img class="qi" src="${iS(q.image_url)}" onerror="iE(this,'🖼️')" loading="lazy">`:''}
        <div class="qt">${esc(q.question_text)}</div>
        <div class="opts">
          ${opts.map((o,oi)=>{
            const isSel=oi===si,isOk=o.is_correct;
            const cls='opt'+(isOk?' cor':isSel&&!isOk?' wrg':' ntl');
            const icon=isOk?'<span class="oi">✅</span>':isSel&&!isOk?'<span class="oi">❌</span>':'';
            return`<div class="${cls}"><div class="ol">${String.fromCharCode(65+oi)}</div><div class="ot">${esc(o.text)}</div>${icon}</div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`:'';
  c.innerHTML=`
  <div class="ew">
    <div class="sw glass">
      <div class="sb ${pass?'p':'f'}">${score}%</div>
      <div class="si">
        <div class="sl">${pass?'🏆 ممتاز! الفيديو اتفتح':'📖 درجة أقل من المطلوب'}</div>
        <div class="ss">درجة النجاح: ${ps()}% • محاولة رقم ${attempts}${saved?' • نتيجة محفوظة':' • تم الحفظ'}</div>
      </div>
      <div class="sa">
        ${pass&&VIDEOS.length?`<button class="btn btn-p" onclick="sw('video')">▶️ شاهد الفيديو</button>`:''}
        ${!pass?`<button class="btn btn-p" onclick="renderExam(false)">🔄 امتحن تاني</button>`:''}
        <button class="btn btn-g" onclick="goHome()">← رجوع</button>
      </div>
    </div>
    ${qh}
  </div>`;
}

/* ═══ HOMEWORK ═══ */
function renderHW(){
  const items=getHW(),c=document.getElementById('cnt');
  if(!items.length){c.innerHTML='<div class="emp"><span style="font-size:2.8rem">📌</span><div class="et">لا يوجد واجب</div><div class="es">المدرس لسه ما أضافش واجب</div></div>';return;}
  c.innerHTML=`<div class="gc">${items.map((ct,i)=>`
    <div class="mc">
      <span class="mi">📌</span><div class="mt">${ct.title||('واجب '+(i+1))}</div>
      ${ct.url?`<a href="${iS(ct.url)}" target="_blank" class="btn btn-p" style="margin-top:9px;font-size:.79rem;padding:6px 13px">فتح المرفق ←</a>`:''}
      ${ct.body?`<div class="mb">${String(ct.body).replace(/\n/g,'<br>')}</div>`:(!ct.url?`<div class="ms">لا توجد تفاصيل</div>`:'')}
    </div>`).join('')}</div>`;
}

/* ═══ PDF ═══ */
function renderPDF(){
  const p=getPDF(),img=getIMG(),c=document.getElementById('cnt');
  if(!p.length&&!img.length){c.innerHTML='<div class="emp"><span style="font-size:2.8rem">📄</span><div class="et">لا يوجد PDF أو صور</div><div class="es">أي ملف يضيفه المدرس هيظهر هنا</div></div>';return;}
  c.innerHTML=`
  ${p.length?`<div class="gc">${p.map((ct,i)=>`<a class="mc" href="${iS(ct.url)||'#'}" target="_blank"><span class="mi">📄</span><div class="mt">${ct.title||('PDF '+(i+1))}</div><div class="ms">اضغط لفتح أو تحميل</div></a>`).join('')}</div>`:''}
  ${img.length?`<div style="padding:14px 22px;display:flex;flex-direction:column;gap:13px">${img.map((ct,i)=>`<div><div style="font-size:.78rem;color:var(--t2);font-weight:700;margin-bottom:6px">🖼️ ${ct.title||('صورة '+(i+1))}</div><div style="border-radius:var(--rl);overflow:hidden;border:1px solid var(--bd)"><img style="width:100%;display:block" src="${iS(ct.url)}" onerror="iE(this,'🖼️')" loading="lazy"></div></div>`).join('')}</div>`:''}`;
}

/* ═══ ERROR ═══ */
function showErr(msg){
  document.getElementById('il')?.remove();
  document.getElementById('tabs').style.display='none';
  document.getElementById('page').innerHTML=`
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px">
    <div class="glass" style="border-radius:var(--rxl);padding:38px 28px;text-align:center;max-width:390px;width:100%">
      <span style="font-size:3rem;display:block;margin-bottom:12px">🔒</span>
      <div style="font-size:1rem;font-weight:900;margin-bottom:16px">${msg}</div>
      <button class="btn btn-p btn-l" onclick="goHome()">← العودة</button>
    </div>
  </div>`;
}

(function(){const th=localStorage.getItem('kw-t')||'dark';setTheme(th);})();
init();
</script>
