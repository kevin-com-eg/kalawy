<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kalawy — الدفع والتفعيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  /* Modern Color Palette */
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --success: #10b981;
  --success-bg: #d1fae5;
  --danger: #ef4444;
  --danger-bg: #fee2e2;
  --warning: #f59e0b;
  
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --nav-h: 70px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-hover: #f1f5f9;
  --border: #e2e8f0;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --input-bg: #f8fafc;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --glass: rgba(255, 255, 255, 0.8);
}

[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-hover: #334155;
  --border: #334155;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --input-bg: #0f172a;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5), 0 2px 4px -2px rgb(0 0 0 / 0.5);
  --success-bg: rgba(16, 185, 129, 0.15);
  --danger-bg: rgba(239, 68, 68, 0.15);
  --glass: rgba(30, 41, 59, 0.8);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Cairo', sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s ease;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; }

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* Navbar */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-h);
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(16px, 5vw, 48px);
}
.nav-logo {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.nav-mark {
  width: 40px; height: 40px;
  background: var(--primary);
  border-radius: var(--radius-md);
  display: grid; place-items: center;
  color: white; font-weight: 800; font-size: 1.1rem;
  letter-spacing: 1px;
}
.nav-brand { font-weight: 800; font-size: 1.2rem; color: var(--text-main); }
.nav-brand span { color: var(--primary); }

.nav-actions { display: flex; align-items: center; gap: 16px; }
.theme-toggle {
  background: var(--surface-hover); border: 1px solid var(--border);
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  font-size: 1.2rem; transition: var(--transition);
  color: var(--text-main);
}
.theme-toggle:hover { background: var(--border); }
.btn-back {
  display: flex; align-items: center; gap: 8px;
  background: transparent; border: 1px solid var(--border);
  padding: 8px 16px; border-radius: var(--radius-sm);
  color: var(--text-main); font-weight: 600; font-size: 0.9rem;
  cursor: pointer; transition: var(--transition);
}
.btn-back:hover { background: var(--surface-hover); border-color: var(--text-muted); }

/* Main Container */
.container {
  max-width: 680px; margin: 0 auto;
  padding: calc(var(--nav-h) + 40px) 20px 80px;
}

/* Header */
.page-header { text-align: center; margin-bottom: 40px; animation: fadeIn 0.4s ease; }
.page-title { font-size: clamp(1.7rem, 4vw, 2.2rem); font-weight: 800; margin-bottom: 8px; color: var(--text-main); }
.page-desc { color: var(--text-muted); font-size: 1rem; font-weight: 500; }

/* Cart Items */
.cart-list { display: flex; flex-direction: column; gap: 20px; }
.cart-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  animation: fadeIn 0.5s ease backwards;
}
.cart-item:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }
.cart-item.unlocked {
  border-color: var(--success);
  background: var(--success-bg);
}

.item-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.item-img {
  width: 70px; height: 70px; border-radius: var(--radius-md);
  background: var(--surface-hover); border: 1px solid var(--border);
  display: grid; place-items: center; font-size: 1.8rem; overflow: hidden;
  flex-shrink: 0;
}
.item-img img { width: 100%; height: 100%; object-fit: cover; }
.item-details { flex: 1; min-width: 0; }
.item-title { font-weight: 700; font-size: 1.1rem; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-price { font-weight: 600; color: var(--text-muted); font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }
.item-price.free { color: var(--success); }

.btn-remove {
  width: 36px; height: 36px; border-radius: 50%;
  border: none; background: var(--danger-bg); color: var(--danger);
  display: grid; place-items: center; cursor: pointer; transition: var(--transition);
  flex-shrink: 0;
}
.btn-remove:hover { background: var(--danger); color: white; transform: scale(1.05); }

/* Input Group */
.input-group {
  display: flex; gap: 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  overflow: hidden;
  transition: var(--transition);
}
.input-group:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
.code-input {
  flex: 1; padding: 14px 16px; border: none; background: var(--input-bg);
  color: var(--text-main); font-weight: 700; font-size: 1rem;
  letter-spacing: 2px; text-transform: uppercase; outline: none;
  font-family: monospace;
}
.btn-unlock {
  padding: 0 24px; border: none; background: var(--primary);
  color: white; font-weight: 700; font-size: 1rem; cursor: pointer;
  transition: var(--transition); display: flex; align-items: center; gap: 8px;
}
.btn-unlock:hover { background: var(--primary-hover); }
.btn-unlock:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

/* Success State */
.success-state {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2); border-radius: var(--radius-sm);
  color: var(--success); font-weight: 700; font-size: 0.95rem;
}
.btn-watch {
  background: var(--success); color: white; border: none;
  padding: 8px 16px; border-radius: var(--radius-sm);
  font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: var(--transition);
}
.btn-watch:hover { opacity: 0.9; transform: translateY(-1px); }

/* Summary Bottom Bar */
.summary-bar {
  margin-top: 32px; padding: 20px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow-sm); animation: fadeIn 0.6s ease;
}
.summary-text { font-weight: 600; color: var(--text-muted); }
.summary-count {
  background: var(--primary); color: white;
  padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.9rem;
}

/* Empty State */
.empty-state { text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.5; display: block; }
.empty-title { font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin-bottom: 12px; }
.empty-desc { color: var(--text-muted); margin-bottom: 30px; font-size: 1rem; }
.btn-primary {
  background: var(--primary); color: white; border: none;
  padding: 14px 28px; border-radius: var(--radius-sm);
  font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition);
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }

/* Loading Spinner */
.loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; color: var(--text-muted); font-weight: 600; }
.spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
.btn-spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }

/* Toasts */
#toasts { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); color: var(--text-main);
  padding: 12px 20px; border-radius: var(--radius-md);
  box-shadow: var(--shadow-md); border: 1px solid var(--border);
  font-weight: 600; font-size: 0.9rem; pointer-events: auto;
  animation: slideInRight 0.3s ease;
}
.toast.success { border-right: 4px solid var(--success); }
.toast.error { border-right: 4px solid var(--danger); }
.toast.warning { border-right: 4px solid var(--warning); }
.toast-out { opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }

@media (max-width: 500px) {
  .input-group { flex-direction: column; gap: 8px; border: none; }
  .input-group:focus-within { box-shadow: none; }
  .code-input, .btn-unlock { width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .code-input:focus { border-color: var(--primary); }
  .btn-unlock { padding: 14px; justify-content: center; border: none; }
  .summary-bar { flex-direction: column; gap: 16px; text-align: center; }
}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="nav">
  <div class="nav-logo" onclick="window.location.href='/dashboard/'">
    <div class="nav-mark">KW</div>
    <div class="nav-brand">Kala<span>wy</span></div>
  </div>
  
  <div class="nav-actions">
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="تغيير المظهر">🌙</button>
    <button class="btn-back" onclick="window.location.href='/dashboard/'">
      العودة للوحة <span>👋</span>
    </button>
  </div>
</nav>

<div id="toasts"></div>

<!-- Main Content -->
<main class="container" id="page">
  <div class="loader-container">
    <div class="spinner"></div>
    <div>جاري تجهيز السلة...</div>
  </div>
</main>

<script>
// نفس إعدادات قاعدة البيانات الخاصة بك
const SB_URL="https://xzjxmfgymbvordumrush.supabase.co";
const SB_ANON="sb_publishable_yDrrS95uLq4ch8pu0OwZ0w_6UiBx22e";
const sb=window.supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:true,autoRefreshToken:true}});

let ME=null, _cart=[];

/* ══ THEME ══ */
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kw-theme', next);
  document.getElementById('theme-btn').textContent = next === 'light' ? '🌙' : '☀️';
}

function initTheme() {
  const saved = localStorage.getItem('kw-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('theme-btn').textContent = saved === 'light' ? '🌙' : '☀️';
}

/* ══ UTILS ══ */
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function imgSrc(v){
  if(!v)return'';v=String(v).trim();if(!v)return'';
  if(/^(https?:|data:|blob:)/.test(v))return v;
  if(v.startsWith('/storage/'))return SB_URL+v;
  return`${SB_URL}/storage/v1/object/public/kalawy/${v.replace(/^\/+/,'').replace(/^kalawy\//,'')}`;
}

function toast(type, msg) {
  const types = { s: 'success', e: 'error', w: 'warning', i: 'info' };
  const icons = { s: '✅', e: '❌', w: '⚠️', i: 'ℹ️' };
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  
  el.className = `toast ${types[type] || ''}`;
  el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  wrap.appendChild(el);
  
  setTimeout(() => {
    el.classList.add('toast-out');
    setTimeout(() => el.remove(), 300);
  }, 3500);
}

function saveCart(){
  localStorage.setItem(`kw-cart-${ME.id}`, JSON.stringify(_cart));
}

function removeItem(lessonId){
  _cart = _cart.filter(c => c.id !== lessonId);
  saveCart();
  render();
}

/* ══ UNLOCK ══ */
async function unlockLesson(lessonId){
  const inp = document.getElementById(`ci-${lessonId}`);
  const btn = document.getElementById(`ub-${lessonId}`);
  const code = (inp?.value || '').trim().toUpperCase();
  
  if(!code){ toast('w', 'يرجى إدخال كود التفعيل أولاً'); return; }

  btn.disabled = true;
  btn.innerHTML = `<span class="btn-spinner"></span>`;

  const {data: row, error} = await sb.from('lesson_codes')
    .select('id,lesson_id,used_by')
    .eq('code', code).single();

  if(error || !row){
    toast('e', 'الكود غير صحيح أو غير موجود');
    btn.disabled = false; btn.innerHTML = 'تفعيل الحصة'; return;
  }
  if(row.lesson_id !== lessonId){
    toast('e', 'هذا الكود مخصص لحصة أخرى');
    btn.disabled = false; btn.innerHTML = 'تفعيل الحصة'; return;
  }
  if(row.used_by && row.used_by !== ME.id){
    toast('e', 'هذا الكود تم استخدامه مسبقاً');
    btn.disabled = false; btn.innerHTML = 'تفعيل الحصة'; return;
  }

  const {error: upErr} = await sb.from('lesson_codes')
    .update({used_by: ME.id, used_at: new Date().toISOString()})
    .eq('id', row.id);

  if(upErr){
    toast('e', 'حدث خطأ أثناء التفعيل: ' + upErr.message);
    btn.disabled = false; btn.innerHTML = 'تفعيل الحصة'; return;
  }

  toast('s', 'تم تفعيل الحصة بنجاح! 🎉');

  /* Update UI to Success State */
  const item = document.getElementById(`item-${lessonId}`);
  if(item){
    item.classList.add('unlocked');
    const codeArea = item.querySelector('.code-area');
    if(codeArea){
      codeArea.innerHTML = `
        <div class="success-state">
          <span style="display:flex; align-items:center; gap:8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            تم تفعيل الحصة، جاهزة للمشاهدة
          </span>
          <button class="btn-watch" onclick="window.location.href='/lesson/?id=${lessonId}'">شاهد الآن</button>
        </div>`;
    }
  }

  /* Remove from cart after short delay */
  setTimeout(()=>{
    _cart = _cart.filter(c => c.id !== lessonId);
    saveCart();
    updateSummary();
  }, 2000);
}

/* ══ UPDATE SUMMARY ══ */
function updateSummary(){
  const countEl = document.getElementById('sum-count');
  if(countEl) countEl.textContent = `${_cart.length} حصص`;
  
  if(_cart.length === 0){
    setTimeout(() => render(), 500); // Re-render to show empty state
  }
}

/* ══ RENDER ══ */
function render(){
  const page = document.getElementById('page');

  if(!_cart.length){
    page.innerHTML = `
      <div class="empty-state">
        <span class="empty-icon">🛍️</span>
        <h2 class="empty-title">سلة المشتريات فارغة</h2>
        <p class="empty-desc">لم تقم بإضافة أي حصص إلى سلتك حتى الآن. تصفح الحصص المتاحة وابدأ التعلم.</p>
        <button class="btn-primary" onclick="window.location.href='/dashboard/'">
          تصفح الحصص الآن
        </button>
      </div>`;
    return;
  }

  page.innerHTML = `
    <div class="page-header">
      <h1 class="page-title">تفعيل الحصص</h1>
      <p class="page-desc">قم بإدخال كود التفعيل الخاص بكل حصة للبدء في المشاهدة</p>
    </div>

    <div class="cart-list" id="cart-list">
      ${_cart.map((ls, i) => {
        const thumb = ls.image_url 
          ? `<img src="${imgSrc(ls.image_url)}" alt="${esc(ls.title)}" onerror="this.parentElement.innerHTML='🎓'">` 
          : '🎓';
          
        const price = ls.price != null && Number(ls.price) > 0
          ? `الرسوم: ${Number(ls.price)} ج.م`
          : `<span class="item-price free">محتوى مجاني 🎁</span>`;

        return `
        <div class="cart-item" id="item-${ls.id}" style="animation-delay: ${i * 0.1}s">
          <div class="item-header">
            <div class="item-img">${thumb}</div>
            <div class="item-details">
              <h3 class="item-title" title="${esc(ls.title)}">${esc(ls.title)}</h3>
              <div class="item-price">${price}</div>
            </div>
            <button class="btn-remove" onclick="removeItem('${ls.id}')" title="حذف من السلة">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
          
          <div class="code-area" id="cr-${ls.id}">
            <div class="input-group">
              <input 
                type="text" 
                class="code-input" 
                id="ci-${ls.id}"
                placeholder="أدخل الكود هنا (مثال: KWL-1234)"
                maxlength="30"
                autocomplete="off"
                oninput="this.value=this.value.toUpperCase()"
                onkeydown="if(event.key==='Enter') unlockLesson('${ls.id}')"
              >
              <button class="btn-unlock" id="ub-${ls.id}" onclick="unlockLesson('${ls.id}')">
                تفعيل الحصة
              </button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="summary-bar" id="sum-bar">
      <div class="summary-text">إجمالي الحصص في السلة المعلقة:</div>
      <div class="summary-count" id="sum-count">${_cart.length} حصص</div>
    </div>`;
}

/* ══ INIT ══ */
async function init(){
  initTheme();

  const {data: {session}} = await sb.auth.getSession();
  if(!session){ window.location.href = '/login/'; return; }
  ME = { id: session.user.id };

  try { _cart = JSON.parse(localStorage.getItem(`kw-cart-${ME.id}`) || '[]'); } 
  catch { _cart = []; }

  render();
}

init();
</script>
</body>
</html>
