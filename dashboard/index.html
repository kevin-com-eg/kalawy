<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>kalawy — Platform</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Cdefs%3E%3ClinearGradient id="g" x1="0" y1="0" x2="1" y2="1"%3E%3Cstop stop-color="%237c3cff"/%3E%3Cstop offset=".58" stop-color="%2300d879"/%3E%3Cstop offset="1" stop-color="%23ff4fd8"/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width="64" height="64" rx="18" fill="url(%23g)"/%3E%3Ctext x="32" y="40" font-family="Arial" font-size="22" font-weight="900" text-anchor="middle" fill="white"%3EKW%3C/text%3E%3C/svg%3E'>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ══════════════════════════════════════════
   TOKENS (Original kalawy UI)
══════════════════════════════════════════ */
:root{
  --p1:#8b5cf6;--p2:#7c3aed;--p3:#a78bfa;--p4:#6d28d9;
  --p-glow:rgba(139,92,246,.3);--p-faint:rgba(139,92,246,.08);
  --gold:#fbbf24;--danger:#f43f5e;--ok:#34d399;--info:#38bdf8;
  --r:14px;--r-sm:9px;--r-lg:20px;--r-xl:26px;--r-2xl:34px;
  --nav-h:66px;--bc-h:48px;
  --tr:.22s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#060112;--bg2:#0b0620;--bg3:#120930;
  --card:rgba(20,10,50,.75);--card-s:rgba(30,16,70,.85);
  --border:rgba(139,92,246,.18);--border-h:rgba(139,92,246,.42);
  --glass:rgba(139,92,246,.07);--glass-h:rgba(139,92,246,.14);
  --shine:rgba(255,255,255,.04);
  --shadow:0 8px 32px rgba(0,0,0,.55);--shadow-lg:0 20px 60px rgba(0,0,0,.72);
  --text:#f0eaff;--t2:#a594c8;--t3:#5b4d7a;
  --skel:rgba(139,92,246,.08);--skel-s:rgba(139,92,246,.14);
}
[data-theme="light"]{
  --bg:#f5f0ff;--bg2:#ede8fa;--bg3:#e0d8f8;
  --card:rgba(255,255,255,.88);--card-s:rgba(248,244,255,.96);
  --border:rgba(139,92,246,.18);--border-h:rgba(139,92,246,.44);
  --glass:rgba(139,92,246,.06);--glass-h:rgba(139,92,246,.13);
  --shine:rgba(255,255,255,.75);
  --shadow:0 4px 20px rgba(80,40,160,.1);--shadow-lg:0 12px 44px rgba(80,40,160,.2);
  --text:#1a0533;--t2:#4c2d7a;--t3:#9880bb;
  --skel:rgba(139,92,246,.07);--skel-s:rgba(139,92,246,.13);
}

/* ══════════════════════════════════════════
   RESET
══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-y:scroll;transition:background var(--tr),color var(--tr)}
[data-lang="en"] body{font-family:'Outfit',sans-serif}
[data-lang="en"]{direction:ltr}[data-lang="ar"]{direction:rtl}
button,input,select,textarea{font:inherit}
a{text-decoration:none;color:inherit}
img{display:block}
.hidden{display:none!important}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--p2);border-radius:99px}

/* ══════════════════════════════════════════
   ✨ LOADING SCREEN
══════════════════════════════════════════ */
#loadingScreen{
  position:fixed;inset:0;z-index:99999;
  background:linear-gradient(135deg,#04000e 0%,#0f0530 50%,#1a0840 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .6s ease,visibility .6s ease;
}
#loadingScreen.fade-out{opacity:0;visibility:hidden;pointer-events:none}
.ld-logo{
  width:80px;height:80px;border-radius:24px;
  background:linear-gradient(135deg,#7c3cff,#00d879 58%,#ff4fd8);
  display:grid;place-items:center;font-family:'Outfit',sans-serif;
  font-weight:900;font-size:1.6rem;color:#fff;
  box-shadow:0 0 40px rgba(139,92,246,.6),0 0 80px rgba(139,92,246,.2);
  animation:ld-pulse 1.8s ease-in-out infinite;
}
.ld-brand{font-family:'Outfit',sans-serif;font-weight:900;font-size:1.8rem;color:#fff;letter-spacing:-.03em}
.ld-brand em{font-style:normal;color:#a78bfa}
.ld-bar-wrap{width:200px;height:3px;background:rgba(139,92,246,.2);border-radius:99px;overflow:hidden}
.ld-bar{height:100%;background:linear-gradient(90deg,#7c3cff,#00d879,#ff4fd8);border-radius:99px;animation:ld-fill 2s ease-in-out forwards}
.ld-tip{font-size:.75rem;color:rgba(167,139,250,.6);font-weight:600;animation:fadeIn .5s ease .4s both}
@keyframes ld-pulse{0%,100%{box-shadow:0 0 30px rgba(139,92,246,.5),0 0 60px rgba(139,92,246,.15)}50%{box-shadow:0 0 50px rgba(139,92,246,.8),0 0 100px rgba(139,92,246,.3),0 0 0 12px rgba(139,92,246,.06)}}
@keyframes ld-fill{0%{width:0%;transform:translateX(0)}60%{width:80%}90%{width:95%}100%{width:100%}}

/* ══════════════════════════════════════════
   ANIMATIONS
══════════════════════════════════════════ */
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(30px,-45px) scale(1.06)}70%{transform:translate(-25px,30px) scale(.96)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes cardPop{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
@keyframes spinning{to{transform:rotate(360deg)}}
@keyframes t-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes t-out{to{opacity:0;transform:translateY(8px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 var(--p-glow)}50%{box-shadow:0 0 0 8px transparent}}
@keyframes notifBadge{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes dotPop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

/* ══════════════════════════════════════════
   BG MESH
══════════════════════════════════════════ */
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(110px);animation:drift 18s ease-in-out infinite}
.o1{width:750px;height:750px;background:rgba(139,92,246,.13);top:-220px;right:-220px}
.o2{width:560px;height:560px;background:rgba(236,72,153,.08);bottom:-160px;left:-130px;animation-delay:-7s}
.o3{width:430px;height:430px;background:rgba(56,189,248,.06);top:40%;left:35%;animation-delay:-13s}

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
.nav{position:fixed;top:0;left:0;right:0;z-index:600;height:var(--nav-h);background:linear-gradient(135deg,#08011e 0%,#150840 100%);border-bottom:1px solid rgba(139,92,246,.22);display:flex;align-items:center;padding:0 clamp(12px,3vw,36px);gap:14px;box-shadow:0 8px 40px rgba(0,0,0,.4);direction:ltr;animation:slideDown .45s ease;}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.nav-mark{width:40px;height:40px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,#7c3cff,#00d879 58%,#ff4fd8);display:grid;place-items:center;font-weight:900;font-size:.9rem;color:#fff;font-family:'Outfit',sans-serif;box-shadow:0 8px 24px rgba(0,216,121,.25);transition:var(--tr);animation:glowPulse 3s ease-in-out infinite;}
.nav-mark:hover{transform:scale(1.08) rotate(-4deg)}
.nav-name{font-family:'Outfit',sans-serif;font-weight:900;font-size:1.18rem;letter-spacing:-.02em;color:#fff}
.nav-name em{font-style:normal;color:var(--p3)}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;justify-content:center;direction:rtl}
.nl-btn{background:transparent;border:none;color:rgba(255,255,255,.62);font-weight:700;font-size:.84rem;cursor:pointer;padding:7px 13px;border-radius:10px;transition:var(--tr);white-space:nowrap;display:flex;align-items:center;gap:5px;}
.nl-btn:hover{background:rgba(255,255,255,.09);color:#fff;transform:translateY(-1px)}
.nl-btn.active-nav{background:rgba(139,92,246,.22);color:#fff;border:1px solid rgba(139,92,246,.3)}
.nl-btn.cart-btn{background:rgba(139,92,246,.16);color:var(--p3);border:1px solid rgba(139,92,246,.28)}
.nl-btn.cart-btn:hover{background:rgba(139,92,246,.26)}
.nav-end{display:flex;align-items:center;gap:9px;flex-shrink:0}
.ctrl-pill{display:flex;align-items:center;gap:1px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:3px}
.ctrl-side{width:30px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:.82rem;color:rgba(255,255,255,.45);cursor:pointer;border:none;background:none;transition:var(--tr)}
.ctrl-side.on{background:rgba(255,255,255,.16);color:#fff}
.lang-pill{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:3px}
.lang-btn{padding:4px 11px;border:none;background:transparent;color:rgba(255,255,255,.5);border-radius:999px;cursor:pointer;font-weight:800;font-size:.7rem;transition:var(--tr);letter-spacing:.04em}
.lang-btn.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 2px 10px var(--p-glow)}
.nav-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--p1),var(--p2));display:grid;place-items:center;font-weight:800;font-size:.86rem;color:#fff;cursor:pointer;box-shadow:0 3px 14px var(--p-glow);border:2px solid rgba(255,255,255,.2);transition:var(--tr);}
.nav-av:hover{transform:scale(1.1)}
.badge{background:var(--danger);color:#fff;font-size:.62rem;font-weight:900;padding:2px 7px;border-radius:999px;line-height:1}

/* ══════════════════════════════════════════
   BREADCRUMB
══════════════════════════════════════════ */
.bc{position:fixed;top:var(--nav-h);left:0;right:0;height:var(--bc-h);z-index:500;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 clamp(12px,3vw,36px);gap:6px;direction:rtl;}
[data-lang="en"] .bc{direction:ltr}
.bc-item{font-size:.8rem;color:var(--t3);cursor:pointer;padding:3px 9px;border-radius:7px;transition:var(--tr);white-space:nowrap;font-weight:600}
.bc-item:hover{color:var(--text);background:var(--glass)}
.bc-item.active{color:var(--text);font-weight:800;cursor:default}
.bc-sep{color:var(--t3);font-size:.65rem}

/* ══════════════════════════════════════════
   PAGE WRAPPER
══════════════════════════════════════════ */
.pw{padding-top:calc(var(--nav-h) + var(--bc-h));background:var(--bg);min-height:100vh;position:relative;z-index:1}
.pg{display:none;max-width:1320px;margin:0 auto;padding:0 clamp(12px,3vw,36px) 100px}
.pg.on{display:block;animation:fadeIn .3s ease}

/* ══════════════════════════════════════════
   SEC HERO
══════════════════════════════════════════ */
.sec-hero{text-align:center;padding:28px 20px 20px}
.sec-title{font-size:clamp(1.3rem,2.8vw,1.85rem);font-weight:900;letter-spacing:-.04em;margin-bottom:6px;font-family:'Outfit',sans-serif}
.sec-sub{font-size:.88rem;color:var(--t3);font-weight:600}

/* ══════════════════════════════════════════
   GRIDS
══════════════════════════════════════════ */
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.ls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}

/* ══════════════════════════════════════════
   SKELETON LOADER
══════════════════════════════════════════ */
.skel{background:linear-gradient(90deg,var(--skel) 25%,var(--skel-s) 50%,var(--skel) 75%);background-size:700px 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:10px;}
.skel-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:210px;}
.skel-circle{width:70px;height:70px;border-radius:50%}
.skel-rect{width:80%;height:14px}
.skel-rect-sm{width:55%;height:10px}

/* ══════════════════════════════════════════
   SUBJECT CARD
══════════════════════════════════════════ */
.sub-card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px 20px;text-align:center;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:cardPop .45s ease both;}
.sub-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--shine),transparent 60%);pointer-events:none}
.sub-card:hover{transform:translateY(-7px);box-shadow:var(--shadow-lg);border-color:var(--border-h)}
.sub-card:hover .sub-icon{transform:scale(1.1) rotate(-2deg)}
.sub-icon{width:76px;height:76px;border-radius:20px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;overflow:hidden;box-shadow:var(--shadow);transition:transform .25s ease;}
.sub-icon img{width:76px;height:76px;object-fit:cover;border-radius:20px}
.sub-name{font-weight:900;font-size:1rem;margin-bottom:9px}

/* ══════════════════════════════════════════
   TEACHER CARD
══════════════════════════════════════════ */
.tch-card{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:var(--r-xl);padding:26px 18px;text-align:center;cursor:pointer;transition:.25s ease;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:cardPop .45s ease both;}
.tch-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--shine),transparent 60%);pointer-events:none}
.tch-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--border-h)}
.tch-card:hover .tch-av{transform:scale(1.08);box-shadow:0 6px 22px var(--p-glow)}
.tch-av{width:70px;height:70px;border-radius:50%;margin:0 auto 13px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;color:#fff;overflow:hidden;box-shadow:0 4px 16px var(--p-glow);border:2px solid rgba(139,92,246,.3);transition:.25s ease;}
.tch-av img{width:70px;height:70px;border-radius:50%;object-fit:cover}
.tch-name{font-weight:900;font-size:.94rem;margin-bottom:5px}
.tch-bio{font-size:.75rem;color:var(--t3);line-height:1.55}

/* ══════════════════════════════════════════
   CHAPTER CARD
══════════════════════════════════════════ */
.ch-card{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:var(--r-xl);min-height:280px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.25s ease;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;animation:cardPop .45s ease both;}
.ch-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--shine),transparent 55%);pointer-events:none}
.ch-card:hover{transform:translateY(-7px);box-shadow:var(--shadow-lg);border-color:var(--border-h)}
.ch-img-box{width:100px;height:100px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:2.6rem;overflow:hidden;margin-bottom:18px;border:1px solid var(--border);background:var(--p-faint);transition:transform .25s ease;}
.ch-card:hover .ch-img-box{transform:scale(1.08) rotate(2deg)}
.ch-img-box img{width:100%;height:100%;object-fit:cover}
.ch-title{font-size:1.05rem;font-weight:900;color:var(--text);margin-bottom:6px}
.ch-count{font-size:.8rem;color:var(--t3)}

/* ══════════════════════════════════════════
   LESSON CARD
══════════════════════════════════════════ */
.ls-card{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:var(--r-xl);min-height:280px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:.25s ease;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:cardPop .45s ease both;}
.ls-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--shine),transparent 55%);pointer-events:none}
.ls-card.clickable{cursor:pointer}
.ls-card.clickable:hover{transform:translateY(-7px);box-shadow:var(--shadow-lg);border-color:var(--border-h)}
.ls-card.locked{opacity:.6;cursor:not-allowed}
/* Expired specific styles */
.ls-card.expired { opacity: 1; border-color: rgba(244,63,94,0.3); background: rgba(244,63,94,0.02); }

.ls-thumb{width:96px;height:96px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:2.2rem;overflow:hidden;margin-bottom:16px;flex-shrink:0;background:var(--p-faint);border:1px solid var(--border);transition:transform .25s ease;}
.ls-card.clickable:hover .ls-thumb{transform:scale(1.07)}
.ls-thumb img{width:100%;height:100%;object-fit:cover}
.ls-num{font-size:.72rem;color:var(--t3);font-weight:700;margin-bottom:5px;letter-spacing:.07em;text-transform:uppercase}
.ls-title{font-size:1rem;font-weight:900;color:var(--text);margin-bottom:6px}
.ls-desc{font-size:.79rem;color:var(--t3);line-height:1.58;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.ls-action{margin-top:auto;padding-top:10px;width:100%}

/* ══════════════════════════════════════════
   CHIPS
══════════════════════════════════════════ */
.chip{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:.69rem;font-weight:700;white-space:nowrap}
.ck-ok{background:rgba(52,211,153,.1);color:var(--ok);border:1px solid rgba(52,211,153,.22)}
.ck-muted{background:var(--glass);color:var(--t3);border:1px solid var(--border)}

/* ══════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════ */
.btn{border:none;border-radius:var(--r-sm);padding:10px 18px;font-weight:700;cursor:pointer;font-size:.86rem;transition:.2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 4px 16px var(--p-glow)}
.btn-primary:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 6px 22px var(--p-glow)}
.btn-primary:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn-danger{background:rgba(244,63,94,.1);color:var(--danger);border:1px solid rgba(244,63,94,.2)}
.btn-danger:hover{background:rgba(244,63,94,.18)}
.btn-gold{background:rgba(251,191,36,.1);color:var(--gold);border:1px solid rgba(251,191,36,.22)}
.btn-gold:hover{background:rgba(251,191,36,.18)}
.btn-sm{padding:6px 12px;font-size:.77rem;border-radius:8px}

/* ══════════════════════════════════════════
   TOAST & EMPTY
══════════════════════════════════════════ */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:var(--bg2);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:14px;padding:11px 18px;box-shadow:var(--shadow-lg);animation:t-in .22s ease;pointer-events:all;white-space:nowrap;font-weight:700;font-size:.83rem}
.t-ok{border-color:rgba(52,211,153,.35)}.t-err{border-color:rgba(244,63,94,.35)}
.t-exit{animation:t-out .2s ease forwards}
.empty-st{display:flex;flex-direction:column;align-items:center;padding:50px;gap:11px;color:var(--t3);text-align:center}
.empty-ico{font-size:2.8rem;opacity:.75}
.empty-txt{font-size:.86rem;line-height:1.65}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="ld-logo">KW</div>
  <div class="ld-brand">kala<em>wy</em></div>
  <div class="ld-bar-wrap"><div class="ld-bar"></div></div>
  <div class="ld-tip" id="ld-tip">جاري التحميل...</div>
</div>

<div class="bg-mesh" aria-hidden="true">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
</div>
<div id="toasts"></div>

<script>
/* ══════════════════════════════════════
   CONFIG & STATE
══════════════════════════════════════ */
const SB_URL  = "https://xzjxmfgymbvordumrush.supabase.co";
const SB_ANON = "sb_publishable_yDrrS95uLq4ch8pu0OwZ0w_6UiBx22e";
const sb = window.supabase.createClient(SB_URL, SB_ANON, {auth:{persistSession:true,autoRefreshToken:true}});

let ME = null, LANG = 'ar', THEME = 'light';
let _unlockedLessons = new Set(), _expiredLessons = new Set(), _cart = [];
let _sel = { sub:null, tch:null, ch:null };

const EMOJIS = {'الرياضيات':'📐','الفيزياء':'🔭','الكيمياء':'🧪','الأحياء':'🔬','اللغة العربية':'📖','اللغة الإنجليزية':'🌍'};
const PALETTES_DARK = ['linear-gradient(135deg,#1a1040,#0d0820)','linear-gradient(135deg,#1a0a35,#0d0520)','linear-gradient(135deg,#200a40,#10051f)','linear-gradient(135deg,#0a1040,#050820)','linear-gradient(135deg,#25104a,#120528)','linear-gradient(135deg,#10082a,#080414)'];
const PALETTES_LIGHT = ['linear-gradient(135deg,#e8d8ff,#d4c0f8)','linear-gradient(135deg,#ddd0ff,#c8b4f8)','linear-gradient(135deg,#f0e4ff,#ddd0ff)','linear-gradient(135deg,#e0d0ff,#cec0f8)','linear-gradient(135deg,#ece0ff,#d8c8ff)','linear-gradient(135deg,#d8ccff,#c8bcf0)'];

const S = {
  ar: {
    home: '🏠 الرئيسية', myLessons: '📚 حصصي', cartNav: 'سلة الشراء',
    chooseSubject: '📚 اختار المادة', chooseSubjectSub: 'اختار المادة اللي عايز تذاكرها',

    noSubjects: 'لا توجد مواد', noTeachers: 'لا يوجد مدرسين', noChapters: 'لا توجد شابترات', noLessons: 'لا توجد حصص',
    lesson: 'الحصة', unavailable: 'غير متاحة', unlocked: 'مفتوحة — ادخل', inCart: 'اكمل الدفع', addCart: 'أضف للسلة',
    myTitle: '📚 حصصي المفتوحة', mySub: 'الحصص اللي فتحتها بالكود', noMyLessons: 'لم تفتح أي حصة بعد',
    cartTitle: '🛒 سلة الشراء', cartSub: 'ادخل كود كل حصة عشان تفتحها', cartEmpty: 'السلة فارغة',
    alreadyUnlocked: 'الحصة مفتوحة بالفعل ✅', addedCart: 'أُضيف للسلة', enterCode: 'ادخل كود الحصة', goToCart: '🛒 اكمل الدفع',
    expiredMsgTitle: '⏳ وقت الحصة انتهى', buyAgainBtn: '🔄 اشتري تاني',

  },
  en: {
    home: '🏠 Home', myLessons: '📚 My Lessons', cartNav: 'Cart',
    chooseSubject: '📚 Choose Subject', chooseSubjectSub: 'Select a subject to study',
    chooseTeacher: '👨‍🏫 Choose Teacher', chooseChapter: '📖 Choose Chapter', chooseChapterSub: 'Select the chapter',
    noSubjects: 'No subjects', noTeachers: 'No teachers', noChapters: 'No chapters', noLessons: 'No lessons',
    lesson: 'Lesson', unavailable: 'Unavailable', unlocked: 'Unlocked — Enter', inCart: 'Go to Cart', addCart: 'Add to Cart',
    myTitle: '📚 My Lessons', mySub: 'Lessons unlocked with your code', noMyLessons: 'No unlocked lessons yet',
    cartTitle: '🛒 Cart', cartSub: 'Enter code to unlock', cartEmpty: 'Cart is empty',
    alreadyUnlocked: 'Already unlocked ✅', addedCart: 'Added to cart', enterCode: 'Enter code', goToCart: '🛒 Go to Cart',
    expiredMsgTitle: '⏳ Lesson Expired', buyAgainBtn: '🔄 Buy Again',
    bcHome: 'Home', bcBrowse: 'Subjects'
  }
};
function t(k) { return S[LANG]?.[k] ?? S.ar[k] ?? k; }
function pal(i){return(THEME==='dark'?PALETTES_DARK:PALETTES_LIGHT)[i%6];}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ══════════════════════════════════════
   IMAGE HELPERS (Original)
══════════════════════════════════════ */
function imgSrc(v){
  if(!v)return''; v=String(v).trim(); if(!v)return''; 
  if(/^(https?:|data:|blob:)/.test(v))return v; 
  if(v.startsWith('/storage/v1/object/public/'))return SB_URL+v; 
  return`${SB_URL}/storage/v1/object/public/kalawy/${v.replace(/^\/+/,'').replace(/^kalawy\//,'')}`;
}
function imgSafe(v){return imgSrc(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

/* ══════════════════════════════════════
   UI & I18N
══════════════════════════════════════ */
function setTheme(th) { THEME = th; document.documentElement.setAttribute('data-theme', th); localStorage.setItem('kw-theme', th); ['n-dark', 'n-light'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.toggle('on', id === 'n-dark' ? th === 'dark' : th === 'light'); }); }
function setLang(lg) { LANG = lg; document.documentElement.setAttribute('lang', lg); document.documentElement.setAttribute('dir', lg === 'ar' ? 'rtl' : 'ltr'); document.documentElement.setAttribute('data-lang', lg); localStorage.setItem('kw-lang', lg); ['n-ar', 'n-en'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.toggle('on', id.endsWith(lg)); }); applyI18n(); if (ME) { updateBc(); if(_sel.ch) selChapter(_sel.ch.id, _sel.ch.title); } }
function applyI18n() {
  const set = (id, k) => { const el = document.getElementById(id); if (el) el.textContent = t(k); };
  set('nl-home', 'home'); set('nl-my', 'myLessons'); set('sub-title', 'chooseSubject'); set('sub-sub', 'chooseSubjectSub');
  set('tch-title', 'chooseTeacher'); set('ch-title', 'chooseChapter'); set('ch-sub', 'chooseChapterSub');
  set('my-title', 'myTitle'); set('my-sub', 'mySub'); set('cart-title', 'cartTitle'); set('cart-sub', 'cartSub');
  const ldTip = document.getElementById('ld-tip'); if (ldTip) ldTip.textContent = LANG === 'ar' ? 'جاري التحميل...' : 'Loading...';
}
function toast(type, msg) {
  const ic = { s: '✅', e: '❌', w: '⚠️', i: 'ℹ️' }, cl = { s: 't-ok', e: 't-err', w: '', i: '' };
  const wrap = document.getElementById('toasts'), el = document.createElement('div');
  el.className = `toast ${cl[type] || ''}`; el.innerHTML = `<span>${ic[type]}</span><span>${msg}</span>`;
  wrap.appendChild(el); setTimeout(() => { el.classList.add('t-exit'); setTimeout(() => el.remove(), 220); }, 3500);
}
function updateCartBadge() { const b = document.getElementById('cart-badge'); if (!b) return; if (_cart.length) { b.textContent = _cart.length; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
function skeletonCards(count = 6, gridId) { const g = document.getElementById(gridId); if (!g) return; g.innerHTML = Array.from({ length: count }, () => `<div class="skel-card"><div class="skel skel-circle" style="margin-bottom:4px"></div><div class="skel skel-rect"></div><div class="skel skel-rect-sm"></div></div>`).join(''); }

/* ══════════════════════════════════════
   ROUTING
══════════════════════════════════════ */
function goPage(page) {
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('on')); document.getElementById(`pg-${page}`)?.classList.add('on');
  ['nl-home', 'nl-my', 'nl-cart'].forEach(id => document.getElementById(id)?.classList.remove('active-nav'));
  const navMap = { mylessons: 'nl-my', cart: 'nl-cart', browse: 'nl-home' }; if (navMap[page]) document.getElementById(navMap[page])?.classList.add('active-nav');
  if (page === 'mylessons') loadMyLessons(); if (page === 'cart') renderCart();
}
function showStep(s) { ['sub', 'tch', 'ch', 'ls'].forEach(x => { const el = document.getElementById(`s-${x}`); if (el) el.classList.toggle('hidden', x !== s); }); updateBc(); }
function resetAll() { _sel = { sub: null, tch: null, ch: null }; showStep('sub'); goPage('browse'); }
function resetTo(s) { if (s === 'sub') { _sel = { sub: null, tch: null, ch: null }; showStep('sub'); } else if (s === 'tch') { _sel.tch = null; _sel.ch = null; showStep('tch'); } }
function updateBc() {
  const bc = document.getElementById('navBc'); if (!bc) return;
  const sep = () => `<span class="bc-sep">›</span>`;
  let html = `<span class="bc-item" onclick="resetAll()">${t('bcHome')}</span>`; html += sep() + `<span class="bc-item">${t('bcBrowse')}</span>`;
  if (_sel.sub) html += sep() + `<span class="bc-item" onclick="resetTo('sub')">${_sel.sub.name}</span>`;
  if (_sel.tch) html += sep() + `<span class="bc-item" onclick="resetTo('tch')">${_sel.tch.name}</span>`;
  if (_sel.ch) html += sep() + `<span class="bc-item active">${_sel.ch.title}</span>`;
  bc.innerHTML = html;
}

/* ══════════════════════════════════════
   ✨ ENROLLMENTS & EXPIRATION LOGIC
══════════════════════════════════════ */
async function loadEnrollments() {
  const { data: unlocked } = await sb.from('lesson_codes').select('lesson_id, expires_at').eq('used_by', ME.id);
  _unlockedLessons.clear(); 
  _expiredLessons.clear(); 
  const now = new Date();
  
  (unlocked || []).forEach(row => {
    if (!row.lesson_id) return;
    if (row.expires_at && new Date(row.expires_at) < now) {
      _expiredLessons.add(row.lesson_id);
    } else {
      _unlockedLessons.add(row.lesson_id);
    }
  });

  // If a student re-bought it, they might have both an expired code and an active one.
  _unlockedLessons.forEach(id => _expiredLessons.delete(id));
}

/* ══════════════════════════════════════
   DATA FETCHING (SUBJECTS -> LESSONS)
══════════════════════════════════════ */
async function loadSubjects() {
  skeletonCards(6, 'sub-grid'); const { data } = await sb.from('subjects').select('id,name_ar,grade_id,image_url').order('name_ar');
  const g = document.getElementById('sub-grid'); if (!data?.length) { g.innerHTML = `<div class="empty-st" style="grid-column:1/-1"><div class="empty-txt">${t('noSubjects')}</div></div>`; return; }
  g.innerHTML = data.map((s, i) => {
    const name = s.name_ar || 'Subject'; const ico = EMOJIS[name] || '📚';
    const thumb = s.image_url ? `<img src="${imgSafe(s.image_url)}" alt="" style="width:76px;height:76px;object-fit:cover;border-radius:20px" onerror="this.parentElement.innerHTML='${ico}'" loading="lazy">` : `<div style="font-size:2.2rem;width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:${pal(i)}">${ico}</div>`;
    return `<div class="sub-card" style="animation-delay:${i * 0.06}s" onclick="selSub('${s.id}','${esc(name)}',${s.grade_id || 3})">
      <div class="sub-icon">${thumb}</div>
      <div class="sub-name">${esc(name)}</div>
    </div>`;
  }).join('');
}

async function selSub(id, name, gradeId) {
  _sel = { sub: { id, name, grade_id: gradeId }, tch: null, ch: null }; showStep('tch'); skeletonCards(3, 'tch-grid');
  const { data: chaps } = await sb.from('chapters').select('teacher_id').eq('subject_id', id);
  const tIds = [...new Set((chaps || []).map(c => c.teacher_id).filter(Boolean))];
  const g = document.getElementById('tch-grid'); if (!tIds.length) { g.innerHTML = `<div class="empty-st" style="grid-column:1/-1"><div class="empty-txt">${t('noTeachers')}</div></div>`; return; }
  const { data: profs } = await sb.from('profiles').select('id,full_name,image_url').in('id', tIds);
  g.innerHTML = (profs || []).map((p, i) => {
    const av = p.image_url ? `<img src="${imgSafe(p.image_url)}" alt="" style="width:70px;height:70px;border-radius:50%;object-fit:cover" onerror="this.parentElement.innerHTML='${(p.full_name || '?')[0].toUpperCase()}'" loading="lazy">` : (p.full_name || '?')[0].toUpperCase();
    return `<div class="tch-card" style="animation-delay:${i * 0.07}s" onclick="selTch('${p.id}','${esc(p.full_name || p.id)}')">
      <div class="tch-av" style="${p.image_url ? '' : 'background:linear-gradient(135deg,var(--p1),var(--p2))'}">${av}</div>
      <div class="tch-name">${p.full_name || '—'}</div>
    </div>`;
  }).join('');
}

async function selTch(id, name) {
  _sel.tch = { id, name }; _sel.ch = null; showStep('ch'); skeletonCards(4, 'ch-grid');
  const { data } = await sb.from('chapters').select('id,title,image_url').eq('subject_id', _sel.sub.id).eq('teacher_id', id).order('sort_order');
  const g = document.getElementById('ch-grid'); if (!data?.length) { g.innerHTML = `<div class="empty-st" style="grid-column:1/-1"><div class="empty-txt">${t('noChapters')}</div></div>`; return; }
  const books = ['📘','📗','📙','📕','📓','📔'];
  g.innerHTML = data.map((ch, i) => {
    const thumb = ch.image_url ? `<img src="${imgSafe(ch.image_url)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='${books[i % 6]}'" loading="lazy">` : `<div style="width:100%;height:100%;background:${pal(i)};display:grid;place-items:center;font-size:2.6rem">${books[i % 6]}</div>`;
    return `<div class="ch-card" style="animation-delay:${i * 0.07}s" onclick="selChapter('${ch.id}','${esc(ch.title)}')">
      <div class="ch-img-box">${thumb}</div>
      <div class="ch-title">${ch.title}</div>
    </div>`;
  }).join('');
}

async function selChapter(id, title) {
  _sel.ch = { id, title }; showStep('ls'); skeletonCards(4, 'ls-grid'); await loadEnrollments();
  const { data } = await sb.from('lessons').select('id,title,description,is_active,scheduled_at,image_url').eq('chapter_id', id).order('created_at');
  const g = document.getElementById('ls-grid'); if (!data?.length) { g.innerHTML = `<div class="empty-st" style="grid-column:1/-1"><div class="empty-txt">${t('noLessons')}</div></div>`; return; }
  
  const now = new Date();
  g.innerHTML = data.map((l, i) => {
    const sched = l.scheduled_at ? new Date(l.scheduled_at) : null;
    const future = sched && sched > now;
    
    // ✨ Check States
    const unlocked = _unlockedLessons.has(l.id);
    const expired = !unlocked && _expiredLessons.has(l.id); 
    const inCart = _cart.some(c => c.id === l.id);
    const canOpen = l.is_active && !future && unlocked;
    
    // ✨ Thumbnail with Grayscale if Expired
    const thumbImg = l.image_url 
      ? `<img src="${imgSafe(l.image_url)}" alt="" style="width:100%;height:100%;object-fit:cover; ${expired ? 'filter:grayscale(1) opacity(0.8)' : ''}" onerror="this.parentElement.innerHTML='🎬'" loading="lazy">` 
      : (future ? '⏰' : (unlocked ? '🎬' : (expired ? '⏳' : '🔑')));
    
    const thumb = `<div class="ls-thumb">${thumbImg}</div>`;
    
    const lData = JSON.stringify({ id: l.id, title: l.title, description: l.description || '', image_url: l.image_url || '', chapter_id: id, chapter_title: title }).replace(/"/g, '&quot;');
    
    let action = '';
    if (!l.is_active) {
      action = `<span class="chip ck-muted">${t('unavailable')}</span>`;
    } else if (future) {
      action = `<span class="chip ck-muted">⏰ ${sched.toLocaleString(LANG === 'ar' ? 'ar-EG' : 'en-US', { dateStyle: 'short', timeStyle: 'short' })}</span>`;
    } else if (unlocked) {
      action = `<span class="chip ck-ok" style="cursor:pointer" onclick="goLesson('${l.id}')">✅ ${t('unlocked')}</span>`;
    } else if (inCart) {
      action = `<button class="btn btn-gold btn-sm" onclick="event.stopPropagation();goPage('cart')">${t('goToCart')}</button>`;
    } else if (expired) {
      // ✨ Expired Action
      action = `
        <div style="text-align:center;width:100%">
          <div style="color:var(--danger);font-size:0.75rem;font-weight:bold;margin-bottom:6px">${t('expiredMsgTitle')}</div>
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();addCart(${lData})">${t('buyAgainBtn')}</button>
        </div>`;
    } else {
      action = `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();addCart(${lData})">${t('addCart')}</button>`;
    }

    const lockedClass = canOpen ? 'clickable' : (l.is_active && !future && !expired ? '' : (expired ? 'locked expired' : 'locked'));

    return `<div class="ls-card ${lockedClass}" style="animation-delay:${i * 0.07}s" ${canOpen ? `onclick="goLesson('${l.id}')"` : ''}>
      ${thumb}
      <div class="ls-num">${t('lesson')} ${i + 1}</div>
      <div class="ls-title">${l.title}</div>
      ${l.description ? `<div class="ls-desc">${l.description}</div>` : ''}
      <div class="ls-action" style="text-align:center; width:100%">${action}</div>
    </div>`;
  }).join('');
}

function goLesson(id) { window.location.href = `/lesson/?id=${id}`; }

/* ══════════════════════════════════════
   CART LOGIC
══════════════════════════════════════ */
function addCart(lesson) {
  if (_unlockedLessons.has(lesson.id)) { toast('w', t('alreadyUnlocked')); return; }
  if (_cart.some(c => c.id === lesson.id)) { toast('i', 'موجودة في السلة بالفعل'); return; }
  _cart.push(lesson); localStorage.setItem(`kw-cart-${ME.id}`, JSON.stringify(_cart)); updateCartBadge();
  toast('s', `${t('addedCart')}: ${lesson.title}`);
  if (_sel.ch) selChapter(_sel.ch.id, _sel.ch.title);
}
function rmCart(lessonId) {
  _cart = _cart.filter(c => c.id !== lessonId); localStorage.setItem(`kw-cart-${ME.id}`, JSON.stringify(_cart)); updateCartBadge();
  if (document.getElementById('pg-cart').classList.contains('on')) renderCart();
  if (_sel.ch) selChapter(_sel.ch.id, _sel.ch.title);
}
function renderCart() {
  const c = document.getElementById('cart-content');
  if (!_cart.length) { c.innerHTML = `<div class="empty-st"><div class="empty-ico">🛒</div><div class="empty-txt">${t('cartEmpty')}</div></div>`; return; }
  
  c.innerHTML = _cart.map(ls => {
    const th = ls.image_url ? `<img src="${imgSafe(ls.image_url)}" alt="" style="width:66px;height:52px;object-fit:cover;border-radius:10px" onerror="this.outerHTML='🎬'" loading="lazy">` : '🎬';
    return `<div style="display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:center; padding:16px; background:var(--card); border:1px solid var(--border); border-radius:var(--r-sm); margin-bottom:12px;">
      <div style="display:flex; align-items:center; gap:12px; font-weight:800; min-width:120px;">
        <div style="width:66px;height:52px;border-radius:10px;background:var(--p-faint);display:flex;align-items:center;justify-content:center;font-size:1.3rem;">${th}</div>
        <div>${ls.title}</div>
      </div>
      <div style="display:flex; gap:8px; flex:1; justify-content:flex-end;">
        <input id="pc-${ls.id}" placeholder="${t('enterCode')}" style="padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); outline:none; text-transform:uppercase; max-width:200px; width:100%;" oninput="this.value=this.value.toUpperCase()">
        <button class="btn btn-primary" style="width:auto; padding:8px 16px;" onclick="checkoutLesson('${ls.id}')" id="cobtn-${ls.id}">✓</button>
        <button class="btn btn-danger" style="width:auto; padding:8px 12px;" onclick="rmCart('${ls.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

async function checkoutLesson(lessonId) {
  const inp = document.getElementById(`pc-${lessonId}`); const code = inp?.value.trim().toUpperCase(); const btn = document.getElementById(`cobtn-${lessonId}`);
  if (!code) { toast('w', t('enterCode')); return; }
  btn.innerHTML = '...'; btn.disabled = true;
  
  const { data: row, error } = await sb.from('lesson_codes').select('id,lesson_id,used_by').eq('code', code).single();
  if (error || !row) { toast('e', 'الكود غير صحيح'); btn.innerHTML = '✓'; btn.disabled = false; return; }
  if (row.lesson_id !== lessonId) { toast('e', 'هذا الكود لحصة أخرى'); btn.innerHTML = '✓'; btn.disabled = false; return; }
  if (row.used_by) { toast('e', 'تم استخدام الكود من قبل'); btn.innerHTML = '✓'; btn.disabled = false; return; }
  
  const { error: upErr } = await sb.from('lesson_codes').update({ used_by: ME.id, used_at: new Date().toISOString() }).eq('id', row.id);
  if (upErr) { toast('e', upErr.message); btn.innerHTML = '✓'; btn.disabled = false; return; }
  
  _cart = _cart.filter(c => c.id !== lessonId); localStorage.setItem(`kw-cart-${ME.id}`, JSON.stringify(_cart)); updateCartBadge();
  toast('s', `تم فتح الحصة بنجاح 🎉`); renderCart(); if (_sel.ch) selChapter(_sel.ch.id, _sel.ch.title);
}

/* ══════════════════════════════════════
   MY LESSONS
══════════════════════════════════════ */
async function loadMyLessons() {
  const el = document.getElementById('my-list'); el.innerHTML = `<div class="skel-card" style="grid-column:1/-1; min-height:100px;"></div>`;
  await loadEnrollments();
  if (!_unlockedLessons.size) { el.innerHTML = `<div class="empty-st" style="grid-column:1/-1"><div class="empty-ico">🔑</div><div class="empty-txt">${t('noMyLessons')}</div></div>`; return; }
  const { data } = await sb.from('lessons').select('id,title,image_url').in('id', [..._unlockedLessons]).eq('is_active', true);
  
  el.innerHTML = (data || []).map((ls, i) => {
    const thumbImg = ls.image_url ? `<img src="${imgSafe(ls.image_url)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='🎬'" loading="lazy">` : `🎬`;
    return `<div class="ch-card clickable" onclick="goLesson('${ls.id}')" style="animation-delay:${i * 0.05}s">
      <div class="ch-img-box">${thumbImg}</div>
      <div class="ch-title">${ls.title}</div>
      <span class="chip ck-ok" style="margin-top:10px">✅ ${t('unlocked')}</span>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════
   BOOTSTRAP
══════════════════════════════════════ */
async function checkSession() {
  setTheme(localStorage.getItem('kw-theme') || 'light'); setLang(localStorage.getItem('kw-lang') || 'ar');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.replace('/login'); return; }
  const user = session.user; ME = { id: user.id, email: user.email, full_name: user.user_metadata?.full_name || 'طالب' };
  try { _cart = JSON.parse(localStorage.getItem(`kw-cart-${ME.id}`) || '[]'); } catch { _cart = []; }
  
  document.getElementById('mainNav').style.display = 'flex'; document.getElementById('bcStrip').style.display = 'flex';
  document.getElementById('pr-nm').textContent = ME.full_name; document.getElementById('pr-em').textContent = ME.email;
  
  updateCartBadge(); setTimeout(() => { document.getElementById('loadingScreen').classList.add('fade-out'); loadSubjects(); }, 600);
}
async function doLogout() { await sb.auth.signOut(); window.location.replace('/login'); }

window.addEventListener('DOMContentLoaded', checkSession);
</script>
